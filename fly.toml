# fly.toml
# Replace "spelling-app" with your chosen app name (must be globally unique on Fly)
app = "spelling-app"
primary_region = "lhr"

[env]
  DB_PATH    = "/data/spelling.db"
  AUDIO_DIR  = "/data/audio"
  HTTPS_ONLY = "true"

[[mounts]]
  source      = "spelling_data"
  destination = "/data"

[http_service]
  internal_port        = 8000
  force_https          = true
  auto_stop_machines   = true
  auto_start_machines  = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

[vm]
  size = "shared-cpu-1x"
