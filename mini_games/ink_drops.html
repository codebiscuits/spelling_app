<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body { margin:0; overflow:hidden; background:#0a0a15; }
canvas { display:block; }
#ui {
  position: fixed; top: 16px; left: 16px; color: #ccc; font-size: 13px;
  pointer-events: none; z-index: 10; background: rgba(10,10,20,0.75);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
  padding: 14px 18px; backdrop-filter: blur(10px); line-height: 1.7;
  min-width: 220px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
#ui h3 { color: #fff; margin-bottom: 6px; font-size: 14px; letter-spacing: 0.5px; }
#ui .param { display: flex; justify-content: space-between; gap: 12px; }
#ui .key { color: #888; }
#ui .val { color: #6cf; font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h3>💧 Ink Drops</h3>
  <div class="param"><span class="key">Move</span><span class="val">Spawn ink blobs</span></div>
  <div class="param"><span class="key">Left Click</span><span class="val">Blob burst</span></div>
  <br>
  <div class="param"><span class="key">Blobs:</span><span class="val" id="blobCount">0</span></div>
</div>
<script>
const canvas = c;
const ctx = canvas.getContext("2d");

let w,h;
function resize(){ w=canvas.width=innerWidth; h=canvas.height=innerHeight; }
addEventListener("resize", resize);
resize();

let blobs=[];
const maxBlobs=80;

class Blob{
  constructor(x,y){
    this.x=x;
    this.y=y;
    this.radius=Math.random()*20+10;
    this.growth=Math.random()*0.6+0.2;
    this.life=200+Math.random()*200;
    this.hue=Math.random()*360;
  }
  update(){
    this.radius+=this.growth;
    this.life--;
  }
  draw(){
    const grad=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.radius);
    grad.addColorStop(0,`hsla(${this.hue},100%,60%,0.4)`);
    grad.addColorStop(1,`hsla(${this.hue},100%,60%,0)`);
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);
    ctx.fill();
  }
}

function spawn(x,y,n){
  for(let i=0;i<n;i++){
    if(blobs.length>maxBlobs) blobs.shift();
    blobs.push(new Blob(x,y));
  }
}

addEventListener("mousemove",e=>spawn(e.clientX,e.clientY,2));
addEventListener("click",e=>spawn(e.clientX,e.clientY,10));

function loop(){
  requestAnimationFrame(loop);
  ctx.fillStyle="rgba(10,10,21,0.1)";
  ctx.fillRect(0,0,w,h);

  blobs.forEach((b,i)=>{
    b.update();
    b.draw();
    if(b.life<=0) blobs.splice(i,1);
  });
  document.getElementById('blobCount').textContent = blobs.length;
}
loop();
</script>
</body>
</html>
