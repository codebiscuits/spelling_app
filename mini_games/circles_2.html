<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circles 2</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        class Circle {
            constructor(x, y, radius, color, speed) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.speed = speed;
                this.angle = Math.random() * Math.PI * 2;
            }

            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                if (this.x + this.radius > canvas.width || this.x - this.radius < 0) {
                    this.angle = Math.PI - this.angle;
                }
                if (this.y + this.radius > canvas.height || this.y - this.radius < 0) {
                    this.angle = -this.angle;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.closePath();
            }
        }

        let circles = [];
        for (let i = 0; i < 10; i++) {
            circles.push(new Circle(
                Math.random() * canvas.width,
                Math.random() * canvas.height,
                Math.random() * 20 + 10,
                `hsl(${Math.random() * 360}, 100%, 50%)`,
                Math.random() * 2 + 1
            ));
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            circles.forEach(circle => {
                circle.update();
                circle.draw();
            });
            requestAnimationFrame(animate);
        }

        animate();

        canvas.addEventListener('mousemove', (e) => {
            circles.forEach(circle => {
                const dx = e.clientX - circle.x;
                const dy = e.clientY - circle.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < 50) {
                    circle.radius = Math.random() * 20 + 10;
                    circle.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
                    circle.speed = Math.random() * 2 + 1;
                }
            });
        });

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) { // Left mouse button
                circles.push(new Circle(
                    e.clientX,
                    e.clientY,
                    Math.random() * 20 + 10,
                    `hsl(${Math.random() * 360}, 100%, 50%)`,
                    Math.random() * 2 + 1
                ));
            } else if (e.button === 2) { // Right mouse button
                circles.forEach(circle => {
                    circle.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
                });
            }
        });

        canvas.addEventListener('wheel', (e) => {
            circles.forEach(circle => {
                circle.radius += e.deltaY > 0 ? -1 : 1;
                if (circle.radius < 5) circle.radius = 5;
            });
        });
    </script>
</body>
</html>
