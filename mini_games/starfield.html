<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starfield</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; cursor: none; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    
    const stars = [];
    const numStars = 400;
    const mouse = { x: width / 2, y: height / 2, down: false };
    let speed = 5;
    let targetSpeed = 5;
    
    class Star {
      constructor() {
        this.reset();
      }
      
      reset() {
        this.x = (Math.random() - 0.5) * width * 2;
        this.y = (Math.random() - 0.5) * height * 2;
        this.z = Math.random() * width;
        this.pz = this.z;
      }
      
      update() {
        this.pz = this.z;
        this.z -= speed;
        
        if (this.z < 1) {
          this.reset();
          this.z = width;
          this.pz = this.z;
        }
      }
      
      draw() {
        const centerX = mouse.x;
        const centerY = mouse.y;
        
        const sx = (this.x / this.z) * width + centerX - width / 2;
        const sy = (this.y / this.z) * height + centerY - height / 2;
        
        const px = (this.x / this.pz) * width + centerX - width / 2;
        const py = (this.y / this.pz) * height + centerY - height / 2;
        
        const size = Math.max(0.1, (1 - this.z / width) * 3);
        const alpha = 1 - this.z / width;
        
        // Trail
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(sx, sy);
        ctx.strokeStyle = `rgba(200, 220, 255, ${alpha})`;
        ctx.lineWidth = size;
        ctx.stroke();
        
        // Star
        ctx.beginPath();
        ctx.arc(sx, sy, size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.fill();
      }
    }
    
    // Initialize stars
    for (let i = 0; i < numStars; i++) {
      stars.push(new Star());
    }
    
    function animate() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
      ctx.fillRect(0, 0, width, height);
      
      // Smooth speed transition
      speed += (targetSpeed - speed) * 0.05;
      
      for (const star of stars) {
        star.update();
        star.draw();
      }
      
      // Draw cursor
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, 5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(100, 150, 255, 0.8)';
      ctx.fill();
      
      requestAnimationFrame(animate);
    }
    
    canvas.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    
    canvas.addEventListener('mousedown', () => {
      mouse.down = true;
      targetSpeed = 30;
    });
    
    canvas.addEventListener('mouseup', () => {
      mouse.down = false;
      targetSpeed = 5;
    });
    
    canvas.addEventListener('mouseleave', () => {
      mouse.down = false;
      targetSpeed = 5;
    });
    
    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });
    
    animate();
  </script>
</body>
</html>
