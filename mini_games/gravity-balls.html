<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravity Balls</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0f0f1a; }
    canvas { display: block; cursor: pointer; }
    #ui {
      position: fixed; top: 16px; left: 16px; color: #ccc; font-size: 13px;
      pointer-events: none; z-index: 10; background: rgba(10,10,20,0.75);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
      padding: 14px 18px; backdrop-filter: blur(10px); line-height: 1.7;
      min-width: 220px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #ui h3 { color: #fff; margin-bottom: 6px; font-size: 14px; letter-spacing: 0.5px; }
    #ui .param { display: flex; justify-content: space-between; gap: 12px; }
    #ui .key { color: #888; }
    #ui .val { color: #6cf; font-weight: 600; font-variant-numeric: tabular-nums; }
    #resetBtn {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 10; padding: 10px 28px; font-size: 14px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ccc; background: rgba(10,10,20,0.80); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px; cursor: pointer; backdrop-filter: blur(10px);
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    #resetBtn:hover { background: rgba(40,40,80,0.90); color: #fff; border-color: rgba(255,255,255,0.30); }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <h3>🔵 Gravity Balls</h3>
    <div class="param"><span class="key">Left Click</span><span class="val">Spawn ball</span></div>
    <br>
    <div class="param"><span class="key">Balls:</span><span class="val" id="ballCount">0</span></div>
  </div>
  <button id="resetBtn">&#x21BA; Clear balls</button>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    
    const balls = [];
    const gravity = 0.4;
    const friction = 0.99;
    const bounce = 0.8;
    
    class Ball {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 10;
        this.vy = (Math.random() - 0.5) * 5;
        this.radius = Math.random() * 25 + 10;
        this.hue = Math.random() * 360;
        this.mass = this.radius;
      }
      
      update() {
        this.vy += gravity;
        this.vx *= friction;
        this.vy *= friction;
        this.x += this.vx;
        this.y += this.vy;
        
        // Bounce off walls
        if (this.x - this.radius < 0) {
          this.x = this.radius;
          this.vx *= -bounce;
        }
        if (this.x + this.radius > width) {
          this.x = width - this.radius;
          this.vx *= -bounce;
        }
        if (this.y + this.radius > height) {
          this.y = height - this.radius;
          this.vy *= -bounce;
        }
        if (this.y - this.radius < 0) {
          this.y = this.radius;
          this.vy *= -bounce;
        }
      }
      
      draw() {
        const gradient = ctx.createRadialGradient(
          this.x - this.radius * 0.3, this.y - this.radius * 0.3, 0,
          this.x, this.y, this.radius
        );
        gradient.addColorStop(0, `hsl(${this.hue}, 100%, 70%)`);
        gradient.addColorStop(1, `hsl(${this.hue}, 80%, 40%)`);
        
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
        
        // Shadow
        ctx.beginPath();
        ctx.ellipse(this.x, height - 5, this.radius * 0.8, this.radius * 0.2, 0, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0, 0, 0, ${0.3 * (1 - this.y / height)})`;
        ctx.fill();
      }
    }
    
    function checkCollisions() {
      for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
          const dx = balls[j].x - balls[i].x;
          const dy = balls[j].y - balls[i].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const minDist = balls[i].radius + balls[j].radius;
          
          if (dist < minDist) {
            const angle = Math.atan2(dy, dx);
            const overlap = minDist - dist;
            
            balls[i].x -= Math.cos(angle) * overlap * 0.5;
            balls[i].y -= Math.sin(angle) * overlap * 0.5;
            balls[j].x += Math.cos(angle) * overlap * 0.5;
            balls[j].y += Math.sin(angle) * overlap * 0.5;
            
            const v1 = { x: balls[i].vx, y: balls[i].vy };
            const v2 = { x: balls[j].vx, y: balls[j].vy };
            
            balls[i].vx = v2.x * bounce;
            balls[i].vy = v2.y * bounce;
            balls[j].vx = v1.x * bounce;
            balls[j].vy = v1.y * bounce;
          }
        }
      }
    }
    
    function animate() {
      ctx.fillStyle = 'rgba(15, 15, 26, 0.3)';
      ctx.fillRect(0, 0, width, height);
      
      checkCollisions();
      
      for (const ball of balls) {
        ball.update();
        ball.draw();
      }

      document.getElementById('ballCount').textContent = balls.length;
      requestAnimationFrame(animate);
    }
    
    canvas.addEventListener('click', (e) => {
      balls.push(new Ball(e.clientX, e.clientY));
      while (balls.length > 30) balls.shift();
    });
    
    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      balls.length = 0;
      ctx.fillStyle = '#0f0f1a';
      ctx.fillRect(0, 0, width, height);
    });
    
    animate();
  </script>
</body>
</html>
