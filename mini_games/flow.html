<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Generative Flow</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #0a0a15;
  }
  canvas {
    display: block;
  }
  #ui {
    position: fixed; top: 16px; left: 16px; color: #ccc; font-size: 13px;
    pointer-events: none; z-index: 10; background: rgba(10,10,20,0.75);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
    padding: 14px 18px; backdrop-filter: blur(10px); line-height: 1.7;
    min-width: 220px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  #ui h3 { color: #fff; margin-bottom: 6px; font-size: 14px; letter-spacing: 0.5px; }
  #ui .param { display: flex; justify-content: space-between; gap: 12px; }
  #ui .key { color: #888; }
  #ui .val { color: #6cf; font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h3>🌊 Generative Flow</h3>
  <div class="param"><span class="key">Move</span><span class="val">Spawn + attract</span></div>
  <div class="param"><span class="key">Left Click</span><span class="val">Particle burst</span></div>
  <br>
  <div class="param"><span class="key">Particles:</span><span class="val" id="particleCount">0</span></div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let w, h;
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const particles = [];
const maxParticles = 600;

let mouse = { x: w/2, y: h/2, active: false };

window.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
  spawn(e.clientX, e.clientY, 6);
});

window.addEventListener('click', e => {
  spawn(e.clientX, e.clientY, 40);
});

class Particle {
  constructor(x, y) {
    this.x = x;
    this.y = y;

    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 2 + 0.5;

    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;

    this.life = Math.random() * 120 + 60;
    this.size = Math.random() * 2 + 0.5;
    this.hue = Math.random() * 360;

    this.wobble = Math.random() * 0.1;
  }

  update() {
    this.life--;

    const dx = mouse.x - this.x;
    const dy = mouse.y - this.y;
    const dist = Math.sqrt(dx*dx + dy*dy) + 0.001;

    if (mouse.active) {
      const force = Math.min(100 / dist, 2);
      this.vx += dx / dist * force * 0.05;
      this.vy += dy / dist * force * 0.05;
    }

    this.vx += Math.sin(this.y * 0.01) * this.wobble;
    this.vy += Math.cos(this.x * 0.01) * this.wobble;

    this.vx *= 0.98;
    this.vy *= 0.98;

    this.x += this.vx;
    this.y += this.vy;
  }

  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, 0.8)`;
    ctx.fill();
  }
}

function spawn(x, y, count) {
  for (let i = 0; i < count; i++) {
    if (particles.length < maxParticles) {
      particles.push(new Particle(x, y));
    } else {
      particles.shift();
      particles.push(new Particle(x, y));
    }
  }
}

function animate() {
  requestAnimationFrame(animate);

  ctx.fillStyle = 'rgba(10,10,21,0.15)';
  ctx.fillRect(0, 0, w, h);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.update();
    p.draw();

    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }

  if (!mouse.active) {
    spawn(w/2 + Math.sin(Date.now()*0.001)*100, h/2 + Math.cos(Date.now()*0.001)*100, 2);
  }

  mouse.active = false;
  document.getElementById('particleCount').textContent = particles.length;
}

animate();
</script>
</body>
</html>
