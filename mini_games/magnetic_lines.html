<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body { margin:0; overflow:hidden; background:#0a0a15; }
canvas { display:block; }
#ui {
  position: fixed; top: 16px; left: 16px; color: #ccc; font-size: 13px;
  pointer-events: none; z-index: 10; background: rgba(10,10,20,0.75);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
  padding: 14px 18px; backdrop-filter: blur(10px); line-height: 1.7;
  min-width: 220px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
#ui h3 { color: #fff; margin-bottom: 6px; font-size: 14px; letter-spacing: 0.5px; }
#ui .param { display: flex; justify-content: space-between; gap: 12px; }
#ui .key { color: #888; }
#ui .val { color: #6cf; font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h3>🧲 Magnetic Lines</h3>
  <div class="param"><span class="key">Left Click</span><span class="val">Place attractor</span></div>
  <br>
  <div class="param"><span class="key">Attractors:</span><span class="val" id="attractorCount">0</span></div>
</div>
<script>
const canvas=c;
const ctx=canvas.getContext("2d");

let w,h;
function resize(){ w=canvas.width=innerWidth; h=canvas.height=innerHeight; }
addEventListener("resize",resize);
resize();

let particles=[];
const maxParticles=700;

let attractors=[];

class Attractor{
  constructor(x,y){
    this.x=x;
    this.y=y;
    this.strength=Math.random()>0.5?1:-1;
  }
}

class Particle{
  constructor(){
    this.x=Math.random()*w;
    this.y=Math.random()*h;
    this.vx=0;
    this.vy=0;
    this.hue=Math.random()*360;
  }
  update(){
    attractors.forEach(a=>{
      let dx=a.x-this.x;
      let dy=a.y-this.y;
      let d=Math.sqrt(dx*dx+dy*dy)+0.01;
      let force=a.strength*50/(d*d);
      this.vx+=dx/d*force;
      this.vy+=dy/d*force;
    });

    this.vx*=0.95;
    this.vy*=0.95;

    this.x+=this.vx;
    this.y+=this.vy;
  }
  draw(){
    ctx.fillStyle=`hsla(${this.hue},100%,70%,0.6)`;
    ctx.fillRect(this.x,this.y,1.5,1.5);
  }
}

for(let i=0;i<maxParticles;i++) particles.push(new Particle());

addEventListener("click",e=>{
  attractors.push(new Attractor(e.clientX,e.clientY));
  if(attractors.length>5) attractors.shift();
});

function loop(){
  requestAnimationFrame(loop);
  ctx.fillStyle="rgba(10,10,21,0.1)";
  ctx.fillRect(0,0,w,h);

  particles.forEach(p=>{
    p.update();
    p.draw();
  });
  document.getElementById('attractorCount').textContent = attractors.length;
}
loop();
</script>
</body>
</html>
