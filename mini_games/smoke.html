<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smoke</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #060609; cursor: crosshair; }
    canvas { display: block; }
    #hint { position: fixed; bottom: 1rem; left: 1rem; color: rgba(255,255,255,0.35); font: 12px system-ui; pointer-events: none; transition: opacity 2s; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Move: smoke source &nbsp;·&nbsp; Left-click: turbulence burst &nbsp;·&nbsp; Right-click: place deflector &nbsp;·&nbsp; Scroll: smoke density</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;

let mouse = { x: w / 2, y: h / 2 };
let spawnRate = 5;
const particles = [], deflectors = [];

class Smoke {
  constructor(x, y, turbulent) {
    this.x = x + (Math.random() - 0.5) * 16;
    this.y = y + (Math.random() - 0.5) * 10;
    this.vx = (Math.random() - 0.5) * (turbulent ? 6 : 0.8);
    this.vy = -(Math.random() * (turbulent ? 5 : 2.2) + (turbulent ? 1 : 0.5));
    this.life = 1.0;
    this.decay = 0.0018 + Math.random() * 0.0015;
    this.size = Math.random() * 18 + 10;
    this.hue = 210 + Math.random() * 30;
    this.spin = (Math.random() - 0.5) * 0.04;
    this.angle = Math.random() * Math.PI * 2;
  }
  update() {
    this.life -= this.decay;
    this.size += 0.35;
    this.angle += this.spin;
    this.vx += Math.sin(this.y * 0.012 + Date.now() * 0.0004) * 0.04;
    this.vy *= 0.992;
    this.vx *= 0.988;
    for (const d of deflectors) {
      const dx = this.x - d.x, dy = this.y - d.y;
      const dist = Math.sqrt(dx * dx + dy * dy) + 0.1;
      const push = d.r + this.size * 0.4;
      if (dist < push) {
        this.x = d.x + (dx / dist) * push;
        this.y = d.y + (dy / dist) * push;
        const dot = this.vx * (dx / dist) + this.vy * (dy / dist);
        this.vx -= dot * (dx / dist) * 1.6;
        this.vy -= dot * (dy / dist) * 1.6;
      }
    }
    this.x += this.vx; this.y += this.vy;
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.life * this.life * 0.22;
    ctx.translate(this.x, this.y); ctx.rotate(this.angle);
    ctx.beginPath(); ctx.ellipse(0, 0, this.size, this.size * 0.7, 0, 0, Math.PI * 2);
    const lit = 55 + this.life * 35;
    ctx.fillStyle = `hsl(${this.hue},18%,${lit}%)`;
    ctx.fill();
    ctx.restore();
  }
}

function burst(x, y) {
  for (let i = 0; i < 40; i++) particles.push(new Smoke(x, y, true));
}

function animate() {
  ctx.fillStyle = 'rgba(6,6,9,0.22)';
  ctx.fillRect(0, 0, w, h);

  for (let i = 0; i < spawnRate; i++) particles.push(new Smoke(mouse.x, mouse.y, false));

  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update(); particles[i].draw();
    if (particles[i].life <= 0 || particles[i].y < -80) particles.splice(i, 1);
  }
  if (particles.length > 800) particles.splice(0, particles.length - 800);

  for (const d of deflectors) {
    const grad = ctx.createRadialGradient(d.x, d.y, d.r * 0.3, d.x, d.y, d.r);
    grad.addColorStop(0, 'rgba(80,100,140,0.35)');
    grad.addColorStop(1, 'rgba(40,60,100,0.05)');
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fillStyle = grad; ctx.fill();
    ctx.strokeStyle = 'rgba(120,160,220,0.3)'; ctx.lineWidth = 1.5; ctx.stroke();
  }

  requestAnimationFrame(animate);
}

canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('click', e => burst(e.clientX, e.clientY));
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  deflectors.push({ x: e.clientX, y: e.clientY, r: 50 + Math.random() * 40 });
  if (deflectors.length > 6) deflectors.shift();
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  spawnRate = Math.max(1, Math.min(18, spawnRate - e.deltaY * 0.01));
}, { passive: false });
window.addEventListener('resize', () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; });

animate();
setTimeout(() => document.getElementById('hint').style.opacity = 0, 4000);
</script>
</body>
</html>
