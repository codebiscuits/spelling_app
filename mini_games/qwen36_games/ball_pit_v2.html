<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ball Pit v2</title>
<style>
html,body{margin:0;height:100%;background:#0c0c1e;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#ddd}
canvas{display:block;cursor:crosshair}
#controls{position:fixed;top:16px;left:16px;background:rgba(12,12,30,0.85);backdrop-filter:blur(8px);padding:10px 14px;border-radius:10px;pointer-events:none;font-size:13px;line-height:1.5;max-width:260px;z-index:5;border:1px solid rgba(255,255,255,0.08)}
#controls b{color:#fff;font-weight:600}
#reset{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.25);padding:8px 18px;border-radius:999px;cursor:pointer;font:600 13px system-ui;backdrop-filter:blur(8px);z-index:5}
#reset:hover{background:rgba(255,255,255,0.22)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="controls">
<b>Ball Pit</b><br>
Move — cursor<br>
Left drag — attract<br>
Right drag — repel<br>
Scroll — ball count
</div>
<button id="reset">Reset</button>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
canvas.addEventListener('contextmenu',e=>e.preventDefault());
const state={};let w,h;
function fitCanvas(){const dpr=Math.min(window.devicePixelRatio||1,2);w=window.innerWidth;h=window.innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
fitCanvas();window.addEventListener('resize',fitCanvas);
document.getElementById('reset').addEventListener('click',()=>reset());
let mouse={x:0,y:0,left:false,right:false,buttons:0,px:0,py:0};
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouse.px=mouse.x;mouse.py=mouse.y;mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;mouse.buttons=e.buttons;mouse.left=!!(mouse.buttons&1);mouse.right=!!(mouse.buttons&2);});
canvas.addEventListener('mousedown',e=>{if(e.button===0)mouse.left=true;if(e.button===2)mouse.right=true;});
window.addEventListener('mouseup',e=>{if(e.button===0)mouse.left=false;if(e.button===2)mouse.right=false;});
canvas.addEventListener('wheel',e=>{e.preventDefault();state.wheel=-Math.sign(e.deltaY);},{passive:false});
const DT=1/60;let acc=0,last=performance.now();
function frame(now){acc+=Math.min((now-last)/1000,0.1);last=now;while(acc>=DT){update(DT);acc-=DT;}draw(acc/DT);requestAnimationFrame(frame);}
requestAnimationFrame(frame);

canvas.style.background='#111115';

function reset(){
  balls=[];
  let count=250;
  for(let i=0;i&lt;count;i++){balls.push({x:Math.random()*w,y:Math.random()*h,px:0,py:0,r:4+Math.random()*6,col:`hsl(${Math.floor(Math.random()*360)},80%,65%)`});}
}
const balls=[];
let targetCount=250;
window.addEventListener('wheel',e=>{if(e.target===canvas){e.preventDefault();targetCount=Math.max(20,Math.min(600,targetCount-Math.sign(e.deltaY)*25));if(balls.length&lt;targetCount){for(let i=balls.length;i&lt;targetCount;i++){balls.push({x:Math.random()*w,y:Math.random()*h,px:Math.random()*w,py:Math.random()*h,r:4+Math.random()*6,col:`hsl(${Math.floor(Math.random()*360)},80%,65%)`});}}else balls.length=targetCount;}},{passive:false});

function update(dt){
  for(const b of balls){
    const dx=mouse.x-b.x,dy=mouse.y-b.y;const d=Math.hypot(dx,dy)||1;
    if(d&lt;180){const f=Math.min(1,(180-d)/180);
      if(mouse.left){b.x+=dx/d*f*6;b.y+=dy/d*f*6;}
      if(mouse.right){b.x-=dx/d*f*6;b.y-=dy/d*f*6;}
    }
    const vx=(b.x-b.px)*0.98;const vy=(b.y-b.py)*0.98;
    b.px=b.x;b.py=b.y;
    b.x+=vx;b.y+=vy+60*dt*dt;
    if(b.y>h-10){b.y=h-10;const vy0=(b.y-b.py)*0.6;b.py=b.y-vy0;}
    if(b.x&lt;10){b.x=10;}if(b.x>w-10){b.x=w-10;}
  }
  // simple pair collisions skip for perf in v2? do 100 random pairs
  for(let k=0;k&lt;200;k++){
    const i=Math.floor(Math.random()*balls.length),j=Math.floor(Math.random()*balls.length);
    if(i==j)continue;
    const a=balls[i],b=balls[j];
    const dx=b.x-a.x,dy=b.y-a.y;const d=Math.hypot(dx,dy)||1;
    const md=a.r+b.r;
    if(d<md){
      const diff=(d-md)/d*0.5;
      a.x-=dx*diff;a.y-=dy*diff;b.x+=dx*diff;b.y+=dy*diff;
    }
  }
}

function draw(alpha){
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#1a1a22';ctx.fillRect(0,h-10,w,10);
  ctx.globalCompositeOperation='lighter';
  for(const b of balls){
    const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*1.5);
    g.addColorStop(0,b.col);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(b.x-b.r*1.5,b.y-b.r*1.5,b.r*3,b.r*3);
  }
  ctx.globalCompositeOperation='source-over';
}
reset();

</script>
</body>
</html>
