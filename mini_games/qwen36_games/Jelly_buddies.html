<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jelly Buddies</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #0c0c1e; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; color: #ccc; }
    canvas { display: block; touch-action: none; cursor: crosshair; }

    #ui {
      position: fixed; top: 16px; left: 16px;
      background: rgba(10,10,20,0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 14px 18px;
      pointer-events: none;
      z-index: 10;
      font-size: 13px;
      line-height: 1.7;
      min-width: 230px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.35);
    }
    #ui h3 { color: #fff; margin-bottom: 6px; font-size: 14px; letter-spacing: 0.4px; }
    #ui .row { display:flex; justify-content:space-between; gap:12px; }
    #ui .key { color: #999; }
    #ui .val { color:#6cf; font-weight:600; font-variant-numeric: tabular-nums; }

    #resetBtn {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 10px 30px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(10,10,20,0.75);
      color: #ccc; cursor: pointer;
      backdrop-filter: blur(10px);
      font: 600 13px system-ui; z-index: 10;
      box-shadow: 0 6px 24px rgba(0,0,0,0.35);
      transition: background .2s, color .2s, border-color .2s;
    }
    #resetBtn:hover { background: rgba(40,40,80,0.85); color: #fff; border-color: rgba(255,255,255,0.35); }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h3>Jelly Buddies</h3>
  <div class="row"><span class="key">Move</span><span class="val">Stir / attract / jiggle</span></div>
  <div class="row"><span class="key">Left drag</span><span class="val">Grab &amp; fling</span></div>
  <div class="row"><span class="key">Right hold</span><span class="val">Pop buffet</span></div>
  <div class="row"><span class="key">Scroll</span><span class="val">Squish: <span id="sv">1.00</span></span></div>
  <div class="row"><span class="key">Space</span><span class="val">Reset</span></div>
  <div class="row"><span class="key">Buddies</span><span class="val" id="bc">0</span></div>
</div>
<button id="resetBtn">&#x21BA; Reset</button>
<script>
'use strict';

// ---------- Engine ----------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let w = 0, h = 0;
function fitCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  w = window.innerWidth; h = window.innerHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
fitCanvas();
window.addEventListener('resize', fitCanvas);

const DT = 1 / 60;
let acc = 0, last = performance.now();
function frame(now) {
  acc += Math.min((now - last) / 1000, 0.1);
  last = now;
  while (acc >= DT) { update(DT); acc -= DT; }
  draw(acc / DT);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- Tuning ----------
const N_PTS = 18;
const ITERS = 5;
const GRAVITY = 0.22;
const DAMP = 0.986;
const MAX_BLOBS = 10;
const FLOOR_PAD = 8;
let squish = 1.0;               // scroll parameter

// ---------- Palette (precomputed) ----------
const PALETTE_ROWS = 40;
const paletteCache = new Array(PALETTE_ROWS);
(function precomputePalettes(){
  for(let i=0;i<PALETTE_ROWS;i++){
    const t = i / PALETTE_ROWS;
    const c = new Array(3);
    const d = [0.00, 0.25, 0.55];
    for (let j = 0; j < 3; j++) c.push(0.55 + 0.40 * Math.cos(6.28318 * (0.9 * t + d[j])));
    paletteCache[i] = { base: rgb(c,1,0), light: rgb(c,1,0.35), dark: rgb(c,0.55,0), raw: c };
  }
})();
function samplePalette(idx){
  return paletteCache[((idx % PALETTE_ROWS) + PALETTE_ROWS) % PALETTE_ROWS];
}

// ---------- Audio (pentatonic, off by default) ----------
let AC = null, muted = true;
function ensureAudio() { if (muted) return; if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); }
function tone(f0, f1, dur, vol, type, delay) {
  if (muted || !AC) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'triangle';
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(AC.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const PENTA = [0,2,4,7,9];
const penta = (base,i) => base * Math.pow(2, (PENTA[i%5] + 12*((i/5)|0)) / 12);

// ---------- Particles (pooled, zero alloc) ----------
const glowSprite = document.createElement('canvas');
glowSprite.width = glowSprite.height = 64;
{
  const g = glowSprite.getContext('2d');
  const grad = g.createRadialGradient(32,32,0,32,32,32);
  grad.addColorStop(0,'rgba(255,255,255,1)');
  grad.addColorStop(0.35,'rgba(255,255,255,0.35)');
  grad.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = grad; g.fillRect(0,0,64,64);
}
const POOL = 240;
const parts = new Array(POOL);
for (let i=0;i<POOL;i++) parts[i]={x:0,y:0,vx:0,vy:0,life:0,max:1,size:8,color:'#fff'};
let pHead = 0;
function spawnPart(x,y,vx,vy,size,color,life){
  const p=parts[pHead]; pHead=(pHead+1)%POOL;
  p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.size=size;p.color=color;p.life=p.max=life;
}

// ---------- Screenshake ----------
let trauma = 0;

// ---------- Blobs ----------
const blobs = [];
function makeBlob(x,y,r){
  const c3 = cosPalette(blobs.length * 0.618034);
  const ringRest = 2*r*Math.sin(Math.PI/N_PTS);
  const bendRest = 2*r*Math.sin(2*Math.PI/N_PTS);
  const pts=[];
  for(let i=0;i<N_PTS;i++){
    const a=(i/N_PTS)*Math.PI*2;
    const px=x+Math.cos(a)*r, py=y+Math.sin(a)*r;
    pts.push({x:px,y:py,px,py,grabbed:false});
  }
  const b={
    r,pts,
    ringRest,
    bendRest,
    restArea: Math.PI*r*r,
    base: rgb(c3,1,0), light: rgb(c3,1,0.35), dark: rgb(c3,0.55,0),
    s:0.25, sv:0,          // springy spawn scale
    cx:x,cy:y,vx:0,vy:0,
    blinkT: 1+Math.random()*4,
    eyeOff: Math.random()*Math.PI*2,
    age:0
  };
  b.cx=x; b.cy=y;
  blobs.push(b);
  return b;
}
function popBlob(b,cx,cy){
  const idx=blobs.indexOf(b); if(idx<0) return;
  for(const p of b.pts){
    const dx=p.x-cx,dy=p.y-cy;
    const d=Math.hypot(dx,dy)||1;
    spawnPart(p.x,p.y,dx/d*(2+Math.random()*4)+b.vx,dy/d*(2+Math.random()*4)+b.vy,
              5+Math.random()*9,b.light,0.5+Math.random()*0.4);
  }
  trauma = Math.min(1, trauma + 0.3);
  tone(700,180,0.25,0.18,'square');
  tone(300,60,0.35,0.12,'sine',0.03);
  blobs.splice(idx,1);
  updateCount();
}
function resetBuddies(){
  blobs.length=0;
  for(let i=0;i<5;i++){
    const r = 38 + Math.random()*28;
    makeBlob(w*(0.25+0.17*i), h*0.25 + Math.random()*h*0.2, r);
  }
  updateCount();
}
function updateCount(){ document.getElementById('bc').textContent = blobs.length; }

// ---------- Input ----------
const mouse={x:-9999,y:-9999,lx:-9999,ly:-9999,left:false,right:false};
const grabs=new Map();

canvas.addEventListener('contextmenu', e=> e.preventDefault());

canvas.addEventListener('mousemove', e=>{
  const r=canvas.getBoundingClientRect();
  mouse.lx=mouse.x; mouse.ly=mouse.y;
  mouse.x=e.clientX-r.left;
  mouse.y=e.clientY-r.top;
  mouse.left=!!(e.buttons&1);
  mouse.right=!!(e.buttons&2);
});
canvas.addEventListener('mousedown', e=>{
  ensureAudio();
  if(e.button===0){
    mouse.left=true;
    const b=blobAt(mouse.x,mouse.y);
    if(b){
      let best=0,bd=Infinity;
      for(let i=0;i<b.pts.length;i++){
        const d=(b.pts[i].x-mouse.x)**2+(b.pts[i].y-mouse.y)**2;
        if(d<bd){bd=d;best=i;}
      }
      b.pts[best].grabbed=true;
      grabs.set('m0',{blob:b,idx:best});
      tone(penta(330,(Math.random()*5)|0),260,0.09,0.10);
    } else if(blobs.length<MAX_BLOBS){
      const nb=makeBlob(mouse.x,mouse.y, 38+Math.random()*28);
      nb.sv=4;
      updateCount();
      const n=(Math.random()*5)|0;
      tone(penta(262,n),penta(262,n)*1.02,0.10,0.12,'sine');
      tone(penta(262,n+2),penta(262,n+2)*1.02,0.11,0.10,'sine',0.07);
    }
  }
  if(e.button===2){
    const b=blobAt(mouse.x,mouse.y);
    if(b) popBlob(b,mouse.x,mouse.y);
  }
});
window.addEventListener('mouseup', e=>{
  if(e.button===0){
    mouse.left=false;
    const g=grabs.get('m0'); if(g){
      const p=g.blob.pts[g.idx];
      p.grabbed=false;
      p.px = p.x - (mouse.x-mouse.lx)*0.9;
      p.py = p.y - (mouse.y-mouse.ly)*0.9;
      grabs.delete('m0');
    }
  }
  if(e.button===2) mouse.right=false;
});
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  squish = Math.max(0.3, Math.min(2.8, squish - Math.sign(e.deltaY)*0.05));
  document.getElementById('sv').textContent = squish.toFixed(2);
}, { passive: false });

window.addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); resetBuddies(); }
  if(e.code==='KeyM'){ muted=!muted; ensureAudio(); }
});
document.getElementById('resetBtn').addEventListener('click', resetBuddies);

function blobAt(x,y){
  for(let i=blobs.length-1;i>=0;i--){
    const b=blobs[i];
    if((x-b.cx)**2+(y-b.cy)**2 < (b.r*(1+b.s*0.25))**2) return b;
  }
  return null;
}

// ---------- Physics ----------
function softStep(dt){
  for(const b of blobs){
    const pts=b.pts; const n=pts.length;
    for(const p of pts){
      let vx=(p.x-p.px)*DAMP;
      let vy=(p.y-p.py)*DAMP;
      p.px=p.x; p.py=p.y;
      p.x+=vx; p.y+=vy+GRAVITY;
    }

    // springy spawn scale
    b.s += (1-b.s)*12*dt + b.sv*dt;
    b.sv *= Math.pow(0.0001, dt);

    for(let iter=0;iter<ITERS;iter++){
      // perimeter distance constraints
      for(let i=0;i<n;i++){
        const a=pts[i], c=pts[(i+1)%n];
        const dx=c.x-a.x, dy=c.y-a.y;
        const d=Math.hypot(dx,dy)||0.001;
        const diff=(d - b.ringRest)/d*0.5;
        a.x+=dx*diff; a.y+=dy*diff; c.x-=dx*diff; c.y-=dy*diff;
      }
      // pressure
      let area=0;
      for(let i=0;i<n;i++){const j=(i+1)%n; area += pts[i].x*pts[j].y - pts[j].x*pts[i].y;}
      area=Math.abs(area)/2;
      const targetArea = b.restArea * (0.7 + 0.6*squish);
      const pressure=(targetArea-area)*0.006*squish;
      for(let i=0;i<n;i++){
        const j=(i+1)%n, prev=(i-1+n)%n;
        const nx=pts[j].y-pts[prev].y, ny=pts[prev].x-pts[j].x;
        const len=Math.hypot(nx,ny)||1;
        pts[i].x+=nx/len*pressure;
        pts[i].y+=ny/len*pressure;
      }

      // walls
      for(const p of pts){
        if(p.y>h-FLOOR_PAD){ p.y=h-FLOOR_PAD; const vy=p.y-p.py; p.py=p.y+vy*0.5; }
        if(p.x<FLOOR_PAD){ p.x=FLOOR_PAD; const vx=p.x-p.px; p.px=p.x+vx*0.5; }
        if(p.x>w-FLOOR_PAD){ p.x=w-FLOOR_PAD; const vx=p.px-p.x; p.px=p.x+vx*0.5; }
      }
    }

    // centroid + velocity follow
    let cx=0,cy=0;
    for(const p of pts){cx+=p.x;cy+=p.y;}
    cx/=n; cy/=n;
    b.cx+=(cx-b.cx)*0.3; b.cy+=(cy-b.cy)*0.3;
    b.vx=(cx-b.cx); b.vy=(cy-b.cy);
  }
}

function interact(){
  // drag
  const g=grabs.get('m0');
  if(g){
    const p=g.blob.pts[g.idx];
    p.px=p.x-(mouse.x-mouse.lx)*0.8;
    p.py=p.y-(mouse.y-mouse.ly)*0.8;
    p.x=mouse.x; p.y=mouse.y;
  }

  // cursor presence: alive on movement alone, plus directional stir bias
  const mdx=mouse.x-mouse.lx, mdy=mouse.y-mouse.ly;
  for(const b of blobs){
    const cx=b.cx, cy=b.cy;
    const ddx=mouse.x-cx, ddy=mouse.y-cy;
    const d=Math.hypot(ddx,ddy)||1;
    if(d<220){
      const pull=0.22*(1-d/220);
      b.vx+=pull*ddx/d; b.vy+=pull*ddy/d;
      // gentle point-push so shape visibly lobes toward / away from cursor
      for(const p of b.pts){
        const pdx=p.x-mouse.x, pdy=p.y-mouse.y;
        const pd=Math.hypot(pdx,pdy)||1;
        if(pd<140){
          const angle=Math.abs(Math.atan2(pdy,pdx)-Math.atan2(ddy,ddx));
          const along = Math.cos(angle)*0.35*(1-pd/140);
          const off   = 0.55*(1-pd/140);
          p.vx += (-ddx/d*along + (Math.random()-0.5)*off);
          p.vy += (-ddy/d*along + (Math.random()-0.5)*off);
        }
      }
    }
    for(const p of b.pts){
      if(!p.grabbed){
        if(mouse.left){
          const ddx=p.x-mouse.x, ddy=p.y-mouse.y;
          const dd=Math.hypot(ddx,ddy)||1;
          if(dd<140){
            const ff=1.05*(1-dd/140);
            p.vx+=ff*ddx/dd*9.5; p.vy+=ff*ddy/dd*9.5;
          }
        }
        if(mouse.right){
          const ddx=p.x-mouse.x, ddy=p.y-mouse.y;
          const dd=Math.hypot(ddx,ddy)||1;
          if(dd<145){
            const ff=0.95*(1-dd/145);
            p.vx+=-ff*ddx/dd*25; p.vy+=-ff*ddy/dd*25;
          }
        }
      }
    }
  }

  // inter-blob separation
  for(let i=0;i<blobs.length;i++) for(let j=i+1;j<blobs.length;j++){
    const a=blobs[i], b=blobs[j];
    const dx=b.cx-a.cx, dy=b.cy-a.cy;
    const d=Math.hypot(dx,dy)||1;
    const target = 1.0*(a.r+b.r);
    if(d<target){
      const overlap=(target-d)/2;
      a.cx-=dx/d*overlap; a.cy-=dy/d*overlap;
      b.cx+=dx/d*overlap; b.cy+=dy/d*overlap;
      for(const p of a.pts){p.x-=dx/d*overlap;p.y-=dy/d*overlap;}
      for(const p of b.pts){p.x+=dx/d*overlap;p.y+=dy/d*overlap;}
    }
  }
}

// ---------- Update/Render ----------
function update(dt){
  softStep(dt);
  interact();
  // ambient pop particles
  for(const b of blobs) if(Math.random()<0.02){
    const a=Math.random()*Math.PI*2;
    spawnPart(b.cx+Math.cos(a)*b.r, b.cy+Math.sin(a)*b.r,
              Math.cos(a)*0.5, Math.sin(a)*0.5, 2+Math.random()*3, b.light, 0.4+Math.random()*0.4);
  }
  // particles update
  for(const p of parts){
    if(p.life<=0) continue;
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.08;
    p.vx*=0.98; p.vy*=0.98;
    p.life-=dt;
  }
}
function draw(alpha){
  ctx.clearRect(0,0,w,h);

  // shake
  let sx=0,sy=0;
  if(trauma>0.0001){
    sx=(Math.random()-0.5)*trauma*trauma*28;
    sy=(Math.random()-0.5)*trauma*trauma*28;
    trauma*=Math.pow(0.0001, DT);
  }
  ctx.save();
  ctx.translate(sx,sy);

  const time=performance.now()*0.001;

  // ambient bokeh
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<10;i++){
    const px=(Math.sin(time*0.7+i*1.3)*0.5+0.5)*w;
    const py=(Math.cos(time*0.5+i*1.7)*0.5+0.5)*h;
    ctx.globalAlpha=0.14;
    ctx.drawImage(glowSprite, px-60, py-60, 120, 120);
  }

  // blobs
  ctx.globalCompositeOperation='source-over';
  for(const b of blobs){
    const pts=b.pts; const n=pts.length;
    ctx.beginPath();
    ctx.moveTo((pts[0].x+pts[n-1].x)/2,(pts[0].y+pts[n-1].y)/2);
    for(let i=0;i<n;i++){
      const cur=pts[i], nxt=pts[(i+1)%n];
      ctx.quadraticCurveTo(cur.x, cur.y, (cur.x+nxt.x)/2, (cur.y+nxt.y)/2);
    }
    ctx.closePath();
    const grad=ctx.createRadialGradient(b.cx,b.cy, b.r*0.15, b.cx,b.cy, b.r*(1.15+b.s*0.25));
    grad.addColorStop(0, b.light);
    grad.addColorStop(1, b.dark);
    ctx.fillStyle=grad;
    ctx.globalAlpha=0.85;
    ctx.fill();
    ctx.strokeStyle=b.base; ctx.lineWidth=1.5; ctx.globalAlpha=0.55; ctx.stroke();

    // eyes
    ctx.globalAlpha=1;
    const e1x=b.cx-Math.cos(b.eyeOff+time*0.2)*b.r*0.28;
    const e1y=b.cy-Math.sin(b.eyeOff+time*0.2)*b.r*0.42-2;
    const e2x=b.cx+Math.cos(b.eyeOff+time*0.2)*b.r*0.28;
    const e2y=b.cy+Math.sin(b.eyeOff+time*0.2)*b.r*0.42-2;
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(e1x,e1y,b.r*0.22,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(e2x,e2y,b.r*0.22,0,Math.PI*2); ctx.fill();
    const blink = (Math.sin(time*1.7+b.blinkT)>0.97) ? 0.08 : 1;
    if(blink<0.5){ ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(e1x,e1y,b.r*0.22,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(e2x,e2y,b.r*0.22,0,Math.PI*2); ctx.fill(); }
    else {
      const mx=mouse.x-b.cx, my=mouse.y-b.cy;
      const md=Math.hypot(mx,my)||1;
      ctx.fillStyle='#000';
      ctx.beginPath(); ctx.arc(e1x+mx/md*2, e1y+my/md*2, b.r*0.1,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e2x+mx/md*2, e2y+my/md*2, b.r*0.1,0,Math.PI*2); ctx.fill();
    }
  }

  // particles additive
  ctx.globalCompositeOperation='lighter';
  for(const p of parts){
    if(p.life<=0) continue;
    ctx.globalAlpha = Math.min(1, p.life/p.max);
    ctx.drawImage(glowSprite, p.x-p.size, p.y-p.size, p.size*2, p.size*2);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

// init
resetBuddies();
</script>
</body>
</html>
