<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Maze</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #0c1a24; }
  canvas { display: block; cursor: none; }

  #ui {
    position: fixed; top: 16px; left: 16px; color: #dde4dd; font-size: 13px; pointer-events: none; z-index: 10;
    background: rgba(6,18,22,0.72); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px;
    padding: 14px 18px; backdrop-filter: blur(10px); line-height: 1.7; min-width: 240px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  #ui h3 { color: #d8ffe0; margin-bottom: 8px; font-size: 15px; letter-spacing: 0.4px; }
  #ui .row { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
  #ui .key { color: #7fa687; }
  #ui .val { color: #8ee2a8; font-weight: 600; font-variant-numeric: tabular-nums; }

  #resetBtn, #muteBtn {
    position: fixed; z-index: 10; padding: 10px 28px; font-size: 14px; font-family: inherit; color: #dde4dd;
    background: rgba(6,18,22,0.80); border: 1px solid rgba(255,255,255,0.14); border-radius: 999px;
    cursor: pointer; backdrop-filter: blur(10px); transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  #resetBtn { bottom: 24px; left: 50%; transform: translateX(-50%); }
  #muteBtn { top: 16px; right: 16px; padding: 10px 14px; font-size: 18px; line-height: 1; }
  #resetBtn:hover, #muteBtn:hover { background: rgba(20,50,44,0.90); color: #fff; border-color: rgba(255,255,255,0.28); }

  @media (prefers-reduced-motion: reduce) { #resetBtn { transition: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h3>&#x1F3F9; Shadow Maze</h3>
  <div class="row"><span class="key">Move</span><span class="val">Carry lantern</span></div>
  <div class="row"><span class="key">Left</span><span class="val">Plant torch</span></div>
  <div class="row"><span class="key">Right</span><span class="val">Pulse/Mote breathe</span></div>
  <div class="row"><span class="key">Scroll</span><span class="val">Radius: <span id="radiusVal">190</span></span></div>
  <br>
  <div class="row"><span class="key">Gems</span><span class="val"><span id="foundVal">0</span> / <span id="totalVal">0</span></span></div>
  <div class="row"><span class="key">Torches</span><span class="val"><span id="torchVal">0</span>/<span id="torchMaxVal">4</span></span></div>
  <div class="row"><span class="key">FPS</span><span class="val" id="fpsVal">--</span></div>
</div>
<button id="muteBtn" title="Sound on/off" aria-label="Toggle sound">&#x1F507;</button>
<button id="resetBtn">&#x21BA; New maze</button>

<script>
(function() {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  let w = 0, h = 0, dpr = 1;

  const darkCanvas = document.createElement('canvas');
  const darkCtx = darkCanvas.getContext('2d', { willReadFrequently: true });

  function fitCanvas() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    darkCanvas.width = canvas.width;
    darkCanvas.height = canvas.height;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    darkCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildMazeGeometry();
  }

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

  // ----- config -----------------------------------------------------
  const WALL_MARGIN = 48;
  const COLLECT_R = 28;
  const MAX_TORCHES = 4;
  const TORCH_R = 160;
  const POOL = 360;
  const lanternMin = 110, lanternMax = 360;

  // ----- cosine palette ---------------------------------------------
  function cosPalette(t) {
    const d = [0.00, 0.30, 0.55];
    const out = [];
    for (let i = 0; i < 3; i++) out.push(0.55 + 0.42 * Math.cos(6.28318 * (0.85 * t + d[i])));
    return out;
  }
  function rgb255(t) {
    const c = cosPalette(t);
    return 'rgb(' + Math.round(c[0] * 255) + ',' + Math.round(c[1] * 255) + ',' + Math.round(c[2] * 255) + ')';
  }
  function rgba255(t, a) {
    const c = cosPalette(t);
    return 'rgba(' + Math.round(c[0] * 255) + ',' + Math.round(c[1] * 255) + ',' + Math.round(c[2] * 255) + ',' + a + ')';
  }

  // ----- glow sprite + particles ------------------------------------
  const glow = document.createElement('canvas');
  glow.width = glow.height = 64;
  (function () {
    const g = glow.getContext('2d');
    const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0, 'rgba(255,255,255,1)');
    grd.addColorStop(0.35, 'rgba(255,255,255,0.35)');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd; g.fillRect(0, 0, 64, 64);
  })();

  const parts = [];
  for (let i = 0; i < POOL; i++) parts.push({ x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 6, color: '#fff', mode: 0 });
  let partHead = 0;
  function spawnPart(x, y, vx, vy, size, color, life, mode) {
    const p = parts[partHead]; partHead = (partHead + 1) % POOL;
    p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.size = size; p.color = color; p.life = p.max = life; p.mode = mode | 0;
  }

  // ----- maze geometry ---------------------------------------------
  let walls = [], segments = [], cornerPts = [], collectables = [], torches = [];
  let total = 0, found = 0;
  let lanternRadius = 190;
  let pulse = null;
  const PULSE_EXPAND = 0.5, PULSE_HOLD = 0.12, PULSE_FADE = 0.58;
  const PULSE_TOTAL = PULSE_EXPAND + PULSE_HOLD + PULSE_FADE;
  let mouseX = w / 2, mouseY = h / 2;
  let simT = 0;
  let celebrating = false, celebT = 0;
  const CELEBRATE_DUR = 3.2;

  function buildMazeGeometry() {
    walls = []; segments = []; cornerPts = []; torches = []; pulse = null; celebrating = false; celebT = 0;
    segments.push({x1:0,y1:0,x2:w,y2:0},{x1:w,y1:0,x2:w,y2:h},{x1:w,y1:h,x2:0,y2:h},{x1:0,y1:h,x2:0,y2:0});
    cornerPts.push({x:0,y:0},{x:w,y:0},{x:w,y:h},{x:0,y:h});
    const numWalls = 8 + Math.floor(Math.random() * 5);
    for (let i = 0; i < numWalls; i++) {
      const hor = Math.random() < 0.5;
      const ww = hor ? rand(0.12, 0.26) * w : rand(0.04, 0.10) * w;
      const hh = hor ? rand(0.04, 0.10) * h : rand(0.14, 0.28) * h;
      const x = rand(WALL_MARGIN, Math.max(WALL_MARGIN + 1, w - WALL_MARGIN - ww));
      const y = rand(WALL_MARGIN, Math.max(WALL_MARGIN + 1, h - WALL_MARGIN - hh));
      walls.push({ x, y, w: ww, h: hh });
      const cs = [[x,y],[x+ww,y],[x+ww,y+hh],[x,y+hh]];
      for (let k = 0; k < 4; k++) {
        const a = cs[k], b = cs[(k + 1) % 4];
        segments.push({ x1: a[0], y1: a[1], x2: b[0], y2: b[1] });
      }
      cornerPts.push({x:cs[0][0],y:cs[0][1]},{x:cs[1][0],y:cs[1][1]},{x:cs[2][0],y:cs[2][1]},{x:cs[3][0],y:cs[3][1]});
    }
    collectables = []; total = 7 + Math.floor(Math.random() * 6); found = 0;
    for (let i = 0; i < total; i++) {
      let x, y, tries = 0, ok = false;
      do {
        x = rand(24, w - 24); y = rand(24, h - 24);
        ok = !pointInWalls(x, y, 24);
        for (const c of collectables) if (ok && Math.hypot(c.x - x, c.y - y) < 76) ok = false;
        tries++;
      } while (!ok && tries < 500);
      collectables.push({ x, y, found: false, hue: i / total, phase: Math.random() * 10 });
    }
  }

  function pointInWalls(x, y, margin) {
    for (const w of walls) if (x > w.x - margin && x < w.x + w.w + margin && y > w.y - margin && y < w.y + w.h + margin) return true;
    return false;
  }

  function rectOverlaps(a, b, m) {
    return a.x + a.w + m > b.x && a.x - m < b.x + b.w && a.y + a.h + m > b.y && a.y - m < b.y + b.h;
  }

  // ----- visibility rays -------------------------------------------
  function raySegIntersect(ox, oy, dx, dy, x1, y1, x2, y2) {
    const sx = x2 - x1, sy = y2 - y1;
    const denom = dx * sy - dy * sx;
    if (Math.abs(denom) < 1e-10) return null;
    const t = ((x1 - ox) * sy - (y1 - oy) * sx) / denom;
    const u = ((x1 - ox) * dy - (y1 - oy) * dx) / denom;
    if (t < 0 || u < 0 || u > 1) return null;
    return t;
  }

  function visibilityPolygon(lx, ly, maxR) {
    const angles = [];
    for (const p of cornerPts) {
      const a = Math.atan2(p.y - ly, p.x - lx);
      angles.push(a - 0.00008, a, a + 0.00008);
    }
    for (let i = 0; i < 64; i++) angles.push((i / 64) * Math.PI * 2);
    angles.sort((a, b) => a - b);
    const poly = [];
    for (const a of angles) {
      const dx = Math.cos(a), dy = Math.sin(a);
      let best = maxR;
      for (const s of segments) {
        const t = raySegIntersect(lx, ly, dx, dy, s.x1, s.y1, s.x2, s.y2);
        if (t !== null && t < best) best = t;
      }
      poly.push({ x: lx + dx * best, y: ly + dy * best });
    }
    return poly;
  }

  // ----- audio ------------------------------------------------------
  let AC = null, muted = true;
  function ensureAudio() {
    if (muted) return;
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  }
  function tone(f0, f1, dur, vol, type, delay) {
    if (muted || !AC) return;
    const t0 = AC.currentTime + (delay || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'triangle';
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  const PENTA = [0, 2, 4, 7, 9];
  const penta = (base, i) => base * Math.pow(2, (PENTA[i % 5] + 12 * ((i / 5) | 0)) / 12);

  // ----- helpers ----------------------------------------------------
  function flicker(t, seed) {
    return 1 + 0.055 * Math.sin(t * 17 + seed) + 0.035 * Math.sin(t * 29 + seed * 1.7) + 0.025 * Math.sin(t * 41 + seed * 3.1);
  }
  function easeOutExpo(x) { return x >= 1 ? 1 : 1 - Math.pow(2, -10 * x); }
  function spawnBurst(x, y, n, color, lifeBase) {
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2, sp = 0.7 + Math.random() * 3.1;
      spawnPart(x, y, Math.cos(ang) * sp, Math.sin(ang) * sp - 0.8, 3 + Math.random() * 5, color, 0.35 + Math.random() * (lifeBase || 0.35));
    }
  }

  // ----- state ------------------------------------------------------
  function resetEverything() {
    fitCanvas();
    buildMazeGeometry();
    ctx.clearRect(0, 0, w, h);
  }
  resetEverything();

  // ----- input ------------------------------------------------------
  function plantTorch() {
    if (torches.length >= MAX_TORCHES) {
      const old = torches.shift();
      spawnBurst(old.x, old.y, 12, 'rgba(255,180,110,0.95)', 0.5);
    }
    torches.push({ x: mouseX, y: mouseY, seed: Math.random() * 1000 });
    spawnBurst(mouseX, mouseY, 10, 'rgba(255,220,180,0.95)', 0.4);
    tone(520, 280, 0.18, 0.12, 'triangle');
  }
  canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('mousedown', e => {
    ensureAudio();
    if (e.button === 0) plantTorch();
    else if (e.button === 2) pulse = { x: mouseX, y: mouseY, t: 0 };
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    lanternRadius = clamp(lanternRadius - Math.sign(e.deltaY) * 10, lanternMin, lanternMax);
  }, { passive: false });
  document.getElementById('resetBtn').addEventListener('click', resetEverything);
  document.getElementById('muteBtn').addEventListener('click', () => {
    muted = !muted;
    document.getElementById('muteBtn').textContent = muted ? '&#x1F507;' : '&#x1F50A;';
    ensureAudio();
    if (!muted) tone(523, 530, 0.1, 0.12, 'sine');
  });
  window.addEventListener('resize', fitCanvas);

  // ----- update -----------------------------------------------------
  function update(dt) {
    simT += dt;
    if (pulse) { pulse.t += dt; if (pulse.t > PULSE_TOTAL) pulse = null; }

    if (!celebrating) {
      for (const c of collectables) {
        if (c.found) continue;
        if (Math.hypot(c.x - mouseX, c.y - mouseY) < COLLECT_R + 14) {
          c.found = true; found++;
          spawnBurst(c.x, c.y, 10, rgba255(c.hue, 0.95), 0.5);
          tone(penta(660, found), penta(660, found) * 1.02, 0.16, 0.14, 'sine');
        }
      }
      if (found >= total) { celebrating = true; celebT = 0; }
    } else {
      celebT += dt;
      if (celebT > CELEBRATE_DUR + 0.4) resetEverything();
    }

    for (const p of parts) {
      if (p.life <= 0) continue;
      p.life -= dt;
      p.vy += 0.06; p.vx *= 0.985; p.vy *= 0.985;
      p.x += p.vx; p.y += p.vy;
    }
  }

  // ----- render -----------------------------------------------------
  function drawBackground() {
    const bg = ctx.createRadialGradient(w * 0.5, h * 0.38, 0, w * 0.5, h * 0.5, Math.max(w, h) * 0.78);
    bg.addColorStop(0, '#12251e'); bg.addColorStop(1, '#060a12');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);

    ctx.strokeStyle = 'rgba(140,255,180,0.028)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x < w; x += 54) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
    for (let y = 0; y < h; y += 54) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
    ctx.stroke();
  }

  function drawWalls() {
    for (const a of walls) {
      const g = ctx.createLinearGradient(a.x, a.y, a.x, a.y + a.h);
      g.addColorStop(0, '#2a3a3a'); g.addColorStop(1, '#101818');
      ctx.fillStyle = g; ctx.fillRect(a.x, a.y, a.w, a.h);
      ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 2; ctx.strokeRect(a.x + 1, a.y + 1, a.w - 2, a.h - 2);
      ctx.strokeStyle = 'rgba(160,255,200,0.09)'; ctx.lineWidth = 1; ctx.strokeRect(a.x + 2, a.y + 2, a.w - 4, 2);
    }
  }

  function drawGems() {
    for (const c of collectables) {
      if (c.found) continue;
      const pulseS = 1 + 0.22 * Math.sin(simT * 3 + c.phase);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.45;
      ctx.drawImage(glow, c.x - 22 * pulseS, c.y - 22 * pulseS, 44 * pulseS, 44 * pulseS);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';

      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(simT * 0.55 + c.phase);
      ctx.fillStyle = rgba255(c.hue, 1);
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        const r1 = 8 * pulseS, r2 = 3.6 * pulseS;
        ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1);
        ctx.lineTo(Math.cos(a + Math.PI / 6) * r2, Math.sin(a + Math.PI / 6) * r2);
      }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
  }

  function drawLights() {
    // build light list: lantern + torches + optional pulse
    const lights = [];
    const lf = flicker(simT, 0);
    lights.push({ x: mouseX, y: mouseY, r: lanternRadius * (pulse ? 2.4 : 1) * lf, pulse });
    for (const t of torches) lights.push({ x: t.x, y: t.y, r: TORCH_R * flicker(simT * 3.2, t.seed), pulse: false });
    if (pulse) {
      lights.push({ x: pulse.x, y: pulse.y, r: Math.hypot(w, h) * 0.9, pulse: true });
    }

    const brought = Math.min(1, celebT / 1.8);
    // draw main visibility mask from lantern + torches
    darkCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    darkCtx.globalCompositeOperation = 'source-over';
    darkCtx.fillStyle = 'rgba(3,6,12,0.96)';
    darkCtx.fillRect(0, 0, w, h);

    for (const L of lights) {
      const poly = visibilityPolygon(L.x, L.y, L.r);
      if (poly.length < 3) continue;
      darkCtx.save();
      darkCtx.beginPath(); darkCtx.moveTo(poly[0].x, poly[0].y);
      for (let i = 1; i < poly.length; i++) darkCtx.lineTo(poly[i].x, poly[i].y);
      darkCtx.closePath(); darkCtx.clip();
      darkCtx.globalCompositeOperation = 'destination-out';
      const grad = darkCtx.createRadialGradient(L.x, L.y, 0, L.x, L.y, Math.max(1, L.r));
      grad.addColorStop(0, 'rgba(0,0,0,1)');
      grad.addColorStop(0.62, 'rgba(0,0,0,0.82)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      darkCtx.fillStyle = grad; darkCtx.fillRect(L.x - L.r, L.y - L.r, L.r * 2, L.r * 2);
      darkCtx.restore();
    }
    ctx.drawImage(darkCanvas, 0, 0, w, h);

    // warm light cores - additive, so explored areas glow naturally
    ctx.globalCompositeOperation = 'lighter';
    for (const L of lights) {
      const r = Math.max(1, L.r);
      const grd = ctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, r);
      const baseAlpha = L.pulse ? 0.22 : 0.14 + (L.r / lanternMax) * 0.12;
      grd.addColorStop(0, 'rgba(255,235,190,' + (baseAlpha * (1 - brought * 0.4)) + ')');
      grd.addColorStop(0.55, 'rgba(255,190,120,' + (baseAlpha * 0.55) + ')');
      grd.addColorStop(1, 'rgba(255,140,60,0)');
      ctx.fillStyle = grd; ctx.fillRect(L.x - r, L.y - r, r * 2, r * 2);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawTorches() {
    for (const t of torches) {
      const f = flicker(simT * 3, t.seed);
      ctx.fillStyle = '#2c2212'; ctx.fillRect(t.x - 3, t.y - 2, 6, 22);
      ctx.fillStyle = '#ffe2b0';
      ctx.beginPath(); ctx.arc(t.x, t.y - 10, 3.4 * f, 0, Math.PI * 2); ctx.fill();
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(glow, t.x - 20 * f, t.y - 26 * f, 40 * f, 50 * f);
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  function drawLanternCursor() {
    const f = flicker(simT, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(glow, mouseX - 20 * f, mouseY - 20 * f, 40 * f, 40 * f);
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = 'rgba(255,235,200,0.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(mouseX, mouseY, 7, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#fff6d8'; ctx.beginPath(); ctx.arc(mouseX, mouseY, 2.5, 0, Math.PI * 2); ctx.fill();
  }

  function drawPulseRing() {
    if (!pulse) return;
    const p = pulse.t;
    const maxR = Math.hypot(w, h) * 0.92;
    let r, alpha;
    if (p < PULSE_EXPAND) { r = easeOutExpo(p / PULSE_EXPAND) * maxR; alpha = 0.55; }
    else if (p < PULSE_EXPAND + PULSE_HOLD) { r = maxR; alpha = 0.55; }
    else { const f = (p - PULSE_EXPAND - PULSE_HOLD) / PULSE_FADE; r = maxR; alpha = 0.55 * (1 - f); }
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.max(0, alpha);
    ctx.strokeStyle = 'rgba(255,240,210,1)'; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.arc(pulse.x, pulse.y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }

  function drawParticles() {
    ctx.globalCompositeOperation = 'lighter';
    for (const p of parts) {
      if (p.life <= 0) continue;
      const t = p.life / p.max;
      ctx.globalAlpha = t * 0.55;
      ctx.fillStyle = p.color; ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * t, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = t * 0.18;
      ctx.drawImage(glow, p.x - p.size * 2.3, p.y - p.size * 2.3, p.size * 4.6, p.size * 4.6);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }

  function drawCelebration() {
    if (!celebrating) return;
    const f = clamp(celebT / CELEBRATE_DUR, 0, 1);
    const alpha = f < 0.12 ? f / 0.12 : f > 0.82 ? (1 - f) / 0.18 : 1;
    ctx.globalAlpha = alpha; ctx.textAlign = 'center';
    ctx.fillStyle = '#f3ffe8'; ctx.font = 'bold 40px "Segoe UI", sans-serif';
    ctx.shadowColor = 'rgba(160,255,190,0.7)'; ctx.shadowBlur = 22;
    ctx.fillText('\u2728 All gems found! \u2728', w / 2, h * 0.42);
    ctx.font = '17px "Segoe UI", sans-serif'; ctx.shadowBlur = 10;
    ctx.fillText('Seeding a new maze\u2026', w / 2, h * 0.42 + 36);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }

  function render() {
    drawBackground();
    drawWalls();
    drawGems();
    drawLights();
    drawTorches();
    drawPulseRing();
    drawLanternCursor();
    drawParticles();
    drawCelebration();
  }

  // ----- UI text ----------------------------------------------------
  const torchValEl = document.getElementById('torchVal');
  const torchMaxEl = document.getElementById('torchMaxVal');
  const radiusEl = document.getElementById('radiusVal');
  const foundEl = document.getElementById('foundVal');
  const totalEl = document.getElementById('totalVal');
  const fpsEl = document.getElementById('fpsVal');
  let lastTorch = -1, lastRadius = -1, lastFound = -1, lastTotal = -1;
  const fpsWindow = [];
  let lastT = performance.now();

  function updateUI(now) {
    if (torches.length !== lastTorch) { torchValEl.textContent = torches.length; lastTorch = torches.length; }
    const rr = Math.round(lanternRadius);
    if (rr !== lastRadius) { radiusEl.textContent = rr; lastRadius = rr; }
    if (found !== lastFound) { foundEl.textContent = found; lastFound = found; }
    if (total !== lastTotal) { totalEl.textContent = total; lastTotal = total; }
    torchMaxEl.textContent = MAX_TORCHES;

    const dt = now - lastT; lastT = now;
    if (dt > 0) { fpsWindow.push(1000 / dt); if (fpsWindow.length > 70) fpsWindow.shift(); }
    if (fpsWindow.length) {
      const avg = fpsWindow.reduce((a, b) => a + b, 0) / fpsWindow.length;
      fpsEl.textContent = Math.round(avg);
    }
  }

  // ----- loop -------------------------------------------------------
  const DT = 1 / 60;
  let acc = 0, last = performance.now();
  let running = true;

  function frame(now) {
    if (running) {
      acc += Math.min((now - last) / 1000, 0.1);
      last = now;
      while (acc >= DT) { update(DT); acc -= DT; }
      render();
      updateUI(now);
    } else {
      last = now;
    }
    requestAnimationFrame(frame);
  }

  document.addEventListener('visibilitychange', () => {
    running = !document.hidden;
    if (running) last = performance.now();
  });

  fitCanvas();
  buildMazeGeometry();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
