<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Goo Lamp 2.0</title>
  <!--
    Implements HANDBOOK_SMALL.md:
      §0   mouse-first controls, controls pane, no touch, reset button
      §2   fixed timestep + DPR-aware canvas
      §4   gooey metaballs (blur+contrast composite), OKLCH heat-shifted palette,
           never-pure-black background, additive glow
      §5   wobble, soft pops on contact, ambient drifting motes, pentatonic sound (off by default)
      §7   no fail states, every input does something, tuned for max chaos
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0714; }
    canvas { display: block; }
    #ui {
      position: fixed; top: 16px; left: 16px; color: #ccc; font-size: 13px;
      pointer-events: none; z-index: 10; background: rgba(10,8,20,0.75);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
      padding: 14px 18px; backdrop-filter: blur(10px); line-height: 1.7;
      min-width: 230px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #ui h3 { color: #fff; margin-bottom: 6px; font-size: 14px; letter-spacing: 0.5px; }
    #ui .param { display: flex; justify-content: space-between; gap: 12px; }
    #ui .key { color: #888; }
    #ui .val { color: #ffb37a; font-weight: 600; font-variant-numeric: tabular-nums; }
    #resetBtn, #muteBtn {
      position: fixed; z-index: 10; padding: 10px 28px; font-size: 14px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ccc; background: rgba(10,8,20,0.80); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px; cursor: pointer; backdrop-filter: blur(10px);
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    #resetBtn { bottom: 24px; left: 50%; transform: translateX(-50%); }
    #muteBtn { top: 16px; right: 16px; padding: 10px 14px; font-size: 18px; line-height: 1; }
    #resetBtn:hover, #muteBtn:hover { background: rgba(50,36,70,0.90); color: #fff; border-color: rgba(255,255,255,0.30); }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h3>🔥 Goo Lamp 2.0</h3>
  <div class="param"><span class="key">Move</span><span class="val">Stir the goo</span></div>
  <div class="param"><span class="key">Drag (Left)</span><span class="val">Grab &amp; fling</span></div>
  <div class="param"><span class="key">Right-click blob</span><span class="val">Split it</span></div>
  <div class="param"><span class="key">Right-click glass</span><span class="val">Heat burst</span></div>
  <div class="param"><span class="key">Scroll</span><span class="val">Heat: <span id="heatVal">1.0</span>&times;</span></div>
  <br>
  <div class="param"><span class="key">Blobs:</span><span class="val" id="blobCountVal">0</span></div>
</div>
<button id="muteBtn" title="Sound on/off" aria-label="Toggle sound">🔇</button>
<button id="resetBtn">&#x21BA; Reset lamp</button>
<script>
'use strict';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w = 0, h = 0;

// ---- §2 DPR-aware canvas ----
let offCanvas = document.createElement('canvas');
let offCtx = offCanvas.getContext('2d');
function fitCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  w = window.innerWidth; h = window.innerHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // metaball buffer: plain CSS-pixel resolution — it gets blurred anyway,
  // and staying unscaled keeps the filter pass cheap.
  offCanvas.width = w; offCanvas.height = h;
  computeLampGeometry();
}
const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- Lamp geometry: a rounded "capsule" glass, recomputed on resize ----
const lamp = { cx: 0, top: 0, bottom: 0, halfW: 0, capTopY: 0, capBottomY: 0 };
function computeLampGeometry() {
  lamp.cx = w / 2;
  lamp.top = h * 0.08;
  lamp.bottom = h * 0.90;
  lamp.halfW = Math.min(w * 0.15, (lamp.bottom - lamp.top) * 0.42, 170);
  lamp.capTopY = lamp.top + lamp.halfW;
  lamp.capBottomY = lamp.bottom - lamp.halfW;
}

function lampPath(ctx2, pad) {
  const r = lamp.halfW - pad;
  ctx2.beginPath();
  ctx2.arc(lamp.cx, lamp.capTopY, r, Math.PI, Math.PI * 2, false);
  ctx2.lineTo(lamp.cx + r, lamp.capBottomY);
  ctx2.arc(lamp.cx, lamp.capBottomY, r, 0, Math.PI, false);
  ctx2.closePath();
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// ---- Palette: classic lava-lamp hues, heat-shifted OKLCH (§4) ----
const HUES = [330, 22, 268, 196]; // magenta, amber, violet, azure
function blobColor(b) {
  const tv = (b.temp * 50) | 0;
  if (b._ctv === tv) return b._c;
  const hue = b.hueBase + (b.temp - 0.5) * 60;   // hot -> warmer, cold -> cooler
  const light = 56 + b.temp * 16;
  return b._c = `oklch(${light}% 0.20 ${hue})`;
}

// ---- §5: Easing functions (overshoot, bounce, elastic) ----
function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}
function easeOutElastic(t) {
  if (t === 0 || t === 1) return t;
  return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI / 3)) + 1;
}
// Spring: damped oscillation toward target
function spring(val, vel, target, stiffness, damping, dt) {
  const force = (target - val) * stiffness;
  vel += force * dt;
  vel *= Math.pow(damping, dt);
  val += vel * dt;
  return { val, vel };
}

// ---- §5: ZzFX-style sound system (ZzFXMicro) ----
// ZzFX: Zuper Zmall Zound Zynth — tiny chiptune synth in ~100 bytes
// Parameters: g=volume, a=pitch, l=length, d=decay, c=pitchCurve, s=pitchSlide,
//             n=noise, atk=attack, dk=decay, su=sustain, rel=release,
//             vc=volumeCurve, vs=volumeSlide, rt=repeatTime, rc=repeatCurve,
//             rs=repeatSlide, bc=bitCrush, dt=detune, ff=filterFreq, fq=filterQ, fc=filterCurve
function zzfx(a, c, l, d, e, f, g, h, i, j, k, m, n, o, p, q, r, s, t, u, v) {
  if (muted || !AC) return;
  a = a || 0; c = c || 0; l = l || 0; d = d || 0; e = e || 0; f = f || 0;
  g = g || 0; h = h || 0; i = i || 0; j = j || 0; k = k || 0; m = m || 0;
  n = n || 0; o = o || 0; p = p || 0; q = q || 0; r = r || 0; s = s || 0;
  t = t || 0; u = u || 0; v = v || 0;
  const sr = AC.sampleRate;
  const dur = Math.max(0.01, (l + h + i + j + k) / sr);
  const len = Math.floor(sr * dur);
  const buf = AC.createBuffer(1, len, sr);
  const data = buf.getChannelData(0);
  for (let x = 0; x < len; x++) {
    const t2 = x / sr;
    let env = 0;
    if (t2 < h) env = t2 / h;
    else if (t2 < h + i) env = 1 - (t2 - h) / i;
    else if (t2 < h + i + j) env = 1;
    else if (t2 < h + i + j + k) env = 1 - (t2 - h - i - j) / k;
    let pit = a + e * (x / sr) + f * (x / sr) * (x / sr);
    if (pit < 0) pit = 0;
    let sam = 0;
    if (g > 0) sam = Math.random() * 2 - 1;
    else {
      const ph = 2 * Math.PI * pit * t2;
      if (c === 0) sam = Math.sin(ph);
      else if (c === 1) sam = Math.sign(Math.sin(ph));
      else if (c === 2) sam = (2 * t2 * pit) % 1;
      else sam = Math.sin(ph) * 0.5 + Math.sin(ph * 0.5) * 0.5;
    }
    if (m) sam *= (1 + m * Math.sin(2 * Math.PI * n * t2));
    sam += g * (Math.random() * 2 - 1) * 0.5;
    if (t) sam *= Math.min(1, t / 44100);
    data[x] = sam * env * 0.12;
  }
  const src = AC.createBufferSource();
  src.buffer = buf;
  src.connect(AC.destination);
  src.start(AC.currentTime);
}

// ---- §5: Predefined ZzFX sound effects ----
const zzfxSpawn = () => zzfx(0.5, 0, 0, 0.2, 0, 0, 0, 0.01, 0.05, 0.1, 0.05);
const zzfxCollision = (vel) => zzfx(0.3 + vel * 0.05, 0, 0, 0.15, 0, -vel * 2, 0, 0.01, 0.05, 0.05, 0.05);
const zzfxRepel = () => zzfx(0.3, 0, 0, 0.1, 0, 0, 0.5, 0.01, 0.03, 0.04, 0.02);
const zzfxMerge = () => zzfx(0.4, 0, 0, 0.25, 0, 0, 0, 0.02, 0.08, 0.1, 0.05);

function ensureAudio() {
  if (muted) return;
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
}
function tone(f0, f1, dur, vol, type, delay) {
  if (muted || !AC) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(AC.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const PENTA = [0, 2, 4, 7, 9];
const penta = (base, i) => base * Math.pow(2, (PENTA[i % 5] + 12 * ((i / 5) | 0)) / 12);

// ---- Pre-rendered glow sprite for cheap additive particles (§4, §6) ----
const glow = document.createElement('canvas');
glow.width = glow.height = 64;
{
  const g = glow.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.35, 'rgba(255,255,255,0.35)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
}
const POOL = 200;
const parts = [];
for (let i = 0; i < POOL; i++) parts.push({ x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 8, color: '#fff' });
let partHead = 0;
function spawnPart(x, y, vx, vy, size, color, life) {
  const p = parts[partHead]; partHead = (partHead + 1) % POOL;
  p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.size = size; p.color = color; p.life = p.max = life;
}
function burst(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 0.8 + Math.random() * 2.6;
    spawnPart(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 0.6, 3 + Math.random() * 5, color, 0.35 + Math.random() * 0.4);
  }
}

// ---- Ambient room motes for background life (§5) ----
const motes = [];
for (let i = 0; i < 14; i++)
  motes.push({ x: Math.random(), y: Math.random(), r: 14 + Math.random() * 40,
               spd: (0.00008 + Math.random() * 0.00025) * (reducedMotion ? 0.2 : 1), a: 0.02 + Math.random() * 0.035 });

// ---- Audio mute state (off by default) ----
let muted = true;
let AC = null;

// ---- Blobs ----
let nextId = 0;
const MAX_BLOBS = 18;
const MIN_SPLIT_R = 17;
let blobs = [];
let heatLevel = 1.0;

function createBlob(x, y, r, temp, hueBase) {
  return {
    id: nextId++, x, y, r,
    vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4,
    temp: temp ?? Math.random(),
    hueBase: hueBase ?? (HUES[(Math.random() * HUES.length) | 0] + (Math.random() - 0.5) * 14),
    phase: Math.random() * Math.PI * 2,
    grabbed: false,
  };
}
function rEff(b) { return b.r * (1 + b.temp * 0.16); }

function resetLamp() {
  blobs = [];
  const n = 9;
  for (let i = 0; i < n; i++) {
    const r = 24 + Math.random() * 22;
    const x = lamp.cx + (Math.random() - 0.5) * lamp.halfW * 1.0;
    const y = lamp.capTopY + Math.random() * (lamp.capBottomY - lamp.capTopY);
    const b = createBlob(x, y, r, 0.35 + Math.random() * 0.3);
    // §5: spawn easing — blobs pop in with overshoot
    b.spawnAnim = { t: 0, dur: 0.4 + Math.random() * 0.2, ease: Math.random() < 0.5 ? 'back' : 'elastic' };
    blobs.push(b);
  }
  heatLevel = 1.0;
  for (const p of parts) p.life = 0;
  touchingSet.clear();
  grabbedBlob = null;
}

// ---- Mouse ----
const mouse = { x: -9999, y: -9999, active: false };
const prevMouse = { x: 0, y: 0 };
let grabbedBlob = null;

function blobAt(x, y) {
  let best = null, bestD = Infinity;
  for (let i = blobs.length - 1; i >= 0; i--) {
    const b = blobs[i];
    const d = Math.hypot(b.x - x, b.y - y);
    if (d < rEff(b) && d < bestD) { best = b; bestD = d; }
  }
  return best;
}
function nearestBlob(x, y) {
  let best = null, bestD = Infinity;
  for (const b of blobs) {
    const d = Math.hypot(b.x - x, b.y - y);
    if (d < bestD) { best = b; bestD = d; }
  }
  return best;
}

function splitBlob(b) {
  const idx = blobs.indexOf(b);
  if (idx < 0) return;
  if (b.r < MIN_SPLIT_R * 1.4 || blobs.length >= MAX_BLOBS) {
    // too small (or lamp is full) to split cleanly — heat pulse instead so
    // the click always does *something* (§7)
    b.temp = 1;
    burst(b.x, b.y, 10, blobColor(b));
    tone(520, 480, 0.12, 0.10, 'sine');
    zzfxRepel();
    addTrauma(0.05);
    return;
  }
  blobs.splice(idx, 1);
  const newR = b.r / Math.SQRT2;
  const ang = Math.random() * Math.PI * 2;
  const off = newR * 0.55;
  for (let i = 0; i < 2; i++) {
    const a = ang + i * Math.PI + (Math.random() - 0.5) * 0.5;
    const nb = createBlob(b.x + Math.cos(a) * off, b.y + Math.sin(a) * off, newR, b.temp, b.hueBase + (Math.random() - 0.5) * 18);
    nb.vx = b.vx + Math.cos(a) * 1.4;
    nb.vy = b.vy + Math.sin(a) * 1.4;
    // §5: split children pop in with easing
    nb.spawnAnim = { t: 0, dur: 0.3, ease: 'back' };
    blobs.push(nb);
  }
  burst(b.x, b.y, 24, blobColor(b));
  const n = (Math.random() * 5) | 0;
  tone(penta(392, n), penta(392, n) * 1.4, 0.14, 0.14, 'triangle');
  tone(penta(392, n + 2), penta(392, n + 2) * 0.7, 0.18, 0.10, 'sine', 0.05);
  zzfxMerge();
  addTrauma(0.15);
  hitStopFrames = HIT_STOP_FRAMES;
}

function heatBurst(x, y) {
  const R = 165;
  for (const b of blobs) {
    const d = Math.hypot(b.x - x, b.y - y);
    if (d < R) b.temp = clamp(b.temp + (1 - d / R) * 0.85, 0, 1);
  }
  burst(x, y, 30, 'oklch(78% 0.20 45)');
  tone(180, 640, 0.30, 0.16, 'sawtooth');
  zzfxRepel();
  addTrauma(0.1);
}

// ---- §5: Screenshake (trauma²) + hit-stop ----
let trauma = 0;
let shakeTime = 0;
let hitStopFrames = 0;
const HIT_STOP_FRAMES = 3; // ~50ms freeze on hard impacts

function addTrauma(amount) {
  trauma = Math.min(1, trauma + amount);
}

canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
});
canvas.addEventListener('mouseleave', () => { mouse.active = false; });
canvas.addEventListener('mousedown', e => {
  ensureAudio();
  if (e.button === 0) {
    const b = nearestBlob(e.clientX, e.clientY);
    if (b) {
      grabbedBlob = b; b.grabbed = true;
      tone(penta(300, (Math.random() * 5) | 0), 280, 0.08, 0.09, 'sine');
    }
  } else if (e.button === 2) {
    const b = blobAt(e.clientX, e.clientY);
    if (b) splitBlob(b); else heatBurst(e.clientX, e.clientY);
  }
});
window.addEventListener('mouseup', e => {
  if (e.button === 0 && grabbedBlob) {
    grabbedBlob.grabbed = false;
    grabbedBlob.vx += (mouse.x - prevMouse.x) * 0.6;
    grabbedBlob.vy += (mouse.y - prevMouse.y) * 0.6;
    grabbedBlob = null;
  }
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  heatLevel = clamp(heatLevel - Math.sign(e.deltaY) * 0.12, 0.2, 3.0);
}, { passive: false });

document.getElementById('resetBtn').addEventListener('click', resetLamp);
const muteBtn = document.getElementById('muteBtn');
muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  ensureAudio();
  if (!muted) tone(523, 530, 0.1, 0.12, 'sine');
});
window.addEventListener('resize', fitCanvas);

// ---- Physics step, fixed at 1/60s (§2.1) ----
const heaterZoneFrac = 0.24, coolZoneFrac = 0.18;
// §6.2: zero-allocation hot loop — reuse Set across frames, never allocate
const touchingSet = new Set();
let simTime = 0;

function constrainToLamp(b) {
  const r = rEff(b);
  let nx, ny;
  if (b.y < lamp.capTopY) { nx = lamp.cx; ny = lamp.capTopY; }
  else if (b.y > lamp.capBottomY) { nx = lamp.cx; ny = lamp.capBottomY; }
  else { nx = lamp.cx; ny = b.y; }
  const dx = b.x - nx, dy = b.y - ny;
  const d = Math.hypot(dx, dy) || 0.0001;
  const maxD = lamp.halfW - r - 4;
  if (d > maxD) {
    const ux = dx / d, uy = dy / d;
    b.x = nx + ux * maxD; b.y = ny + uy * maxD;
    const vn = b.vx * ux + b.vy * uy;
    if (vn > 0) { b.vx -= ux * vn * 1.4; b.vy -= uy * vn * 1.4; }
  }
}

function step() {
  simTime += 1 / 60;
  const heaterZoneY = lamp.bottom - (lamp.bottom - lamp.top) * heaterZoneFrac;
  const coolZoneY = lamp.top + (lamp.bottom - lamp.top) * coolZoneFrac;
  const turbAmp = reducedMotion ? 0.01 : 0.05;

  for (const b of blobs) {
    if (b.grabbed) {
      // damped spring follows the cursor — grab is the primary left-button verb
      b.vx += (mouse.x - b.x) * 0.05;
      b.vy += (mouse.y - b.y) * 0.05;
      b.vx *= 0.78; b.vy *= 0.78;
      b.x += b.vx; b.y += b.vy;
      constrainToLamp(b);
      continue;
    }

    // §5: spawn easing — blobs pop in with overshoot
    if (b.spawnAnim) {
      b.spawnAnim.t += 1 / 60;
      const t = clamp(b.spawnAnim.t / b.spawnAnim.dur, 0, 1);
      const ease = b.spawnAnim.ease === 'elastic' ? easeOutElastic(t) : easeOutBack(t);
      b.rAnim = ease; // scale factor for rendering
      if (t >= 1) { b.spawnAnim = null; b.rAnim = 1; }
    } else {
      b.rAnim = 1;
    }

    // §5: ambient blob life (breathing, idle wobble)
    b.breathePhase = (b.breathePhase || 0) + 1 / 60 * (0.8 + b.temp * 1.2);
    const breathe = Math.sin(b.breathePhase) * 0.03;
    b.rBreath = 1 + breathe;
    b.wobblePhase = (b.wobblePhase || 0) + 1 / 60 * 0.5;
    b.vx += Math.sin(b.wobblePhase * 1.3 + b.phase) * 0.02;
    b.vy += Math.cos(b.wobblePhase * 0.9 + b.phase * 1.7) * 0.015;
    b.blinkTimer = (b.blinkTimer || 2 + Math.random() * 4) - 1 / 60;
    if (b.blinkTimer <= 0) {
      b.blinking = !b.blinking;
      b.blinkTimer = b.blinking ? 0.12 : 2 + Math.random() * 5;
    }

    // §heat: heater at the base, cooling at the crown — real convection, not scripted motion
    if (b.y > heaterZoneY) {
      const f = (b.y - heaterZoneY) / (lamp.bottom - heaterZoneY);
      b.temp += heatLevel * 0.011 * f;
    } else if (b.y < coolZoneY) {
      const f = (coolZoneY - b.y) / (coolZoneY - lamp.top);
      b.temp -= 0.008 * f;
    } else {
      b.temp += (0.5 - b.temp) * 0.006;
    }
    b.temp = clamp(b.temp, 0, 1);

    // buoyancy: hot rises, cool sinks
    b.vy += (0.5 - b.temp) * 0.013;

    // organic wander so cycling never looks like scripted up/down travel
    b.vx += Math.sin(simTime * 0.6 + b.phase) * turbAmp * 0.02
           + Math.sin(simTime * 0.23 + b.phase * 1.7) * turbAmp * 0.012;
    b.vy += Math.cos(simTime * 0.5 + b.phase * 1.3) * turbAmp * 0.012;

    // mouse stir: attract + swirl, matters even with no button held (§0.1)
    if (mouse.active) {
      const dx = b.x - mouse.x, dy = b.y - mouse.y;
      const d = Math.hypot(dx, dy);
      if (d < 170 && d > 1) {
        const fall = (1 - d / 170);
        b.vx += (-dx / d * 0.10 - dy / d * 0.15) * fall;
        b.vy += (-dy / d * 0.10 + dx / d * 0.15) * fall;
      }
    }

    b.vx *= 0.985; b.vy *= 0.985;
    b.x += b.vx; b.y += b.vy;
    constrainToLamp(b);
  }

  // gentle mutual separation so blobs don't fully collapse to a point
  // (metaballs still overlap plenty for merging — this only resists total stacking)
  for (let i = 0; i < blobs.length; i++) {
    for (let j = i + 1; j < blobs.length; j++) {
      const A = blobs[i], B = blobs[j];
      const rA = rEff(A), rB = rEff(B);
      const dx = B.x - A.x, dy = B.y - A.y;
      const d = Math.hypot(dx, dy) || 0.001;
      const minD = (rA + rB) * 0.42;
      if (d < minD) {
        const push = (minD - d) / d * 0.5;
        if (!A.grabbed) { A.x -= dx * push * 0.5; A.y -= dy * push * 0.5; }
        if (!B.grabbed) { B.x += dx * push * 0.5; B.y += dy * push * 0.5; }
      }
    }
  }

  // contact shimmer: fires once per new "touch", not every frame (§5 juice)
  // §6.2: reuse the same Set — clear instead of allocating new each frame
  touchingSet.clear();
  for (let i = 0; i < blobs.length; i++) {
    for (let j = i + 1; j < blobs.length; j++) {
      const A = blobs[i], B = blobs[j];
      const d = Math.hypot(B.x - A.x, B.y - A.y);
      if (d < (rEff(A) + rEff(B)) * 0.85) {
        const lo = Math.min(A.id, B.id), hi = Math.max(A.id, B.id);
        // §6.2: numeric key (no string concat) — key = lo * 1000 + hi
        const key = lo * 1000 + hi;
        if (!touchingSet.has(key)) {
          touchingSet.add(key);
          burst((A.x + B.x) / 2, (A.y + B.y) / 2, 12, blobColor(A));
          tone(penta(660, (Math.random() * 5) | 0), 700, 0.08, 0.05, 'sine');
          zzfxCollision(Math.hypot(A.vx - B.vx, A.vy - B.vy));
          addTrauma(0.03);
        }
      }
    }
  }

  // particles
  for (const p of parts) {
    if (p.life <= 0) continue;
    p.life -= 1 / 60;
    p.vy += 0.05; p.vx *= 0.97; p.vy *= 0.97;
    p.x += p.vx; p.y += p.vy;
  }

  // cursor affordance: grabbing / grab / stir (movement always matters — §0.1)
  if (grabbedBlob) canvas.style.cursor = 'grabbing';
  else canvas.style.cursor = blobAt(mouse.x, mouse.y) ? 'grab' : 'crosshair';

  prevMouse.x = mouse.x; prevMouse.y = mouse.y;
}

// ---- Rendering ----
function drawGooLayer() {
  offCtx.clearRect(0, 0, w, h);
  // §6.2: single save/restore around the whole blob loop — avoid per-iteration ctx.save/restore
  offCtx.save();
  for (const b of blobs) {
    // §5: apply spawn easing scale and breathing scale to effective radius
    const rBase = rEff(b);
    const rAnim = b.rAnim ?? 1;
    const rBreath = b.rBreath ?? 1;
    const wobble = reducedMotion ? 0 : 0.025 * Math.sin(simTime * 2.4 + b.phase);
    const r = rBase * rAnim * rBreath * (1 + wobble);
    // §5: volume-preserving squash/stretch — stretch along velocity axis, squash perpendicular
    const speed = Math.hypot(b.vx, b.vy);
    const stretch = Math.min(0.45, speed * 0.08);
    const angle = Math.atan2(b.vy, b.vx || 0.001);
    // Volume-preserving: rx * ry = r², so ry = r / rx
    const rx = r * (1 + stretch);
    const ry = r * r / rx; // ensures area preservation
    offCtx.translate(b.x, b.y);
    offCtx.rotate(angle);
    offCtx.beginPath();
    offCtx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    offCtx.fillStyle = blobColor(b);
    offCtx.fill();
    offCtx.rotate(-angle);
    offCtx.translate(-b.x, -b.y);
  }
  offCtx.restore();
}

function draw() {
  ctx.clearRect(0, 0, w, h);

  // §5: hit-stop — freeze frames on hard impacts
  if (hitStopFrames > 0) {
    hitStopFrames--;
    // still draw but skip physics updates (handled in frame loop)
  }

  // §5: trauma² screenshake + rotation
  let shook = false;
  if (trauma > 0.01) {
    const shakeX = (Math.random() - 0.5) * trauma * 20;
    const shakeY = (Math.random() - 0.5) * trauma * 20;
    const rot = (Math.random() - 0.5) * trauma * 0.02;
    ctx.save();
    ctx.translate(w / 2 + shakeX, h / 2 + shakeY);
    ctx.rotate(rot);
    ctx.translate(-w / 2, -h / 2);
    trauma *= 0.92; // decay
    if (trauma < 0.01) trauma = 0;
    shook = true;
  } else {
    trauma = 0;
  }

  // room background — never pure black (§4)
  const bg = ctx.createRadialGradient(w * 0.5, h * 0.3, 0, w * 0.5, h * 0.6, Math.max(w, h) * 0.8);
  bg.addColorStop(0, '#191233'); bg.addColorStop(1, '#07050f');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);

  ctx.globalCompositeOperation = 'lighter';
  for (const m of motes) {
    m.y -= m.spd; if (m.y < -0.1) { m.y = 1.1; m.x = Math.random(); }
    ctx.globalAlpha = m.a;
    ctx.drawImage(glow, m.x * w - m.r, m.y * h - m.r, m.r * 2, m.r * 2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // warm base glow, sells the heater under the glass, brighter as heat rises
  ctx.globalCompositeOperation = 'lighter';
  const baseGlowR = 220 + heatLevel * 60;
  const baseGlow = ctx.createRadialGradient(lamp.cx, lamp.bottom, 0, lamp.cx, lamp.bottom, baseGlowR);
  baseGlow.addColorStop(0, `rgba(255,150,60,${0.16 + heatLevel * 0.08})`);
  baseGlow.addColorStop(1, 'rgba(255,150,60,0)');
  ctx.fillStyle = baseGlow;
  ctx.fillRect(lamp.cx - baseGlowR, lamp.bottom - baseGlowR, baseGlowR * 2, baseGlowR * 2);
  ctx.globalCompositeOperation = 'source-over';

  ctx.save();
  lampPath(ctx, 4);
  ctx.clip();

  // inner ambient fluid tint: warm at the base, cool at the crown
  const tint = ctx.createLinearGradient(0, lamp.top, 0, lamp.bottom);
  tint.addColorStop(0, 'rgba(90,110,200,0.10)');
  tint.addColorStop(0.75, 'rgba(40,20,50,0.05)');
  tint.addColorStop(1, 'rgba(255,140,60,0.14)');
  ctx.fillStyle = tint;
  ctx.fillRect(lamp.cx - lamp.halfW, lamp.top, lamp.halfW * 2, lamp.bottom - lamp.top);

  // heater glow inside the fluid
  ctx.globalCompositeOperation = 'lighter';
  const hg = ctx.createRadialGradient(lamp.cx, lamp.bottom, 0, lamp.cx, lamp.bottom, lamp.halfW * 1.8);
  hg.addColorStop(0, `rgba(255,120,40,${0.10 + heatLevel * 0.10})`);
  hg.addColorStop(1, 'rgba(255,120,40,0)');
  ctx.fillStyle = hg; ctx.fillRect(lamp.cx - lamp.halfW * 2, lamp.bottom - lamp.halfW * 2, lamp.halfW * 4, lamp.halfW * 2.2);
  ctx.globalCompositeOperation = 'source-over';

  drawGooLayer();

  // §4 gooey metaballs: plain circles blurred + contrast-boosted so they merge like mercury
  ctx.filter = 'blur(12px) contrast(30)';
  ctx.drawImage(offCanvas, 0, 0, w, h);
  ctx.filter = 'none';

  // cheap bloom: same buffer, softer blur, additive, low alpha (§4 cheap post-processing)
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.30;
  ctx.filter = 'blur(24px)';
  ctx.drawImage(offCanvas, 0, 0, w, h);
  ctx.filter = 'none';
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // shimmer / heat-burst particles, inside the glass (§6.2: batched by color)
  ctx.globalCompositeOperation = 'lighter';
  // Bucket particles by color so we do one beginPath/fill per color, not per particle
  const buckets = [];
  let bucketCount = 0;
  for (const p of parts) {
    if (p.life <= 0) continue;
    const col = p.color;
    let bkt = null;
    for (let k = 0; k < bucketCount; k++) {
      if (buckets[k].color === col) { bkt = buckets[k]; break; }
    }
    if (!bkt) {
      bkt = { color: col, count: 0, x: [], y: [], s: [], gi: [], sz: [] };
      buckets[bucketCount++] = bkt;
    }
    const t = p.life / p.max;
    bkt.x[bkt.count] = p.x;
    bkt.y[bkt.count] = p.y;
    bkt.s[bkt.count] = p.size * t;
    bkt.gi[bkt.count] = t * 0.5;
    bkt.sz[bkt.count] = p.size;
    bkt.count++;
  }
  // Draw solid circles batched by color
  for (let k = 0; k < bucketCount; k++) {
    const bk = buckets[k];
    ctx.fillStyle = bk.color;
    ctx.beginPath();
    for (let i = 0; i < bk.count; i++) {
      ctx.arc(bk.x[i], bk.y[i], bk.s[i], 0, Math.PI * 2);
    }
    ctx.fill();
  }
  // Draw glow sprites batched by color (alpha varies, so per-particle)
  for (let k = 0; k < bucketCount; k++) {
    const bk = buckets[k];
    for (let i = 0; i < bk.count; i++) {
      ctx.globalAlpha = bk.gi[i];
      ctx.drawImage(glow, bk.x[i] - bk.sz[i] * 2, bk.y[i] - bk.sz[i] * 2, bk.sz[i] * 4, bk.sz[i] * 4);
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  ctx.restore(); // remove clip

  // glass: rim stroke + a couple of soft reflection streaks
  lampPath(ctx, 1);
  const rim = ctx.createLinearGradient(lamp.cx - lamp.halfW, 0, lamp.cx + lamp.halfW, 0);
  rim.addColorStop(0, 'rgba(255,255,255,0.35)');
  rim.addColorStop(0.5, 'rgba(255,255,255,0.06)');
  rim.addColorStop(1, 'rgba(255,255,255,0.22)');
  ctx.strokeStyle = rim; ctx.lineWidth = 3; ctx.stroke();

  ctx.save();
  lampPath(ctx, 1);
  ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  ctx.beginPath();
  ctx.ellipse(lamp.cx - lamp.halfW * 0.45, (lamp.top + lamp.bottom) / 2, lamp.halfW * 0.22, (lamp.bottom - lamp.top) * 0.42, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // base plinth, glowing with heat
  const plinthH = Math.max(22, lamp.halfW * 0.5);
  const plinthW = lamp.halfW * 2.5;
  const py = lamp.bottom - lamp.halfW * 0.15;
  ctx.fillStyle = '#2a2035';
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(lamp.cx - plinthW / 2, py, plinthW, plinthH, 8) :
    ctx.rect(lamp.cx - plinthW / 2, py, plinthW, plinthH);
  ctx.fill();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = `rgba(255,150,50,${0.25 + heatLevel * 0.12})`;
  ctx.beginPath();
  ctx.ellipse(lamp.cx, py + plinthH * 0.5, plinthW * 0.36, plinthH * 0.6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  // §5: restore screenshake transform
  if (shook) ctx.restore();
}

// ---- UI ----
const heatEl = document.getElementById('heatVal');
const countEl = document.getElementById('blobCountVal');
let lastHeat = -1, lastCount = -1;
function updateUI() {
  if (heatLevel.toFixed(1) !== lastHeat) { heatEl.textContent = heatLevel.toFixed(1); lastHeat = heatLevel.toFixed(1); }
  if (blobs.length !== lastCount) { countEl.textContent = blobs.length; lastCount = blobs.length; }
}

// ---- §2.1 fixed timestep loop ----
const DT = 1 / 60;
let acc = 0, last = performance.now();
function frame(now) {
  acc += Math.min((now - last) / 1000, 0.1);
  last = now;
  // §5: hit-stop — skip physics steps on freeze frames
  if (hitStopFrames > 0) {
    hitStopFrames--;
    draw();
    updateUI();
    requestAnimationFrame(frame);
    return;
  }
  while (acc >= DT) { step(); acc -= DT; }
  draw();
  updateUI();
  requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', () => { last = performance.now(); });

fitCanvas();
resetLamp();
requestAnimationFrame(frame);
</script>
</body>
</html>
