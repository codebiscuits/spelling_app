<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pond</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #080d1a; cursor: crosshair; font-family: system-ui,-apple-system,sans-serif; color: #ddd; }
  canvas { display: block; }

  #ui {
    position: fixed; top: 16px; left: 16px; z-index: 10; pointer-events: none;
    color: #ddd; font-size: 13px; line-height: 1.7;
    background: rgba(10,13,25,0.72); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px; padding: 14px 18px; backdrop-filter: blur(10px);
    min-width: 236px;
  }
  #ui b { color: #fff; font-weight: 600; }
  #ui .row { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
  #ui .key { color: #8a8a9a; }
  #ui .val { color: #7fd8ff; font-weight: 600; font-variant-numeric: tabular-nums; }

  #resetBtn {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 10;
    padding: 10px 28px; font-size: 14px; font-family: inherit; color: #ddd;
    background: rgba(10,13,25,0.80); border: 1px solid rgba(255,255,255,0.16);
    border-radius: 999px; cursor: pointer; backdrop-filter: blur(10px);
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  #resetBtn:hover { background: rgba(26,38,74,0.90); color: #fff; border-color: rgba(255,255,255,0.30); }
  @media (prefers-reduced-motion: reduce) { #resetBtn { transition:none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <b>Pond</b>
  <div class="row"><span class="key">Move</span><span class="val">Ripple surface</span></div>
  <div class="row"><span class="key">Left drag</span><span class="val">Splash</span></div>
  <div class="row"><span class="key">Right drag</span><span class="val">Rain</span></div>
  <div class="row">
    <span class="key">Scroll</span>
    <span class="val">Duck size <span id="sizeVal">12</span></span>
  </div>
  <div class="row"><span class="key">Ducks</span><span class="val" id="duckCount">0</span></div>
  <div class="row"><span class="key">Drops</span><span class="val" id="dropCount">0</span></div>
  <div class="row"><span class="key">FPS</span><span class="val" id="fpsVal">--</span></div>
</div>

<button id="resetBtn">Reset</button>

<script>
(function () {
  'use strict';

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  let w = 0, h = 0;

  // Tunables -----------------------------------------------------------
  const N = 220;                // heightfield sample count
  const K = 0.28;               // neighbour coupling
  const GRAVITY = 0.018;        // pull back to rest height
  const DAMP = 0.985;           // velocity damping
  const MOUSE_PUSH = 1.8;      // movement ripple strength
  const SPLASH_FORCE = 18;     // left click splash strength
  const RAIN_RATE = 0.55;      // rain probability per frame per side
  const DROP_GRAVITY = 420;    // raindrop fall speed
  const DUCK_COUNT = 7;
  const MIN_DUCK_R = 8;
  const MAX_DUCK_R = 26;

  // State --------------------------------------------------------------
  let heights, vels;
  const ducks = []; // authoritative list, lives alongside parallel SoA

  function initDucks() {
    ducks.length = 0;
    for (let i = 0; i < DUCK_COUNT; i++) {
      const x = w * 0.15 + Math.random() * w * 0.7;
      const y = h * 0.28 + Math.random() * h * 0.38;
      ducks.push({ x, y, r: MIN_DUCK_R + Math.random() * (MAX_DUCK_R - MIN_DUCK_R), px: x, py: y, phase: Math.random() * Math.PI * 2 });
    }
  }

  // Display helpers ----------------------------------------------------
  const sizeValEl = document.getElementById('sizeVal');
  const duckCountEl = document.getElementById('duckCount');
  const dropCountEl = document.getElementById('dropCount');
  const fpsValEl = document.getElementById('fpsVal');
  const fpsWindow = [];
  let lastFrame = performance.now();
  let lastUiUpdate = 0;
  let lastDuckCount = -1;

  function updateUI(now) {
    sizeValEl.textContent = duckRadius | 0;
    const dc = ducks.length;
    if (dc !== lastDuckCount) { duckCountEl.textContent = dc; lastDuckCount = dc; }
    if (now - lastUiUpdate > 200) {
      dropCountEl.textContent = drops.length;
      lastUiUpdate = now;
      const dt = now - lastFrame; lastFrame = now;
      if (dt > 0) { fpsWindow.push(1000 / dt); if (fpsWindow.length > 70) fpsWindow.shift(); }
      if (fpsWindow.length) fpsValEl.textContent = Math.round(fpsWindow.reduce((a,b)=>a+b,0)/fpsWindow.length);
    }
  }

  // Canvas setup -------------------------------------------------------
  function fitCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function initDucks() {
    ducks.length = 0;
    for (let i = 0; i < DUCK_COUNT; i++) {
      const x = w * 0.15 + Math.random() * w * 0.7;
      const y = h * 0.28 + Math.random() * h * 0.38;
      ducks.push({ x, y, r: MIN_DUCK_R + Math.random() * (MAX_DUCK_R - MIN_DUCK_R), px: x, py: y, phase: Math.random() * Math.PI * 2 });
    }
  }

  // Display helpers ----------------------------------------------------
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    const nx = e.clientX - r.left;
    const ny = e.clientY - r.top;
    mouse.px = mouse.x; mouse.py = mouse.y;
    mouse.x = nx; mouse.y = ny; mouse.buttons = e.buttons; mouse.inside = true;
  });
  canvas.addEventListener('mouseenter', () => { mouse.inside = true; });
  canvas.addEventListener('mouseleave', () => { mouse.inside = false; mouse.buttons = 0; });
  canvas.addEventListener('mousedown', e => {
    mouse.buttons = e.buttons;
    if (e.button === 0) splash(mouse.x, mouse.y, SPLASH_FORCE, 6 + Math.random() * 10);
    if (e.button === 2) rainOnce(18 + Math.random() * 18);
  });
  window.addEventListener('mouseup', e => { mouse.buttons = e.buttons; });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    for (let i = 0; i < ducks.length; i++) {
      ducks[i].r = Math.max(MIN_DUCK_R, Math.min(MAX_DUCK_R, ducks[i].r - (e.deltaY > 0 ? 1.6 : -1.6)));
    }
  }, { passive: false });

  // Game state helpers ------------------------------------------------
  function reset() {
    heights = new Float32Array(N).fill(0);
    vels = new Float32Array(N).fill(0);
    drops = [];
    initDucks();
  }

  function sampleHeight(x) {
    const t = Math.max(0, Math.min(1, x / w));
    const i = t * (N - 1);
    const a = Math.floor(i), b = Math.min(N - 1, a + 1);
    const f = i - a;
    return (heights[a] * (1 - f) + heights[b] * f);
  }

  function pushHeightAt(x, amount) {
    const t = Math.max(0, Math.min(1, x / w));
    const i = t * (N - 1);
    const a = Math.floor(i);
    //小额的变化也要写入，保留for循环
    const radius = 3;
    for (let j = Math.max(0, a - radius); j <= Math.min(N - 1, a + radius); j++) {
      const falloff = 1 - Math.abs(j - a) / (radius + 1);
      heights[j] += amount * falloff * falloff;
    }
  }

  function splash(x, y, strength, radius) {
    const base = h * 0.62;
    const depth = Math.max(0, y - base);
    pushHeightAt(x, strength * (1 - Math.min(1, depth / 120)));
    spawnSplashParticles(x, Math.min(y, base), 6 + Math.random() * 14, radius);
  }

  function rainOnce(count) {
    drops = drops.concat(Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: -12 - Math.random() * 40,
      v: DROP_GRAVITY * (0.6 + Math.random() * 0.8),
      r: 2 + Math.random() * 2.5,
      life: 1
    })));
  }

  // Particles ---------------------------------------------------------
  const POOL = 220;
  const parts = [];
  const partColors = ['#8ecae6', '#bde0fe', '#caf0f8', '#edf6f9'];
  let partHead = 0;
  for (let i = 0; i < POOL; i++) parts.push({ x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 3, color: '#fff' });

  function spawnPart(x, y, vx, vy, size, color, life) {
    if (parts.length === 0) return;
    const p = parts[partHead];
    partHead = (partHead + 1) % POOL;
    p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.size = size; p.color = color; p.life = p.max = life;
  }

  function spawnSplashParticles(x, y, count, radius) {
    const base = h * 0.62;
    for (let i = 0; i < count; i++) {
      const ang = -Math.PI * Math.random();
      const spd = 40 + Math.random() * 110;
      spawnPart(x, y, Math.cos(ang) * spd * (0.4 + Math.random() * 0.9), Math.sin(ang) * spd, 1.6 + Math.random() * 3.2, partColors[(Math.random() * partColors.length) | 0], 0.45 + Math.random() * 0.55);
    }
    // small ring particle
    if (radius > 0) {
      const rx = x + (Math.random() - 0.5) * 1;
      const ry = y + (Math.random() - 0.5) * 1;
      spawnPart(rx, ry, 0, 0, radius * 0.6, '#dbeafe', 0.3);
    }
  }

  // Update -------------------------------------------------------------
  const DT = 1 / 60;
  let acc = 0, last = performance.now();
  let running = true;

  function update(dt) {
    // heightfield
    const dtFactor = dt * 60;
    for (let i = 1; i < N - 1; i++) {
      vels[i] += ((heights[i - 1] + heights[i + 1]) * 0.5 - heights[i]) * K;
      vels[i] -= heights[i] * GRAVITY;
      vels[i] *= DAMP;
      heights[i] += vels[i] * dtFactor;
    }
    // boundaries absorb
    vels[0] = vels[N - 1] = 0;
    heights[0] *= 0.6;
    heights[N - 1] *= 0.6;

    // mouse movement ripples
    const mx = mouse.x, my = mouse.y;
    const mvx = mx - mouse.px, mvy = my - mouse.py;
    if (mouse.inside && (mvx !== 0 || mvy !== 0)) {
      const speed = Math.hypot(mvx, mvy);
      pushHeightAt(mx, speed * MOUSE_PUSH * 0.06);
    }

    // left drag continuous splash
    if (mouse.inside && (mouse.buttons & 1)) {
      spawnTick++;
      if (spawnTick % 3 === 0) splash(mx, my, 4 + Math.random() * 6, 3 + Math.random() * 3);
    }

    // right drag rain
    if (mouse.inside && (mouse.buttons & 2)) {
      rainOnce(2 + Math.random() * 4 | 0);
    }

    // drops
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i];
      d.y += d.v * dt;
      d.v += DROP_GRAVITY * dt;
      if (d.y > h * 0.62 + 6) {
        const ix = ((d.x / w) * (N - 1)) | 0;
        if (ix >= 0 && ix < N) heights[ix] -= d.r * 2.2;
        spawnSplashParticles(d.x, Math.min(d.y, h * 0.62), 5, d.r);
        drops[i] = drops[drops.length - 1];
        drops.length--;
      } else if (d.y > h + 40) {
        drops[i] = drops[drops.length - 1];
        drops.length--;
      }
    }

    // ducks
    const base = h * 0.62;
    for (let i = 0; i < ducks.length; i++) {
      const d = ducks[i];
      const ix = Math.max(0, Math.min(N - 1, ((d.x / w) * (N - 1)) | 0));
      const hh = heights[ix];
      const buoyancy = -hh * 0.55;

      const vx = (d.x - d.px) * 0.88;
      const vy = (d.y - d.py) * 0.88;
      d.px = d.x; d.py = d.y;
      d.x += vx;
      d.y += vy + 80 * dt + buoyancy;

      const ddx = d.x - mx, ddy = d.y - my;
      const dd = Math.hypot(ddx, ddy) || 1;
      if (mouse.inside && (mouse.buttons & 1) && dd < 140 && dd > 0) {
        d.x += (ddx / dd) * 2.5;
        d.y += (ddy / dd) * 2.5;
      }

      if (d.x < -30) d.x = w + 30;
      if (d.x > w + 30) d.x = -30;
      if (d.y < base - 20) d.y = base - 20;
      if (d.y > h + 40) d.y = h - 20;

      d.phase += dt * 3.2;
    }

    // particles
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      if (p.life <= 0) continue;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 260 * dt;
      p.life -= dt;
    }
  }

  // Draw ------------------------------------------------------------------
  function drawPond(time) {
    const base = h * 0.62;

    // background gradient
    const bg = ctx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, '#0e1525');
    bg.addColorStop(1, '#070b14');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);

    // ambient glow spots
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 5; i++) {
      const px2 = (Math.sin(time * 0.25 + i * 1.7) * 0.5 + 0.5) * w;
      const py2 = base - 20 + (Math.cos(time * 0.35 + i * 2.1) * 0.5 + 0.5) * (h - base - 40);
      const g = ctx.createRadialGradient(px2, py2, 0, px2, py2, 110);
      g.addColorStop(0, 'rgba(40,150,220,0.16)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(px2 - 110, py2 - 110, 220, 220);
    }

    // moon
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(255,255,240,0.92)';
    ctx.beginPath(); ctx.arc(w - 78, 68, 26, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0c0c1e';
    ctx.beginPath(); ctx.arc(w - 62, 58, 24, 0, Math.PI * 2); ctx.fill();

    // water body
    ctx.beginPath();
    ctx.moveTo(0, h);
    ctx.lineTo(0, base + heights[0]);
    for (let i = 1; i < N; i++) {
      ctx.lineTo((i / (N - 1)) * w, base + heights[i]);
    }
    ctx.lineTo(w, h);
    ctx.closePath();
    const wg = ctx.createLinearGradient(0, base - 30, 0, h);
    wg.addColorStop(0, 'rgba(50,120,170,0.38)');
    wg.addColorStop(1, 'rgba(8,16,32,0.92)');
    ctx.fillStyle = wg; ctx.fill();
    ctx.strokeStyle = 'rgba(180,220,255,0.28)'; ctx.lineWidth = 1.4; ctx.stroke();

    // surface shimmer lines
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 1; i < N; i += 4) {
      const dy = heights[i] - heights[i - 1];
      if (Math.abs(dy) < 0.15) continue;
      const brightness = Math.min(0.45, Math.abs(dy) * 0.35);
      ctx.strokeStyle = 'rgba(200,240,255,' + brightness.toFixed(2) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(((i - 1) / (N - 1)) * w, base + heights[i - 1]);
      ctx.lineTo((i / (N - 1)) * w, base + heights[i]);
      ctx.stroke();
    }

    // grid
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 1;
    for (let i = 0; i < N; i += 12) {
      ctx.beginPath(); ctx.moveTo((i / (N - 1)) * w, base - 20); ctx.lineTo((i / (N - 1)) * w, h); ctx.stroke();
    }
    for (let y = base; y < h; y += 24) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }

    // cursor light
    if (mouse.inside) {
      ctx.globalCompositeOperation = 'lighter';
      const rg = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 70);
      rg.addColorStop(0, 'rgba(255,255,255,0.04)');
      rg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(mouse.x - 70, mouse.y - 70, 140, 140);
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  function drawDuck(dx, dy, r, phase, time) {
    ctx.save();
    ctx.translate(dx, dy);
    // squash/stretch from vertical motion
    const vy = dy - duckPY[Math.min(ducks.length - 1, Math.floor(dx / w * DUCK_COUNT))] || 0;
    const sy = Math.max(0.75, Math.min(1.35, 1 + vy * 0.002));
    const sx = 1 / sy;
    ctx.scale(sx, sy);

    // body
    const rg = ctx.createRadialGradient(-r * 0.2, -r * 0.2, r * 0.1, 0, 0, r);
    rg.addColorStop(0, '#fff1b3');
    rg.addColorStop(0.55, '#e6c42a');
    rg.addColorStop(1, '#8a6e0a');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();

    // wake highlight
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.beginPath(); ctx.arc(-r * 0.25, -r * 0.25, r * 0.55, 0, Math.PI * 2); ctx.fill();

    // eyes
    const blink = Math.sin(time * 4 + phase) > 0.96 ? 0.1 : 1;
    ctx.fillStyle = '#18181b';
    ctx.beginPath(); ctx.arc(-r * 0.34, -r * 0.12, r * 0.14 * blink, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.34, -r * 0.12, r * 0.14 * blink, 0, Math.PI * 2); ctx.fill();
    // spec
    ctx.fillStyle = '#fff';
    if (blink > 0.8) {
      ctx.beginPath(); ctx.arc(-r * 0.28, -r * 0.18, r * 0.05, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.40, -r * 0.18, r * 0.05, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function draw(time) {
    // background
    if (!reducedMotion) {
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(8,13,26,0.22)';
      ctx.fillRect(0, 0, w, h);
    } else {
      ctx.clearRect(0, 0, w, h);
    }

    drawPond(time);

    // drops
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < drops.length; i++) {
      const d = drops[i];
      const a = Math.min(0.55, d.y / (h * 0.55));
      ctx.fillStyle = 'rgba(180,220,255,' + a.toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
    }

    // particles
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      if (p.life <= 0) continue;
      const a = Math.max(0, p.life / p.max);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ducks
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < ducks.length; i++) {
      const idx = Math.max(0, Math.min(ducks.length - 1, i));
      drawDuck(ducks[idx].x, ducks[idx].y, ducks[idx].r, ducks[idx].phase, time);
    }

    ctx.globalCompositeOperation = 'source-over';
  }

  function frame(now) {
    if (running) {
      acc += Math.min((now - last) / 1000, 0.1);
      last = now;
      while (acc >= DT) { update(DT); acc -= DT; }
      draw(now * 0.001);
      updateUI(now);
    } else {
      last = now;
    }
    requestAnimationFrame(frame);
  }

  // Init ---------------------------------------------------------------
  reset();
  document.getElementById('resetBtn').addEventListener('click', reset);
  window.addEventListener('resize', () => { fitCanvas(); reset(); });
  document.addEventListener('visibilitychange', () => {
    running = !document.hidden;
    if (running) last = performance.now();
  });
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
