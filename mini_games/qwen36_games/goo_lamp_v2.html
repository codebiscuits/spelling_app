<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Goo Lamp v2</title>
<style>
html,body{margin:0;height:100%;background:#0c0c1e;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#ddd}
canvas{display:block;cursor:crosshair}
#controls{position:fixed;top:16px;left:16px;background:rgba(12,12,30,0.85);backdrop-filter:blur(8px);padding:10px 14px;border-radius:10px;pointer-events:none;font-size:13px;line-height:1.5;max-width:260px;z-index:5;border:1px solid rgba(255,255,255,0.08)}
#controls b{color:#fff;font-weight:600}
#reset{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.25);padding:8px 18px;border-radius:999px;cursor:pointer;font:600 13px system-ui;backdrop-filter:blur(8px);z-index:5}
#reset:hover{background:rgba(255,255,255,0.22)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="controls">
<b>Goo Lamp 2.0</b><br>
Move — attract blobs<br>
Left drag — add heat<br>
Right drag — cool down<br>
Scroll — blob count
</div>
<button id="reset">Reset</button>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
canvas.addEventListener('contextmenu',e=>e.preventDefault());
const state={};let w,h;
function fitCanvas(){const dpr=Math.min(window.devicePixelRatio||1,2);w=window.innerWidth;h=window.innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
fitCanvas();window.addEventListener('resize',fitCanvas);
document.getElementById('reset').addEventListener('click',()=>reset());
let mouse={x:0,y:0,left:false,right:false,buttons:0,px:0,py:0};
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouse.px=mouse.x;mouse.py=mouse.y;mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;mouse.buttons=e.buttons;mouse.left=!!(mouse.buttons&1);mouse.right=!!(mouse.buttons&2);});
canvas.addEventListener('mousedown',e=>{if(e.button===0)mouse.left=true;if(e.button===2)mouse.right=true;});
window.addEventListener('mouseup',e=>{if(e.button===0)mouse.left=false;if(e.button===2)mouse.right=false;});
canvas.addEventListener('wheel',e=>{e.preventDefault();state.wheel=-Math.sign(e.deltaY);},{passive:false});
const DT=1/60;let acc=0,last=performance.now();
function frame(now){acc+=Math.min((now-last)/1000,0.1);last=now;while(acc>=DT){update(DT);acc-=DT;}draw(acc/DT);requestAnimationFrame(frame);}
requestAnimationFrame(frame);

canvas.style.background='radial-gradient(ellipse at center,#1a0f24 0%%,#0a0610 100%%)';

function reset(){
  blobs=[];
  for(let i=0;i&lt;8;i++)addBlob(w*0.3+Math.random()*w*0.4,h*0.3+Math.random()*h*0.4);
}
let blobCount=8;
window.addEventListener('wheel',e=>{if(e.target===canvas){e.preventDefault();blobCount=Math.max(3,Math.min(20,blobCount-Math.sign(e.deltaY)));if(blobs.length!==blobCount){if(blobs.length&lt;blobCount)addBlob(w*0.3+Math.random()*w*0.4,h*0.3+Math.random()*h*0.4);else blobs.length=blobCount;}}},{passive:false});

function addBlob(x,y){
  blobs.push({x,y,y:y,vy:0,r:18+Math.random()*18,phase:Math.random()*Math.PI*2,hue:Math.random()&lt;0.5?0.52:0.08});
}

function update(dt){
  for(const b of blobs){
    // buoyancy rises with heat from left = y+target
    const temp=0.5+0.5*Math.sin(b.phase);
    b.phase+=0.3*dt;
    if(mouse.left){b.phase+=1.5*dt;}
    if(mouse.right){b.phase-=1.5*dt;}
    const rise=-80*(temp-0.5);
    const vx=(b.x-(b.px||b.x))*0.9;
    const vy=(b.y-(b.py||b.y))*0.9;
    b.px=b.x;b.py=b.y;
    b.x+=vx+b.x-mouse.x?((mouse.x-b.x)*0.02):0;
    b.y+=vy+rise*dt+40*dt;
    // ceiling/floor
    if(b.y&lt;h*0.15){b.y=h*0.15;b.vy=1;}
    if(b.y>h*0.85){b.y=h*0.85;b.vy=-1;}
    // wobble
    b.r=18+Math.sin(b.phase*2)*4;
  }
}

function drawBlob(b){
  const col=oklchFromHue(b.hue,0.6);
  // metaball via blur+contrast hack on offscreen? cheap cores: draw soft circles
  const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*2.5);
  g.addColorStop(0,col);g.addColorStop(0.4,chAlpha(col,0.4));g.addColorStop(1,chAlpha(col,0));
  ctx.fillStyle=g;
  ctx.fillRect(b.x-b.r*3,b.y-b.r*3,b.r*6,b.r*6);
}

function oklchFromHue(hue,lightness){
  // fake with hsl converted loosely
  return `hsl(${Math.floor(hue*360)},80%,${Math.floor(lightness*60+10)}%)`;
}
function chAlpha(c,a){return c.replace(')',`,${a})`).replace('rgb','rgba').replace('hsl','hsla');}

function draw(alpha){
  const time=performance.now()*0.001;
  ctx.filter='blur(18px) contrast(24)';
  ctx.globalCompositeOperation='screen';
  for(const b of blobs)drawBlob(b);
  ctx.filter='none';
  ctx.globalCompositeOperation='source-over';
  for(const b of blobs){
    ctx.fillStyle='rgba(255,255,255,0.25)';
    ctx.beginPath();ctx.arc(b.x-b.r*0.25,b.y-b.r*0.3,b.r*0.18,0,Math.PI*2);ctx.fill();
  }
  // tops
  ctx.fillStyle='rgba(180,120,60,0.12)';
  for(const b of blobs){
    ctx.beginPath();ctx.arc(b.x,b.y-b.r*1.4,b.r*0.7,0,Math.PI*2);ctx.fill();
  }
}
reset();

</script>
</body>
</html>
