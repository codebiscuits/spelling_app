<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pond</title>
  <!--
    Implements HANDBOOK_SMALL.md:
      §2   fixed timestep, DPR-aware canvas
      §3   1D heightfield water (tension + damping) + verlet buoyant ducks
      §4   cosine/curated palette, additive glow particles, never pure black
      §5   ripple interference, squash & stretch on ducks, splash particles,
           ambient life (blinking ducks, dragonflies, sun-glitter shimmer),
           pentatonic sound, trauma² screenshake, hit-stop, ZzFX, ambient life
      §7   no fail state, sound muted by default
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0c1620; }
    canvas { display: block; touch-action: none; cursor: none; }
    #ui {
      position: fixed; top: 16px; left: 16px; color: #cfe6e0; font-size: 13px;
      pointer-events: none; z-index: 10; background: rgba(8,20,26,0.72);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
      padding: 14px 18px; backdrop-filter: blur(10px); line-height: 1.7;
      min-width: 230px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #ui h3 { color: #fff; margin-bottom: 6px; font-size: 14px; letter-spacing: 0.5px; }
    #ui .param { display: flex; justify-content: space-between; gap: 12px; }
    #ui .key { color: #85a8a0; }
    #ui .val { color: #7fe0d8; font-weight: 600; font-variant-numeric: tabular-nums; }
    #resetBtn, #muteBtn {
      position: fixed; z-index: 10; padding: 10px 28px; font-size: 14px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #cfe6e0; background: rgba(8,20,26,0.80); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px; cursor: pointer; backdrop-filter: blur(10px);
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    #resetBtn { bottom: 24px; left: 50%; transform: translateX(-50%); }
    #muteBtn { top: 16px; right: 16px; padding: 10px 14px; font-size: 18px; line-height: 1; }
    #resetBtn:hover, #muteBtn:hover { background: rgba(30,60,60,0.90); color: #fff; border-color: rgba(255,255,255,0.30); }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h3>🦆 Pond</h3>
  <div class="param"><span class="key">Move</span><span class="val">Drag a ripple</span></div>
  <div class="param"><span class="key">Left hold</span><span class="val">Pour rain</span></div>
  <div class="param"><span class="key">Right click</span><span class="val">Drop a duck</span></div>
  <div class="param"><span class="key">Scroll</span><span class="val">Storm: <span id="stormVal">0.5</span></span></div>
  <br>
  <div class="param"><span class="key">Ducks:</span><span class="val" id="duckCount">0/6</span></div>
  <div class="param"><span class="key">Ducklings saved:</span><span class="val" id="savedVal">0</span></div>
</div>
<button id="muteBtn" title="Sound on/off" aria-label="Toggle sound">🔇</button>
<button id="resetBtn">&#x21BA; Reset pond</button>
<script>
'use strict';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w = 0, h = 0, baseY = 0;

// ---- §2 DPR-aware canvas ----
function fitCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  w = window.innerWidth; h = window.innerHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  baseY = h * 0.56;
}

const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- §4 cosine palette (Iñigo Quilez) — never a raw HSL rainbow ----
function cosPalette(t, d) {
  const c = [];
  for (let i = 0; i < 3; i++) c.push(0.5 + 0.42 * Math.cos(6.28318 * (0.85 * t + d[i])));
  return c;
}
function rgb(c, mul, add) {
  return `rgb(${c.map(v => Math.round(Math.min(1, Math.max(0, v * mul + add)) * 255)).join(',')})`;
}
const DUCK_D = [0.05, 0.15, 0.55]; // stays warm yellow/orange, never rainbows

// ==================== WATER HEIGHTFIELD (§3) ====================
const SPACING = 6;
let N = 0, u = null, v = null; // height offset & velocity per column
const TENSION = 0.28, DAMPING = 0.96, SPREAD = 0.028, LEVELING = 0.02;

function initWater() {
  N = Math.max(24, Math.floor(w / SPACING) + 2);
  u = new Float32Array(N);
  v = new Float32Array(N);
}

function colX(i) { return i * (w / (N - 1)); }
function colOf(x) { return Math.max(0, Math.min(N - 1, x / (w / (N - 1)))); }

function waterY(x) {
  const f = colOf(x), i = f | 0, t = f - i;
  const a = u[i], b = u[Math.min(N - 1, i + 1)];
  return baseY + a + (b - a) * t;
}
function slopeAt(x) {
  const d = 6;
  return (waterY(x + d) - waterY(x - d)) / (2 * d);
}
function poke(x, strength, radius) {
  radius = radius || 3;
  const ci = Math.round(colOf(x));
  for (let o = -radius; o <= radius; o++) {
    const idx = ci + o;
    if (idx < 0 || idx >= N) continue;
    const wgt = 1 - Math.abs(o) / (radius + 1);
    v[idx] += strength * wgt;
  }
}

function stepWater() {
  for (let i = 1; i < N - 1; i++) {
    v[i] += ((u[i - 1] + u[i + 1]) * 0.5 - u[i]) * TENSION;
  }
  v[0] += (u[1] - u[0]) * TENSION;
  v[N - 1] += (u[N - 2] - u[N - 1]) * TENSION;
  for (let i = 0; i < N; i++) { v[i] -= u[i] * LEVELING; v[i] *= DAMPING; u[i] += v[i]; }
  for (let i = 1; i < N - 1; i++) {
    const l = (u[i - 1] - u[i]) * SPREAD, r = (u[i + 1] - u[i]) * SPREAD;
    v[i - 1] -= l; v[i] += l;
    v[i + 1] -= r; v[i] += r;
  }
}

// ==================== §5 SCREEN SHAKE (trauma², Squirrel Eiserloh) ====================
// Smooth noise using layered sine waves — no lookup table needed
let shakeX = 0, shakeY = 0, shakeAngle = 0;
let trauma = 0;
const SHAKE_FREQ1 = 18, SHAKE_FREQ2 = 27, SHAKE_FREQ3 = 37; // three independent oscillators

function addTrauma(amount) {
  trauma = Math.min(1, trauma + amount);
}

function stepShake(dt) {
  if (reducedMotion) { trauma = 0; return; }
  // smooth noise offset from trauma² (non-linear: big hits feel big, small ones subtle)
  const t2 = trauma * trauma;
  const t3 = t2 * trauma;
  const phase = performance.now() * 0.003;
  shakeX = (Math.sin(phase * SHAKE_FREQ1 + 1.3) * 0.5 +
            Math.sin(phase * SHAKE_FREQ2 + 2.7) * 0.3 +
            Math.sin(phase * SHAKE_FREQ3 + 0.5) * 0.2) * t2 * 8;
  shakeY = (Math.cos(phase * SHAKE_FREQ1 + 0.7) * 0.5 +
            Math.cos(phase * SHAKE_FREQ2 + 3.1) * 0.3 +
            Math.cos(phase * SHAKE_FREQ3 + 1.1) * 0.2) * t2 * 6;
  shakeAngle = (Math.sin(phase * SHAKE_FREQ1 * 0.7 + 2.1) * 0.4 +
                Math.sin(phase * SHAKE_FREQ2 * 0.5 + 0.8)) * t3 * 0.025;
  // exponential decay of trauma
  trauma *= Math.exp(-12 * dt);
  if (trauma < 0.001) trauma = 0;
}

// ==================== §5 HIT-STOP (freeze sim on big impacts) ====================
let hitStop = 0;
const HIT_STOP_DUR = 0.05; // 50ms freeze

function triggerHitStop() {
  hitStop = Math.max(hitStop, HIT_STOP_DUR);
}

// ==================== ZzFX — Zuper Zmall Zound Zynth (§5) ====================
// Public domain, ~1KB. Pasted inline per handbook recommendation.
const zzfx = (() => {
  let n; // AudioContext shared state
  const k = (a, b, c, d) => {
    if (!n) n = new (window.AudioContext || window.webkitAudioContext)();
    const o = n.createOscillator(), g = n.createGain();
    const t = n.currentTime + d || 0;
    o.connect(g).connect(n.destination);
    o.start(t); o.stop(t + a + b + 0.01);
    o.frequency.setValueAtTime(b > 0 ? c * Math.pow(2, a * 0.083333) : c, t);
    o.frequency.setValueAtTime(c * Math.pow(2, (a + b) * 0.083333), t + a);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(d || 0.15, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + b);
  };
  return (a, b, c, d, e, f, g) => {
    // a = pitch, b = vibrato, c = noise, d = attack, e = sustain, f = release, g = volume
    if (muted || !n && !g) return;
    if (!n) n = new (window.AudioContext || window.webkitAudioContext)();
    if (n.state === 'suspended') n.resume();
    const t = n.currentTime;
    const dur = d + e + f;
    const o = n.createOscillator();
    const g2 = n.createGain();
    const nc = c > 0 ? n.createBuffer(1, n.sampleRate * (dur + 0.1), n.sampleRate) : null;
    if (nc) {
      const data = nc.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    o.type = ['sine','square','sawtooth','triangle'][g || 0];
    const freq = c * Math.pow(2, a * 0.083333) * (1 + (b ? Math.sin(b * t * 10) * 0.01 : 0));
    o.frequency.setValueAtTime(freq, t);
    o.frequency.linearRampToValueAtTime(freq * Math.pow(2, e * 0.083333), t + d);
    if (nc) {
      const ng = n.createGain();
      ng.gain.setValueAtTime(c * g * 0.05, t);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.disconnect(); o.connect(ng).connect(n.destination);
      o.connect(g2).connect(n.destination);
      o.start(t); o.stop(t + dur + 0.01);
      const src = n.createBufferSource();
      src.buffer = nc; src.connect(ng); src.start(t);
    } else {
      o.connect(g2).connect(n.destination);
      o.start(t); o.stop(t + dur + 0.01);
    }
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.linearRampToValueAtTime((d || 0.15) * (g || 0.15), t + 0.003);
    g2.gain.setValueAtTime((d || 0.15) * (g || 0.15), t + d);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + d + e + f);
  };
})();

// ZzFX sound presets for Pond events
const SFX = {
  duckPop:    [0, 0, 200, 0.03, 0.05, 0.18, 0.12, 0],   // duck drop pop
  splash:     [0, 0, 120, 0.02, 0.04, 0.22, 0.06, 0],   // duck splash
  bigSplash:  [0, 0, 80,  0.02, 0.08, 0.30, 0.10, 0],   // big impact splash
  peep:       [0, 0, 900, 0.01, 0.02, 0.06, 0.04, 0],    // duckling peep
  rescue:     [3, 0, 600, 0.02, 0.06, 0.12, 0.10, 0],    // rescue chime
  rainDrop:   [0, 0, 400, 0.01, 0.02, 0.08, 0.02, 0],    // rain drop
  muteOn:     [4, 0, 523, 0.02, 0.04, 0.08, 0.08, 0],    // sound on tone
  storm:      [0, 0, 200, 0.03, 0.06, 0.15, 0.04, 0],    // storm intensity change
};

let zfxMuted = true;
function ensureAudio() {
  if (zfxMuted) return;
  if (!zzfx._n) zzfx._n = new (window.AudioContext || window.webkitAudioContext)();
  if (zzfx._n.state === 'suspended') zzfx._n.resume();
}
function zfx(name) {
  if (zfxMuted) return;
  const s = SFX[name];
  if (!s) return;
  zzfx(...s);
}

// ==================== GLOW SPRITE + PARTICLE POOL (§4/§6) ====================
const glow = document.createElement('canvas');
glow.width = glow.height = 64;
{
  const g = glow.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.35, 'rgba(255,255,255,0.35)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
}
const POOL = 240;
const parts = [];
for (let i = 0; i < POOL; i++) parts.push({ x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 6, color: '#fff' });
let partHead = 0;
function spawnPart(x, y, vx, vy, size, color, life) {
  const p = parts[partHead]; partHead = (partHead + 1) % POOL;
  p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.size = size; p.color = color; p.life = p.max = life;
}

// expanding splash rings — §6.2 pool-based, zero allocation
const RING_POOL = 64;
const rings = [];
for (let i = 0; i < RING_POOL; i++) rings.push({ x: 0, y: 0, r: 0, maxR: 0, alpha: 0, color: '' });
let ringHead = 0;
function spawnRing(x, y, r0, maxR, color) {
  const r = rings[ringHead]; ringHead = (ringHead + 1) % RING_POOL;
  r.x = x; r.y = y; r.r = r0; r.maxR = maxR; r.alpha = 0.55; r.color = color;
}

// ==================== RAINDROPS ====================
const RAIN_POOL = 160;
const drops = [];
for (let i = 0; i < RAIN_POOL; i++) drops.push({ active: false, x: 0, y: 0, vy: 0, size: 4 });
let dropHead = 0;
function spawnDrop(x, size) {
  const d = drops[dropHead]; dropHead = (dropHead + 1) % RAIN_POOL;
  d.active = true; d.x = x; d.y = -10; d.vy = 60 + Math.random() * 40; d.size = size;
}

// ==================== DUCKS (verlet buoyancy, §3) ====================
const MAX_DUCKS = 6;
const GRAVITY = 0.5, BUOY_K = 0.06, VDAMP = 0.95;
// §6.2 precomputed palette strings — never allocate in hot loop
const duckPalette = [
  { light: '#ffd36b', base: '#e6a832', dark: '#b88528' },
  { light: '#f0c882', base: '#d4a055', dark: '#a87a3e' },
  { light: '#e8b86e', base: '#c89848', dark: '#9a7235' },
];
const ducks = [];
function makeDuck(x) {
  const col = duckPalette[ducks.length % duckPalette.length];
  ducks.push({
    x, y: baseY - 45, py: baseY - 45, vx: (Math.random() - 0.5) * 6,
    angle: 0, drift: Math.random() < 0.5 ? -1 : 1,
    blinkT: 1 + Math.random() * 4, wasSubmerged: false, r: 15 + Math.random() * 3,
    color: col, bob: 0,
  });
}
function resetDucks() {
  ducks.length = 0;
  makeDuck(w * 0.4);
  makeDuck(w * 0.6);
}

// ==================== DUCKLINGS (rescue mechanic) ====================
const DUCKLING_COLOR = { light: '#fff3bd', base: '#ffd35e', dark: '#c9932a' };
const MAX_ADRIFT = 3, MAX_DUCKLINGS = 12;
const ducklings = [];
let savedCount = 0, ducklingTimer = 4;

function spawnDuckling() {
  const fromLeft = Math.random() < 0.5;
  const x = fromLeft ? 14 : w - 14;
  const y = waterY(x) - 6;
  ducklings.push({
    x, y, py: y, vx: (fromLeft ? 1 : -1) * (4 + Math.random() * 3),
    r: 7.5, color: DUCKLING_COLOR, angle: 0, bob: 0, blinkT: 1 + Math.random() * 3,
    peepT: 0.8 + Math.random() * 1.5, rescued: false, parent: null, offsetX: 0,
  });
}

function rescueDuckling(d, adult) {
  d.rescued = true;
  d.parent = adult;
  adult.chicks = (adult.chicks || 0) + 1;
  const tier = Math.ceil(adult.chicks / 2);
  d.offsetX = (adult.chicks % 2 ? -1 : 1) * (adult.r + 8 + tier * 15);
  savedCount++;
  spawnRing(d.x, waterY(d.x), 4, 30, 'rgba(255,255,255,');
  for (let i = 0; i < 8; i++) {
    spawnPart(d.x, d.y - 10, (Math.random() - 0.5) * 50, -30 - Math.random() * 50,
              2 + Math.random() * 2, '#ffb3c6', 0.5 + Math.random() * 0.3);
  }
  addTrauma(0.08);
  triggerHitStop();
  zfx('rescue');
}

// ==================== DRAGONFLIES (ambient life, §5) ====================
const dragonflies = [];
for (let i = 0; i < 3; i++) {
  const c = cosPalette(0.2 + i * 0.3, [0.5, 0.2, 0.0]);
  dragonflies.push({
    phase: Math.random() * 10, speed: 0.15 + Math.random() * 0.1,
    ampX: 0.2 + Math.random() * 0.15, ampY: 40 + Math.random() * 30,
    baseYFrac: 0.18 + Math.random() * 0.18, wingT: Math.random() * 10,
    color: rgb(c, 1, 0.15), dipCd: 2 + Math.random() * 3,
  });
}

// ==================== §4.5 Simplex noise for organic textures ====================
const NOISE_SCALE = 0.003;
function noise2D(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = (Math.sin(ix * 127.1 + iy * 311.7) * 43758.5453) % 1;
  const b = (Math.sin((ix + 1) * 127.1 + iy * 311.7) * 43758.5453) % 1;
  const c = (Math.sin(ix * 127.1 + (iy + 1) * 311.7) * 43758.5453) % 1;
  const d = (Math.sin((ix + 1) * 127.1 + (iy + 1) * 311.7) * 43758.5453) % 1;
  return (a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v);
}
function fbm(x, y, octaves) {
  let val = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < octaves; i++) { val += amp * noise2D(x * freq, y * freq); amp *= 0.5; freq *= 2; }
  return val;
}

// ==================== §5 Fireflies (ambient life) ====================
const FIREFLIES = [];
for (let i = 0; i < 12; i++) {
  FIREFLIES.push({
    x: Math.random() * 2000, y: Math.random() * 800,
    phase: Math.random() * Math.PI * 2, blinkPhase: Math.random() * Math.PI * 2,
    speed: 0.3 + Math.random() * 0.4, amp: 20 + Math.random() * 30,
    size: 2 + Math.random() * 2,
  });
}

// ==================== §5 Pollen particles (ambient life) ====================
const POLLEN_POOL = 30;
const pollen = [];
for (let i = 0; i < POLLEN_POOL; i++) {
  pollen.push({
    x: Math.random() * 2000, y: Math.random() * 1200,
    vx: (Math.random() - 0.5) * 8, vy: -2 - Math.random() * 4,
    size: 1 + Math.random() * 1.5, alpha: 0.2 + Math.random() * 0.3,
    phase: Math.random() * Math.PI * 2,
  });
}

// ==================== §5 Duck eye tracking ====================
let eyeTrackX = w / 2, eyeTrackY = h / 2;

// §4.4 Offscreen bloom canvas — allocated once, reused every frame (§6.2)
const bloomCanvas = document.createElement('canvas');
const bloomCtx = bloomCanvas.getContext('2d');
let bloomW = 0, bloomH = 0;

// §6.2 precomputed gradients — created once in initBloom, reused every frame
let skyGrad, bgGrad, pondGrad1, reflGrad;
// §6.2 bloom darkness gradients — created once per resize
let bloomSunGrad, bloomPondGrad;

// §6.2 duck color gradients — precomputed once per duck color, reused every frame
const duckGradCache = {};

let drawScratchParts = [];

function initBloom() {
  bloomCanvas.width = w;
  bloomCanvas.height = h;
  bloomW = w;
  bloomH = h;
  // §6.2 create gradients once per resize
  skyGrad = ctx.createLinearGradient(0, 0, 0, baseY + 20);
  skyGrad.addColorStop(0, '#1c3a52');
  skyGrad.addColorStop(0.55, '#3f7390');
  skyGrad.addColorStop(1, '#a9d7d6');

  bgGrad = ctx.createLinearGradient(0, 0, 0, h);
  bgGrad.addColorStop(0, '#1c3a52');
  bgGrad.addColorStop(0.55, '#3f7390');
  bgGrad.addColorStop(1, '#0c1620');

  pondGrad1 = ctx.createLinearGradient(0, baseY - 10, 0, h);
  pondGrad1.addColorStop(0, '#2f97a8');
  pondGrad1.addColorStop(0.35, '#146b82');
  pondGrad1.addColorStop(1, '#04303e');

  reflGrad = ctx.createLinearGradient(0, baseY - 10, 0, baseY + 90);
  reflGrad.addColorStop(0, 'rgba(169,215,214,0.35)');
  reflGrad.addColorStop(1, 'rgba(169,215,214,0)');

  // §6.2 bloom darkness gradients — reuse every frame
  bloomSunGrad = ctx.createRadialGradient(w * 0.76, h * 0.16, 0, w * 0.76, h * 0.16, 120);
  bloomSunGrad.addColorStop(0, 'rgba(0,0,0,1)');
  bloomSunGrad.addColorStop(1, 'rgba(0,0,0,0)');

  bloomPondGrad = ctx.createRadialGradient(w * 0.5, baseY, 0, w * 0.5, baseY, 200);
  bloomPondGrad.addColorStop(0, 'rgba(0,0,0,0.4)');
  bloomPondGrad.addColorStop(1, 'rgba(0,0,0,0)');
}

// ==================== STATE ====================
let stormIntensity = 0.5;
let pouring = false;
let spawnAcc = 0;
let mouseX = w / 2, mouseY = h / 2, hasMouse = false;
let prevMouseX = mouseX, prevMouseY = mouseY;

function resetAll() {
  initWater();
  initBloom();
  resetDucks();
  ducklings.length = 0;
  savedCount = 0;
  ducklingTimer = 4;
  drops.forEach(d => d.active = false);
  parts.forEach(p => p.life = 0);
  rings.length = 0;
  pollen.forEach(p => { p.x = Math.random() * w; p.y = Math.random() * h; });
  stormIntensity = 0.5;
  pouring = false;
  spawnAcc = 0;
  trauma = 0;
  hitStop = 0;
  shakeX = shakeY = shakeAngle = 0;
}

// ==================== INPUT (house vocabulary) ====================
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('mousemove', e => {
  mouseX = e.clientX; mouseY = e.clientY; hasMouse = true;
  eyeTrackX = e.clientX; eyeTrackY = e.clientY;
});
canvas.addEventListener('mouseleave', () => { hasMouse = false; });

canvas.addEventListener('mousedown', e => {
  ensureAudio();
  if (e.button === 0) {
    pouring = true;
  } else if (e.button === 2) {
    if (ducks.length < MAX_DUCKS) {
      makeDuck(Math.max(20, Math.min(w - 20, e.clientX)));
      addTrauma(0.04);
      zfx('duckPop');
    }
  }
});
window.addEventListener('mouseup', e => { if (e.button === 0) pouring = false; });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  stormIntensity = Math.max(0.15, Math.min(1, stormIntensity - Math.sign(e.deltaY) * 0.05));
  zfx('storm');
}, { passive: false });

document.getElementById('resetBtn').addEventListener('click', resetAll);
const muteBtn = document.getElementById('muteBtn');
muteBtn.addEventListener('click', () => {
  zfxMuted = !zfxMuted;
  muteBtn.textContent = zfxMuted ? '🔇' : '🔊';
  ensureAudio();
  if (!zfxMuted) zfx('muteOn');

window.addEventListener('resize', () => { fitCanvas(); initWater(); initBloom(); });

// ==================== PHYSICS STEP (fixed 60Hz, §2) ====================
const DT = 1 / 60;

function step() {
  // --- finger-drag ripples ---
  if (hasMouse) {
    const dx = mouseX - prevMouseX, dy = mouseY - prevMouseY;
    const speed = Math.hypot(dx, dy);
    const surf = waterY(mouseX);
    if (mouseY > surf - 6 && speed > 1) {
      poke(mouseX, Math.max(-2.5, Math.min(2.5, (dy * 0.12 + speed * 0.08))), 3);
    }
  }
  prevMouseX = mouseX; prevMouseY = mouseY;

  // --- pouring rain ---
  if (pouring) {
    spawnAcc += stormIntensity * 26 * DT;
    while (spawnAcc >= 1) {
      spawnAcc -= 1;
      spawnDrop(mouseX + (Math.random() - 0.5) * 40, 3 + stormIntensity * 4 + Math.random() * 2);
    }
  }

  // --- raindrops fall & splash ---
  for (const d of drops) {
    if (!d.active) continue;
    d.vy += 140 * DT;
    d.y += d.vy * DT;
    const surf = waterY(d.x);
    if (d.y >= surf) {
      const impact = Math.min(10, d.vy * 0.05 * (d.size / 4));
      poke(d.x, -impact, 2);
      if (d.size > 5) {
        addTrauma(0.02);
        zfx('bigSplash');
      } else {
        zfx('rainDrop');
      }
      const n = 3 + (d.size | 0);
      for (let i = 0; i < n; i++) {
        const a = Math.PI + Math.random() * Math.PI;
        spawnPart(d.x, surf, Math.cos(a) * (20 + Math.random() * 40), Math.sin(a) * (30 + Math.random() * 40) - 10,
                   1.5 + Math.random() * 2, 'rgba(220,245,255,0.9)', 0.35 + Math.random() * 0.2);
      }
      spawnRing(d.x, surf, 2, 10 + d.size * 2, 'rgba(210,240,250,');
      d.active = false;
    }
    if (d.y > h + 20) d.active = false;
  }

  // --- dragonflies: lazy wandering, occasional low dip pokes the water ---
  for (const f of dragonflies) {
    f.phase += f.speed * DT;
    f.wingT += DT;
    f.dipCd -= DT;
    const cy = h * f.baseYFrac + Math.sin(f.phase * 1.3) * f.ampY;
    if (f.dipCd < 0 && cy > baseY - 60) {
      f.dipCd = 3 + Math.random() * 4;
      const fx = w * (0.5 + Math.sin(f.phase) * f.ampX);
      poke(fx, -3, 2);
    }
  }

  // --- ducks: verlet vertical motion + buoyancy, slope-driven tilt ---
  for (const d of ducks) {
    const vy = (d.y - d.py) * VDAMP;
    d.py = d.y;
    const surf = waterY(d.x);
    const submerged = Math.min(40, (d.y + d.r * 0.6) - surf);
    const buoy = submerged > 0 ? submerged * BUOY_K : 0;
    d.y += vy + GRAVITY - buoy;

    // splash when crossing into the water with enough downward speed
    if (submerged > 0 && !d.wasSubmerged && vy > 3) {
      const strength = Math.min(1, (vy - 3) / 10);
      poke(d.x, -4 - strength * 14, 5);
      for (let i = 0; i < 6 + (strength * 10 | 0); i++) {
        const a = Math.PI + Math.random() * Math.PI;
        spawnPart(d.x, surf, Math.cos(a) * (30 + Math.random() * 50), Math.sin(a) * (30 + Math.random() * 60) - 20,
                   2 + Math.random() * 3, d.color.light, 0.3 + Math.random() * 0.3);
      }
      spawnRing(d.x, surf, 4, 22 + strength * 30, 'rgba(255,255,255,');
      addTrauma(strength * 0.08);
      if (strength > 0.4) triggerHitStop();
      zfx(strength > 0.5 ? 'bigSplash' : 'splash');
    }
    d.wasSubmerged = submerged > 0;
    d.bob = vy;

    // gentle horizontal wander
    d.vx += (Math.random() - 0.5) * 8 * DT + slopeAt(d.x) * -18 * DT;
    d.vx *= 0.985;
    d.vx = Math.max(-14, Math.min(14, d.vx));
    d.x += d.vx;
    if (d.x < 24) { d.x = 24; d.vx = Math.abs(d.vx); }
    if (d.x > w - 24) { d.x = w - 24; d.vx = -Math.abs(d.vx); }

    // tilt smoothly toward the local wave slope
    const target = Math.atan(slopeAt(d.x));
    d.angle += (target - d.angle) * 0.12;

    d.blinkT -= DT;
    if (d.blinkT < -0.12) d.blinkT = 1.5 + Math.random() * 4;
  }

  // --- ducklings ---
  ducklingTimer -= DT;
  let adrift = 0;
  for (const d of ducklings) if (!d.rescued) adrift++;
  if (ducklingTimer <= 0 && adrift < MAX_ADRIFT && ducklings.length < MAX_DUCKLINGS) {
    spawnDuckling();
    ducklingTimer = 9 + Math.random() * 7;
  }
  for (const d of ducklings) {
    const vy = (d.y - d.py) * VDAMP;
    d.py = d.y;
    const surf = waterY(d.x);
    const submerged = Math.min(24, (d.y + d.r * 0.6) - surf);
    const buoy = submerged > 0 ? submerged * BUOY_K * 1.6 : 0;
    d.y += vy + GRAVITY - buoy;
    d.bob = vy;

    if (d.rescued) {
      d.vx += (d.parent.x + d.offsetX - d.x) * 0.0045;
      d.vx *= 0.94;
    } else {
      d.vx += slopeAt(d.x) * -70 * DT + (Math.random() - 0.5) * 3 * DT;
      d.vx *= 0.99;
      for (const a of ducks) {
        if (Math.abs(d.x - a.x) < a.r + d.r + 10 && Math.abs(d.y - a.y) < 42) {
          rescueDuckling(d, a);
          break;
        }
      }
      d.peepT -= DT;
      if (d.peepT < 0) {
        d.peepT = 1.6 + Math.random() * 2.4;
        spawnRing(d.x + d.r, d.y - d.r, 1, 9, 'rgba(255,255,255,');
        zfx('peep');
      }
    }
    d.vx = Math.max(-12, Math.min(12, d.vx));
    d.x += d.vx;
    if (d.x < 12) { d.x = 12; d.vx = Math.abs(d.vx); }
    if (d.x > w - 12) { d.x = w - 12; d.vx = -Math.abs(d.vx); }
    const target = Math.atan(slopeAt(d.x));
    d.angle += (target - d.angle) * 0.12;
    d.blinkT -= DT;
    if (d.blinkT < -0.12) d.blinkT = 1.5 + Math.random() * 4;
  }

  // --- particles ---
  for (let i = 0; i < POOL; i++) {
    const p = parts[i];
    if (p.life <= 0) continue;
    p.life -= DT;
    p.vy += 120 * DT; p.vx *= 0.99; p.vy *= 0.99;
    p.x += p.vx * DT; p.y += p.vy * DT;
  }
  // --- rings — §6.2 pool, iterate all, zero splice ---
  for (let i = 0; i < RING_POOL; i++) {
    const r = rings[i];
    if (r.alpha < 0.01 && r.r >= r.maxR) continue; // dead slot
    r.r += (r.maxR - r.r) * 0.12 + 0.4;
    r.alpha *= 0.90;
    if (r.alpha < 0.01 || r.r >= r.maxR) { r.alpha = 0; r.r = r.maxR; } // kill
  }

  // --- pollen drift ---
  for (const p of pollen) {
    p.phase += DT * 2;
    p.x += p.vx * DT + Math.sin(p.phase) * 3 * DT;
    p.y += p.vy * DT;
    if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
    if (p.x < -10) p.x = w + 10;
    if (p.x > w + 10) p.x = -10;
  }

  stepWater();
}

// ==================== RENDER ====================
let shimmerT = 0;

function drawSky() {
  ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, w, baseY + 20);

  const sunX = w * 0.76, sunY = h * 0.16;
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.9;
  ctx.drawImage(glow, sunX - 90, sunY - 90, 180, 180);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#fff6d8';
  ctx.beginPath(); ctx.arc(sunX, sunY, 22, 0, Math.PI * 2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  return sunX;
}

function drawDragonflies() {
  for (const f of dragonflies) {
    const x = w * (0.5 + Math.sin(f.phase) * f.ampX);
    const y = h * f.baseYFrac + Math.sin(f.phase * 1.3) * f.ampY;
    const wing = Math.sin(f.wingT * (reducedMotion ? 8 : 26)) * 0.5 + 0.5;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.sin(f.phase * 1.3) * 0.3);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.ellipse(-6, -2, 9, 2.6 + wing * 2, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.ellipse(6, -2, 9, 2.6 + wing * 2, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = f.color;
    ctx.beginPath(); ctx.ellipse(0, 0, 3, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -8, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

// ==================== §5 Fireflies (ambient life) ====================
function drawFireflies() {
  if (reducedMotion) return;
  ctx.globalCompositeOperation = 'lighter';
  for (const ff of FIREFLIES) {
    ff.phase += ff.speed * DT;
    const fx = (ff.x % w + w) % w;
    const fy = (ff.y % h + h) % h;
    const glow = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(ff.phase * 2 + ff.blinkPhase));
    ctx.globalAlpha = glow * 0.7;
    ctx.drawImage(glow, fx - 16, fy - 16, 32, 32);
    ctx.globalAlpha = glow;
    ctx.fillStyle = '#ffe88a';
    ctx.beginPath(); ctx.arc(fx, fy, ff.size * glow, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

// ==================== §5 Pollen particles (ambient life) ====================
function drawPollen() {
  ctx.globalCompositeOperation = 'lighter';
  for (const p of pollen) {
    ctx.globalAlpha = p.alpha * (0.5 + 0.5 * Math.sin(shimmerT + p.phase));
    ctx.fillStyle = '#fffbe6';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

// ==================== §4.7 Hand-drawn wobble ====================
let wobbleSeed = 0;
function wobble(t) {
  wobbleSeed = Math.floor(t * 2);
}
function wobbleVal(x, y, t) {
  const seed = (Math.sin(x * 12.9898 + y * 78.233 + t * 0.01) * 43758.5453) % 1;
  return (seed - 0.5) * 1.5;
}

// ==================== §5 §4.7 Reed wobble with ambient micro-motion ====================
function drawReeds() {
  wobble(shimmerT);
  for (let i = 0; i < 9; i++) {
    const bx = (i / 8) * w + Math.sin(i * 13.1) * 30;
    // §5 ambient micro-motion: reeds sway gently with noise
    const sway = Math.sin(shimmerT * 0.8 + i) * 6 + Math.sin(shimmerT * 1.7 + i * 2.3) * 2;
    const bh = 46 + (i % 3) * 14;
    const topX = bx + sway * 1.4;
    const topY = baseY - bh;
    const midX = bx + sway * 0.5 + wobbleVal(bx, baseY - bh * 0.3, shimmerT);
    const midY = baseY - bh * 0.6 + wobbleVal(bx, baseY - bh * 0.6, shimmerT);
    const botW = wobbleVal(bx, baseY, shimmerT);

    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(20,55,45,0.5)';
    ctx.beginPath();
    ctx.moveTo(bx + botW, baseY + 4);
    ctx.quadraticCurveTo(midX, midY, topX + wobbleVal(topX, topY, shimmerT), topY + wobbleVal(topX, topY, shimmerT));
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(bx + botW + 0.8, baseY + 4);
    ctx.quadraticCurveTo(midX + 0.8, midY + 0.8, topX + wobbleVal(topX, topY, shimmerT) + 0.8, topY + wobbleVal(topX, topY, shimmerT));
    ctx.stroke();

    ctx.fillStyle = 'rgba(20,55,45,0.55)';
    ctx.beginPath();
    ctx.ellipse(topX + wobbleVal(topX, topY, shimmerT), topY - 6, 3.5, 8, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawPond(sunX) {
  ctx.beginPath();
  ctx.moveTo(0, baseY + u[0]);
  for (let i = 0; i < N; i++) ctx.lineTo(colX(i), baseY + u[i]);
  ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();

  ctx.save();
  ctx.fillStyle = pondGrad1; ctx.fill();

  ctx.clip();

  ctx.fillStyle = reflGrad; ctx.fillRect(0, baseY - 10, w, 100);

  // §4.5 FBM noise texture on water
  ctx.globalAlpha = 0.06;
  ctx.fillStyle = '#1a5c6e';
  for (let i = 0; i < N; i += 3) {
    const x = colX(i);
    const n = fbm(x * NOISE_SCALE, baseY * NOISE_SCALE + shimmerT * 0.3, 3);
    const yOff = (n - 0.5) * 8;
    ctx.beginPath(); ctx.ellipse(x, baseY + u[i] + yOff, 8, 3, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // sun-glitter
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < N; i += 2) {
    const x = colX(i);
    const slope = i > 0 && i < N - 1 ? (u[i + 1] - u[i - 1]) * 0.5 : 0;
    const crest = Math.max(0, 1 - Math.abs(slope) * 3);
    const distToSun = Math.abs(x - sunX) / (w * 0.5);
    const sunBoost = Math.max(0, 1 - distToSun * 1.6);
    const twinkle = 0.5 + 0.5 * Math.sin(shimmerT * 4 + i * 0.7);
    const bright = crest * (0.15 + sunBoost * 0.85) * twinkle;
    if (bright > 0.08) {
      ctx.globalAlpha = Math.min(0.85, bright);
      ctx.fillStyle = sunBoost > 0.3 ? '#fff6d0' : '#bdeef0';
      const y = baseY + u[i];
      ctx.beginPath(); ctx.ellipse(x, y, 5 + sunBoost * 4, 1.6, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();

  ctx.beginPath();
  ctx.moveTo(0, baseY + u[0]);
  for (let i = 0; i < N; i++) ctx.lineTo(colX(i), baseY + u[i]);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5; ctx.stroke();
}

function drawDucks() {
  for (const d of ducks) drawFloatingDuck(d);
  for (const d of ducklings) drawFloatingDuck(d);
}

function drawFloatingDuck(d) {
  const r = d.r;
  const hx = r * 0.85, hy = -r * 0.55;
  const dx = eyeTrackX - (d.x + hx);
  const dy = eyeTrackY - hy;
  const dist = Math.hypot(dx, dy) || 1;
  const pupilOff = r * 0.04;
  const px = r * 0.15 + (dx / dist) * pupilOff;
  const py = -r * 0.08 + (dy / dist) * pupilOff;

  {
    // §5 squash/stretch: scale by velocity (volume-preserving)
    const squashY = 1 + Math.max(-0.35, Math.min(0.35, d.bob * 0.012));
    const squashX = 1 / squashY;
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.angle);
    ctx.scale(squashX, squashY);

    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.ellipse(0, r * 0.5, r * 0.9, r * 0.22, 0, 0, Math.PI * 2); ctx.fill();

    // §6.2 reuse precomputed duck gradient
    const gkey = d.color.light + d.color.base + d.color.dark;
    let grad = duckGradCache[gkey];
    if (!grad) {
      grad = ctx.createRadialGradient(-r * 0.3, -r * 0.4, r * 0.1, 0, 0, r * 1.3);
      grad.addColorStop(0, d.color.light); grad.addColorStop(0.6, d.color.base); grad.addColorStop(1, d.color.dark);
      duckGradCache[gkey] = grad;
    }
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.ellipse(0, 0, r * 1.15, r * 0.85, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 1.2; ctx.stroke();

    ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = r * 0.12;
    ctx.beginPath(); ctx.arc(-r * 0.1, r * 0.05, r * 0.55, 0.2, 1.6); ctx.stroke();

    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(hx, hy, r * 0.55, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#e8862f';
    ctx.beginPath();
    ctx.moveTo(hx + r * 0.35, hy + r * 0.05);
    ctx.lineTo(hx + r * 0.95, hy + r * 0.12);
    ctx.lineTo(hx + r * 0.35, hy + r * 0.32);
    ctx.closePath(); ctx.fill();

    const blink = d.blinkT < 0 ? 0.1 : 1;
    ctx.fillStyle = '#20201a';
    ctx.beginPath(); ctx.ellipse(hx + px, hy + py, r * 0.09, r * 0.09 * blink, 0, 0, Math.PI * 2); ctx.fill();
    if (blink > 0.5) {
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.arc(hx + px + r * 0.03, hy + py - r * 0.03, r * 0.03, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();
  }
}

function draw() {
  // §4.2 trails: fade-to-transparent via destination-out
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  ctx.fillRect(0, 0, w, h);
  ctx.globalCompositeOperation = 'source-over';

  // re-fill background — §6.2 reuse precomputed bgGrad
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, w, h);

  // §5 Apply screen shake transform
  ctx.save();
  ctx.translate(shakeX, shakeY);
  if (!reducedMotion && shakeAngle !== 0) {
    ctx.translate(w / 2, h / 2);
    ctx.rotate(shakeAngle);
    ctx.translate(-w / 2, -h / 2);
  }

  const sunX = drawSky();
  drawDragonflies();
  drawFireflies();
  drawPollen();
  drawReeds();
  drawPond(sunX);
  drawDucks();

  // rain — §6.4 batched: one beginPath, many lineTo calls
  ctx.strokeStyle = 'rgba(210,235,250,0.75)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i < RAIN_POOL; i++) {
    const d = drops[i];
    if (!d.active) continue;
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x - d.vy * 0.02, d.y - d.size * 2.4);
  }
  ctx.stroke();

  // splash rings — §6.4 batched by color prefix: iterate unique colors, then scan rings (zero alloc)
  const colorPrefixes = ['rgba(210,240,250,', 'rgba(255,255,255,'];
  for (let ci = 0; ci < colorPrefixes.length; ci++) {
    const prefix = colorPrefixes[ci];
    ctx.strokeStyle = prefix + '0.55)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < RING_POOL; i++) {
      const r = rings[i];
      if (r.alpha < 0.01 || r.r >= r.maxR) continue;
      if (!r.color.startsWith(prefix)) continue;
      ctx.ellipse(r.x, r.y, r.r, r.r * 0.28, 0, 0, Math.PI * 2);
    }
    ctx.stroke();
  }

  // additive splash particles — §6.4 batch by color
  ctx.globalCompositeOperation = 'lighter';
  // §6.2 zero-alloc: reuse a scratch array
  let activeParts = drawScratchParts || (drawScratchParts = []);
  activeParts.length = 0;
  for (let i = 0; i < POOL; i++) {
    const p = parts[i];
    if (p.life <= 0) continue;
    activeParts.push(p);
  }
  let lastColor = '';
  for (let ai = 0; ai < activeParts.length; ai++) {
    const p = activeParts[ai];
    const t = p.life / p.max;
    ctx.globalAlpha = t * 0.9;
    if (p.color !== lastColor) { ctx.fillStyle = p.color; lastColor = p.color; }
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * t, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // §4.8 Darkness overlay with light-source holes
  // §6.2 reuse bloom canvas — only resize on DPR change
  if (bloomW !== w || bloomH !== h) {
    bloomCanvas.width = w; bloomCanvas.height = h;
    bloomW = w; bloomH = h;
  }
  bloomCtx.clearRect(0, 0, w, h);
  bloomCtx.fillStyle = 'rgba(5,12,20,0.28)';
  bloomCtx.fillRect(0, 0, w, h);
  bloomCtx.globalCompositeOperation = 'destination-out';
  const sunY = h * 0.16;
  // §6.2 reuse precomputed bloom gradients
  bloomCtx.fillStyle = bloomSunGrad;
  bloomCtx.fillRect(w * 0.76 - 120, sunY - 120, 240, 240);
  bloomCtx.fillStyle = bloomPondGrad;
  bloomCtx.fillRect(w * 0.5 - 200, baseY - 200, 400, 400);
  bloomCtx.globalCompositeOperation = 'source-over';
  ctx.drawImage(bloomCanvas, 0, 0);

  // §4.4 Bloom post-processing — §6.2 reuse offscreen canvas
  const bw2 = Math.floor(w / 2), bh2 = Math.floor(h / 2);
  if (bloomCanvas.width !== bw2 || bloomCanvas.height !== bh2) {
    bloomCanvas.width = bw2; bloomCanvas.height = bh2;
  }
  bloomCtx.clearRect(0, 0, bw2, bh2);
  bloomCtx.drawImage(canvas, 0, 0, bloomCanvas.width, bloomCanvas.height);
  bloomCtx.filter = 'blur(8px)';
  bloomCtx.drawImage(bloomCanvas, 0, 0);
  bloomCtx.filter = 'none';
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.15;
  ctx.drawImage(bloomCanvas, 0, 0, w, h);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // finger indicator
  if (hasMouse) {
    const surf = waterY(mouseX);
    if (mouseY > surf - 14) {
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(mouseX, surf, 10, 3, 0, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(mouseX, mouseY, 5, 0, Math.PI * 2); ctx.stroke();
    }
  }

  ctx.restore(); // end of shake transform

  shimmerT += DT;
}

// ==================== UI ====================
const stormEl = document.getElementById('stormVal');
const duckEl = document.getElementById('duckCount');
const savedEl = document.getElementById('savedVal');
let lastStorm = -1, lastDuckN = -1, lastSaved = -1;
function updateUI() {
  if (stormIntensity.toFixed(2) !== lastStorm) { stormEl.textContent = stormIntensity.toFixed(2); lastStorm = stormIntensity.toFixed(2); }
  if (ducks.length !== lastDuckN) { duckEl.textContent = ducks.length + '/' + MAX_DUCKS; lastDuckN = ducks.length; }
  if (savedCount !== lastSaved) { savedEl.textContent = savedCount; lastSaved = savedCount; }
}

// ==================== INIT + MAIN LOOP (§2 fixed timestep) ====================
fitCanvas();
resetAll();

let acc = 0, last = performance.now();
function frame(now) {
  acc += Math.min((now - last) / 1000, 0.1);
  last = now;

  // §5 hit-stop: freeze physics for a few frames on big impacts
  if (hitStop > 0) {
    hitStop -= DT;
    // still draw during hit-stop for the "freeze frame" effect
    draw();
    updateUI();
    requestAnimationFrame(frame);
    return;
  }

  while (acc >= DT) {
    step();
    stepShake(DT);
    acc -= DT;
  }
  draw();
  updateUI();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.addEventListener('visibilitychange', () => { last = performance.now(); acc = 0; });
</script>
</body>
