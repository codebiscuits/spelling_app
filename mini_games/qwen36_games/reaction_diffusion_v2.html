<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reaction Diffusion v2</title>
<style>
html,body{margin:0;height:100%;background:#0c0c1e;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#ddd}
canvas{display:block;cursor:crosshair}
#controls{position:fixed;top:16px;left:16px;background:rgba(12,12,30,0.85);backdrop-filter:blur(8px);padding:10px 14px;border-radius:10px;pointer-events:none;font-size:13px;line-height:1.5;max-width:260px;z-index:5;border:1px solid rgba(255,255,255,0.08)}
#controls b{color:#fff;font-weight:600}
#reset{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.25);padding:8px 18px;border-radius:999px;cursor:pointer;font:600 13px system-ui;backdrop-filter:blur(8px);z-index:5}
#reset:hover{background:rgba(255,255,255,0.22)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="controls">
<b>Reaction Diffusion</b><br>
Move — gentle force<br>
Left drag — seed chemical<br>
Right drag — erase<br>
Scroll — feed rate
</div>
<button id="reset">Reset</button>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
canvas.addEventListener('contextmenu',e=>e.preventDefault());
const state={};let w,h;
function fitCanvas(){const dpr=Math.min(window.devicePixelRatio||1,2);w=window.innerWidth;h=window.innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
fitCanvas();window.addEventListener('resize',fitCanvas);
document.getElementById('reset').addEventListener('click',()=>reset());
let mouse={x:0,y:0,left:false,right:false,buttons:0,px:0,py:0};
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouse.px=mouse.x;mouse.py=mouse.y;mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;mouse.buttons=e.buttons;mouse.left=!!(mouse.buttons&1);mouse.right=!!(mouse.buttons&2);});
canvas.addEventListener('mousedown',e=>{if(e.button===0)mouse.left=true;if(e.button===2)mouse.right=true;});
window.addEventListener('mouseup',e=>{if(e.button===0)mouse.left=false;if(e.button===2)mouse.right=false;});
canvas.addEventListener('wheel',e=>{e.preventDefault();state.wheel=-Math.sign(e.deltaY);},{passive:false});
const DT=1/60;let acc=0,last=performance.now();
function frame(now){acc+=Math.min((now-last)/1000,0.1);last=now;while(acc>=DT){update(DT);acc-=DT;}draw(acc/DT);requestAnimationFrame(frame);}
requestAnimationFrame(frame);

canvas.style.background='#100808';

function reset(){
  const W=Math.ceil(w/6),H=Math.ceil(h/6);
  u=new Float32Array(W*H).fill(0.5);
  v=new Float32Array(W*H).fill(0);
  gw=W;gh=H;
  feed=0.055;k=0.062;
}
let gw,gh,u,v,feed,k;
window.addEventListener('wheel',e=>{if(e.target===canvas){e.preventDefault();feed=Math.max(0.01,Math.min(0.12,feed-Math.sign(e.deltaY)*0.005));}},{passive:false});

function lapp(a,x,y){const i=y*gw+x;return a[i];}
function setV(x,y,val){if(x>=0&&x&lt;gw&&y>=0&&y&lt;gh)v[y*gw+x]=val;}

function update(dt){
  for(let y=1;y&lt;gh-1;y++)for(let x=1;x&lt;gw-1;x++){
    const i=y*gw+x;
    const uvv=u[i]*v[i]*v[i];
    const lapU=(u[i-1]+u[i+1]+u[i-gw]+u[i+gw]-4*u[i]);
    const lapV=(v[i-1]+v[i+1]+v[i-gw]+v[i+gw]-4*v[i]);
    const du=1*(lapU)-uvv+feed*(1-u[i]);
    const dv=0.5*(lapV)+uvv-(feed+k)*v[i];
    u[i]+=du*dt*8;v[i]+=dv*dt*8;
    if(u[i]<0)u[i]=0;if(v[i]<0)v[i]=0;
    if(u[i]>1)u[i]=1;if(v[i]>1)v[i]=1;
  }
  if(mouse.left){
    const gx=Math.floor(mouse.x/w*gw),gy=Math.floor(mouse.y/h*gh);
    for(let j=-3;j<=3;j++)for(let i=-3;i<=3;i++){
      if(gx+i>0&&gx+i&lt;gw&&gy+j>0&&gy+j&lt;gh){const d=Math.hypot(i,j);if(d<3)v[(gy+j)*gw+(gx+i)]+=0.5*(1-d/3);}
    }
  }
  if(mouse.right){
    const gx=Math.floor(mouse.x/w*gw),gy=Math.floor(mouse.y/h*gh);
    for(let j=-6;j<=6;j++)for(let i=-6;i<=6;i++){
      if(gx+i>0&&gx+i&lt;gw&&gy+j>0&&gy+j&lt;gh){
        const d=Math.hypot(i,j);if(d<6)v[(gy+j)*gw+(gx+i)]*=0.8;
      }
    }
  }
}

function draw(alpha){
  const img=ctx.getImageData(0,0,gw,gh);const d=img.data;
  for(let i=0;i&lt;gw*gh;i++){
    const idx=i*4;const c=Math.floor(Math.min(1,v[i]*4)*255);
    // coral palette through fake cosine
    const r=Math.floor((0.5+0.5*Math.cos(6.28*(0.6+0.0)))*c);
    const g=Math.floor((0.5+0.5*Math.cos(6.28*(0.6+0.33)))*c);
    const b=Math.floor((0.5+0.5*Math.cos(6.28*(0.6+0.67)))*c);
    d[idx]=r;d[idx+1]=g;d[idx+2]=b;d[idx+3]=255;
  }
  ctx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(canvas,0,0,gw,gh,0,0,w,h);
}
reset();

</script>
</body>
</html>
