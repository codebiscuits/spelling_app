<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jelly Buddies v2</title>
<!--
  Jelly Buddies v2 — soft-body pressure blobs with googly eyes & pentatonic pops.
  Follows HANDBOOK.md §0–§7.
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0c0c1e;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#ddd}
canvas{display:block;touch-action:none;cursor:crosshair}
#ui{
  position:fixed;top:16px;left:16px;
  background:rgba(10,10,20,0.78);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.08);border-radius:14px;
  padding:14px 18px;pointer-events:none;z-index:10;
  font-size:13px;line-height:1.7;min-width:240px;
  box-shadow:0 6px 24px rgba(0,0,0,0.35)
}
#ui h3{color:#fff;margin-bottom:6px;font-size:14px;letter-spacing:.4px}
#ui .row{display:flex;justify-content:space-between;gap:12px}
#ui .key{color:#999}
#ui .val{color:#6cf;font-weight:600;font-variant-numeric:tabular-nums}
#resetBtn,#muteBtn{
  position:fixed;z-index:10;
  padding:10px 22px;border-radius:999px;
  border:1px solid rgba(255,255,255,0.2);
  background:rgba(10,10,20,0.78);color:#ccc;cursor:pointer;
  backdrop-filter:blur(10px);font:600 13px system-ui;
  box-shadow:0 6px 24px rgba(0,0,0,0.35);
  transition:background .2s,color .2s,border-color .2s
}
#resetBtn:hover,#muteBtn:hover{background:rgba(40,40,80,.85);color:#fff;border-color:rgba(255,255,255,.35)}
#resetBtn{bottom:24px;left:50%;transform:translateX(-50%)}
#muteBtn{top:16px;right:16px;padding:10px 14px;font-size:16px}
#cursorTrack{
  position:fixed;pointer-events:none;border-radius:50%;
  transform:translate(-50%,-50%);z-index:8;
  width:10px;height:10px;
  background:rgba(120,200,255,.25);
  box-shadow:0 0 14px 1px rgba(120,200,255,.15);
  mix-blend-mode:screen;display:none
}
@media(prefers-reduced-motion:reduce){#cursorTrack{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cursorTrack"></div>
<div id="ui">
  <h3>Jelly Buddies v2</h3>
  <div class="row"><span class="key">Move</span><span class="val">Stir / attract</span></div>
  <div class="row"><span class="key">Left drag</span><span class="val">Grab &amp; fling</span></div>
  <div class="row"><span class="key">Right click</span><span class="val">Pop buddy</span></div>
  <div class="row"><span class="key">Scroll</span><span class="val">Squish: <span id="sv">1.00</span></span></div>
  <div class="row"><span class="key">Space</span><span class="val">Reset</span></div>
  <div class="row"><span class="key">M</span><span class="val">Mute: <span id="mv">on</span></span></div>
  <div class="row"><span class="key">Buddies</span><span class="val" id="bc">0</span>/<span id="maxC">10</span></div>
</div>
<button id="muteBtn" aria-label="Toggle sound">🔇</button>
<button id="resetBtn">🔄 Reset</button>
<script>
'use strict';

/* ═══════════ ENGINE BONES (§2) ═══════════ */
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const cursor = document.getElementById('cursorTrack');
const svEl   = document.getElementById('sv');
const bcEl   = document.getElementById('bc');
const maxCEl = document.getElementById('maxC');
const mvEl   = document.getElementById('mv');

let w = 0, h = 0;
function fitCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  w = window.innerWidth; h = window.innerHeight;
  canvas.width  = w * dpr; canvas.height = h * dpr;
  canvas.style.width  = w + 'px'; canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildBokeh();
}
fitCanvas();
window.addEventListener('resize', fitCanvas);

/* Fixed timestep */
const DT = 1 / 60;
let acc = 0, last = performance.now();
function frame(now) {
  acc += Math.min((now - last) / 1000, 0.1);
  last = now;
  while (acc >= DT) { update(DT); acc -= DT; }
  draw(acc / DT);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ═══════════ TUNING ═══════════ */
const N_PTS   = 18;
const ITERS   = 5;
const GRAVITY = 0.22;
const DAMP    = 0.986;
const MAX_BLOBS = 10;
const FLOOR_PAD = 8;
let squish = 1.0;

/* ═══════════ PALETTE (§4.1) ═══════════ */
function cosPalette(t) {
  const d = [0.00, 0.25, 0.55];
  const c = [];
  for (let i = 0; i < 3; i++) c.push(0.55 + 0.40 * Math.cos(6.28318 * (0.9 * t + d[i])));
  return c;
}
function rgb(c, mul, add) {
  return 'rgb(' + c.map(v => Math.round(Math.min(1, v * mul + add) * 255)).join(',') + ')';
}

/* ═══════════ AUDIO — pentatonic, muted by default (§5) ═══════════ */
let AC = null, muted = true;
function ensureAudio() { if (muted) return; if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); }
function tone(f0, f1, dur, vol, type, delay) {
  if (muted || !AC) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'triangle';
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(AC.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const PENTA = [0, 2, 4, 7, 9];
const penta = (base, i) => base * Math.pow(2, (PENTA[i % 5] + 12 * ((i / 5) | 0)) / 12);

/* ═══════════ GLOW SPRITE + PARTICLE POOL (§4.2, §6.2) ═══════════ */
const glowSprite = document.createElement('canvas');
glowSprite.width = glowSprite.height = 64;
{
  const g = glowSprite.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.35, 'rgba(255,255,255,0.35)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
}
const POOL = 260;
const parts = new Array(POOL);
for (let i = 0; i < POOL; i++) parts[i] = { x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 8, color: '#fff' };
let pHead = 0;
function spawnPart(x, y, vx, vy, size, color, life) {
  const p = parts[pHead]; pHead = (pHead + 1) % POOL;
  p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.size = size; p.color = color; p.life = p.max = life;
}

/* ═══════════ SCREEN SHAKE (§5) ═══════════ */
let trauma = 0;

/* ═══════════ BOKEH BACKGROUND (§4.1, §5 ambient) ═══════════ */
const bokehCanvas = document.createElement('canvas');
let bokehCtx = null;
let bokehStars = [];
function buildBokeh() {
  bokehCanvas.width = w; bokehCanvas.height = h;
  bokehCtx = bokehCanvas.getContext('2d');
  bokehStars = [];
  for (let i = 0; i < 55; i++) {
    bokehStars.push({
      x: Math.random() * w, y: Math.random() * h,
      r: 14 + Math.random() * 70,
      hue: 200 + Math.random() * 120,
      phase: Math.random() * Math.PI * 2,
      speed: 0.1 + Math.random() * 0.45
    });
  }
}

/* ═══════════ BLOBS — soft-body pressure blobs (§3.1) ═══════════ */
const blobs = [];

function makeBlob(x, y, r) {
  const paletteT = Math.random() * Math.PI * 2;
  const c3 = cosPalette(paletteT);
  const b = {
    r, pts: [],
    ringRest: 2 * r * Math.sin(Math.PI / N_PTS),
    bendRest: 2 * r * Math.sin(2 * Math.PI / N_PTS),
    restArea: Math.PI * r * r,
    base: rgb(c3, 1, 0), light: rgb(c3, 1, 0.35), dark: rgb(c3, 0.55, 0),
    s: 0.25, sv: 0,
    cx: x, cy: y, vx: 0, vy: 0,
    blinkT: 1 + Math.random() * 4,
    eyeOff: Math.random() * Math.PI * 2,
    impactCd: 0, impact: 0,
    paletteT
  };
  for (let i = 0; i < N_PTS; i++) {
    const a = (i / N_PTS) * Math.PI * 2;
    const px = x + Math.cos(a) * r * b.s;
    const py = y + Math.sin(a) * r * b.s;
    b.pts.push({ x: px, y: py, px: px, py: py, grabbed: false });
  }
  blobs.push(b);
  return b;
}

function popBlob(b, cx, cy) {
  const idx = blobs.indexOf(b);
  if (idx < 0) return;
  for (const p of b.pts) {
    const dx = p.x - cx, dy = p.y - cy;
    const d = Math.hypot(dx, dy) || 1;
    spawnPart(p.x, p.y,
      dx / d * (2 + Math.random() * 4) + b.vx,
      dy / d * (2 + Math.random() * 4) + b.vy,
      5 + Math.random() * 9, b.light, 0.5 + Math.random() * 0.4);
  }
  trauma = Math.min(1, trauma + 0.3);
  tone(700, 180, 0.25, 0.20, 'square');
  tone(300, 60, 0.35, 0.15, 'sine', 0.03);
  blobs.splice(idx, 1);
  updateCount();
}

function resetBlobs() {
  blobs.length = 0;
  trauma = 0;
  squish = 1.0;
  svEl.textContent = '1.00';
  for (let i = 0; i < 4; i++) {
    const r = 42 + Math.random() * 26;
    makeBlob(w * (0.25 + 0.17 * i), h * 0.25 + Math.random() * h * 0.2, r);
  }
  updateCount();
}

function updateCount() { bcEl.textContent = blobs.length; }

/* ═══════════ INPUT — four mouse verbs (§0, §2.3) ═══════════ */
const mouse = { x: -9999, y: -9999, lx: -9999, ly: -9999, left: false, right: false };
const grabs = new Map();

canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.lx = mouse.x; mouse.ly = mouse.y;
  mouse.x = e.clientX - r.left;
  mouse.y = e.clientY - r.top;
  mouse.left  = !!(e.buttons & 1);
  mouse.right = !!(e.buttons & 2);
  cursor.style.left = mouse.x + 'px';
  cursor.style.top  = mouse.y + 'px';
});

canvas.addEventListener('mousedown', e => {
  ensureAudio();
  if (e.button === 0) {
    mouse.left = true;
    const b = blobAt(mouse.x, mouse.y);
    if (b) {
      let best = 0, bd = Infinity;
      for (let i = 0; i < b.pts.length; i++) {
        const d = Math.hypot(b.pts[i].x - mouse.x, b.pts[i].y - mouse.y);
        if (d < bd) { bd = d; best = i; }
      }
      grabs.set(b, { idx: best, ox: mouse.x, oy: mouse.y });
    }
  }
  if (e.button === 2) {
    mouse.right = true;
    const b = blobAt(mouse.x, mouse.y);
    if (b) popBlob(b, mouse.x, mouse.y);
  }
});

window.addEventListener('mouseup', e => {
  if (e.button === 0) {
    mouse.left = false;
    grabs.clear();
  }
  if (e.button === 2) mouse.right = false;
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  squish = Math.max(0.5, Math.min(2.0, squish - Math.sign(e.deltaY) * 0.05));
  svEl.textContent = squish.toFixed(2);
}, { passive: false });

window.addEventListener('keydown', e => {
  if (e.code === 'Space') resetBlobs();
  if (e.code === 'KeyM') toggleMute();
});

function blobAt(x, y) {
  let best = null, bd = Infinity;
  for (const b of blobs) {
    const dx = b.cx - x, dy = b.cy - y;
    const d = Math.hypot(dx, dy);
    if (d < b.r * 1.6 && d < bd) { bd = d; best = b; }
  }
  return best;
}

function toggleMute() {
  muted = !muted;
  mvEl.textContent = muted ? 'on' : 'off';
  document.getElementById('muteBtn').textContent = muted ? '\u{1F50A}' : '\u{1F507}';
  if (!muted) ensureAudio();
}

/* ═══════════ PHYSICS — Verlet + constraints (§3) ═══════════ */
function update(dt) {
  stateTick(dt);
  physicsStep(dt);
}

function stateTick(dt) {
  /* Particle update — only here, not in physicsStep */
  for (let i = 0; i < POOL; i++) {
    const p = parts[i];
    if (p.life <= 0) continue;
    p.life -= dt;
    p.vy += 0.12;
    p.vx *= Math.exp(-1.4 * dt);
    p.vy *= Math.exp(-1.4 * dt);
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }

  /* Auto-spawn at cursor while left held — "max chaos is the designed state" (§7) */
  if (mouse.left && blobs.length < MAX_BLOBS) {
    if (Math.random() < 0.04) {
      makeBlob(mouse.x + (Math.random() - 0.5) * 10,
               mouse.y + (Math.random() - 0.5) * 10,
               26 + Math.random() * 22);
    }
  }

  /* Ambient nudges — nothing perfectly still (§5) */
  if (blobs.length < 4 && Math.random() < 0.01) {
    makeBlob(Math.random() * w, Math.random() * h * 0.8, 32 + Math.random() * 26);
  }
}

function physicsStep(dt) {
  const time = performance.now() * 0.001;

  for (const b of blobs) {
    const pts = b.pts;

    /* Integrate — velocity implicit in pos - prevPos */
    for (const p of pts) {
      const vx = (p.x - p.px) * DAMP;
      const vy = (p.y - p.py) * DAMP;
      p.px = p.x; p.py = p.y;
      p.x += vx;
      p.y += vy + GRAVITY * dt * 60;
    }

    /* Spawn spring — underdamped for juicy pop-in (§5 easing) */
    const omega = 9;
    b.sv += (1 - b.s) * omega * omega * dt;
    b.sv *= Math.exp(-1.3 * omega * dt);
    b.s = Math.min(1.25, b.s + b.sv * dt);

    b.age += dt;

    /* Blink timer */
    b.blinkT -= dt;
    if (b.blinkT <= 0) b.blinkT = 1.5 + Math.random() * 3.5;

    /* Impact cooldown */
    b.impactCd = Math.max(0, b.impactCd - dt);

    /* ── Constraints (N_PTS ring + bending) ── */
    for (let iter = 0; iter < ITERS; iter++) {
      /* Ring distance constraints */
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], c = pts[(i + 1) % pts.length];
        const dx = c.x - a.x, dy = c.y - a.y;
        const dist = Math.hypot(dx, dy) || 0.001;
        const rest = b.ringRest * squish;
        const diff = (dist - rest) / dist * 0.5;
        if (!a.grabbed) { a.x += dx * diff; a.y += dy * diff; }
        if (!c.grabbed) { c.x -= dx * diff; c.y -= dy * diff; }
      }

      /* Bending constraints (i to i+2 for smooth outline) */
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], c = pts[(i + 2) % pts.length];
        const dx = c.x - a.x, dy = c.y - a.y;
        const dist = Math.hypot(dx, dy) || 0.001;
        const diff = (dist - b.bendRest) / dist * 0.25;
        if (!a.grabbed) { a.x += dx * diff; a.y += dy * diff; }
        if (!c.grabbed) { c.x -= dx * diff; c.y -= dy * diff; }
      }

      /* Pressure — compare shoelace area to rest area */
      let area = 0;
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], c = pts[(i + 1) % pts.length];
        area += a.x * c.y - c.x * a.y;
      }
      area = Math.abs(area) / 2;
      const pressure = (b.restArea - area) * 0.005;
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        if (p.grabbed) continue;
        const prev = pts[(i + pts.length - 1) % pts.length];
        const next = pts[(i + 1) % pts.length];
        let nx = next.y - prev.y;
        let ny = -(next.x - prev.x);
        const nl = Math.hypot(nx, ny) || 1;
        p.x += nx / nl * pressure;
        p.y += ny / nl * pressure;
      }
    }

    /* Center of mass */
    b.cx = pts.reduce((s, p) => s + p.x, 0) / pts.length;
    b.cy = pts.reduce((s, p) => s + p.y, 0) / pts.length;
  }

  /* ── Mouse interaction ── */
  if (grabs.size) {
    for (const [b, g] of grabs) {
      const p = b.pts[g.idx];
      const dx = mouse.x - p.x, dy = mouse.y - p.y;
      const throwVx = mouse.x - mouse.lx;
      const throwVy = mouse.y - mouse.ly;
      p.x += dx * 0.25;
      p.y += dy * 0.25;
      p.px -= throwVx * 0.6;
      p.py -= throwVy * 0.6;
    }
  } else if (mouse.left) {
    for (const b of blobs) {
      const dx = mouse.x - b.cx, dy = mouse.y - b.cy;
      const d = Math.hypot(dx, dy) || 1;
      if (d < 160) {
        const f = 0.6 * (1 - d / 160);
        b.vx += f * dx / d * 12;
        b.vy += f * dy / d * 12;
      }
    }
  }

  /* ── Inter-blob repulsion ── */
  for (let i = 0; i < blobs.length; i++) {
    for (let j = i + 1; j < blobs.length; j++) {
      const a = blobs[i], b = blobs[j];
      const dx = a.cx - b.cx, dy = a.cy - b.cy;
      const dd = Math.hypot(dx, dy) || 1;
      const minD = (a.r + b.r) * 1.05;
      if (dd < minD) {
        const overlap = minD - dd;
        const nx = dx / dd, ny = dy / dd;
        for (const p of a.pts) { p.x += nx * overlap * 0.5; p.y += ny * overlap * 0.5; }
        for (const p of b.pts) { p.x -= nx * overlap * 0.5; p.y -= ny * overlap * 0.5; }
      }
    }
  }

  /* ── Floor & walls ── */
  for (const b of blobs) {
    for (const p of b.pts) {
      if (p.y > h - FLOOR_PAD) {
        const vy = p.y - p.py;
        p.y = h - FLOOR_PAD;
        p.py = p.y - vy * 0.35;
      }
      if (p.x < FLOOR_PAD) {
        const vx = p.x - p.px;
        p.x = FLOOR_PAD;
        p.px = p.x - vx * 0.35;
      }
      if (p.x > w - FLOOR_PAD) {
        const vx = p.x - p.px;
        p.x = w - FLOOR_PAD;
        p.px = p.x - vx * 0.35;
      }
    }
  }

  /* ── Per-blob bookkeeping: velocity, blink, landing juice ── */
  for (const b of blobs) {
    let cx = 0, cy = 0;
    for (const p of b.pts) { cx += p.x; cy += p.y; }
    cx /= b.pts.length;
    cy /= b.pts.length;
    b.vx = cx - b.cx;
    b.vy = cy - b.cy;
    b.cx = cx;
    b.cy = cy;

    /* Landing particles + sound + screenshake */
    if (b.impact > 4.5 && b.impactCd === 0) {
      b.impactCd = 0.3;
      const strength = Math.min(1, (b.impact - 4.5) / 8);
      trauma = Math.min(1, trauma + strength * 0.35);
      const nP = 4 + (strength * 10) | 0;
      for (let i = 0; i < nP; i++) {
        spawnPart(
          b.cx + (Math.random() - 0.5) * b.r * b.s * 1.6,
          h - FLOOR_PAD - 2,
          (Math.random() - 0.5) * 4,
          -1 - Math.random() * 3 * strength,
          3 + Math.random() * 6,
          b.light,
          0.3 + Math.random() * 0.3
        );
      }
      tone(520 - b.r * 3, (520 - b.r * 3) * 0.55, 0.12, 0.05 + strength * 0.12);
    }

    /* Hit-stop: freeze simulation on big impacts (§5) */
    if (b.impact > 8 && b.impactCd > 0) {
      b.impactCd -= dt;
      b.impact = 0;
    } else if (b.impact > 8) {
      b.impactCd = 0.08;
    }
  }

  /* ── Trauma decay ── */
  trauma = Math.max(0, trauma * Math.exp(-3.5 * dt));
}

/* ═══════════ RENDERING (§4) ═══════════ */
function drawBlobBody(b) {
  const pts = b.pts, n = pts.length;
  ctx.beginPath();
  let mx = (pts[n - 1].x + pts[0].x) / 2;
  let my = (pts[n - 1].y + pts[0].y) / 2;
  ctx.moveTo(mx, my);
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    ctx.quadraticCurveTo(p.x, p.y, (p.x + q.x) / 2, (p.y + q.y) / 2);
  }
  ctx.closePath();
}

function draw(alpha) {
  const time = performance.now() * 0.001;
  const shakeX = (Math.random() - 0.5) * trauma * 18;
  const shakeY = (Math.random() - 0.5) * trauma * 18;

  ctx.save();
  ctx.translate(shakeX, shakeY);

  /* Background — never pure black (§4.1) */
  const bg = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.18, w / 2, h / 2, Math.max(w, h) * 0.85);
  bg.addColorStop(0, '#14102a');
  bg.addColorStop(1, '#080714');
  ctx.fillStyle = bg;
  ctx.fillRect(-40, -40, w + 80, h + 80);

  /* Bokeh — drifting colored orbs */
  if (bokehCtx) {
    ctx.globalCompositeOperation = 'lighter';
    for (const s of bokehStars) {
      const a = 0.08 + 0.07 * Math.sin(time * s.speed + s.phase);
      const x = s.x + Math.sin(time * 0.3 + s.phase) * 18;
      const y = s.y + Math.cos(time * 0.25 + s.phase) * 14;
      const rg = ctx.createRadialGradient(x, y, 0, x, y, s.r);
      rg.addColorStop(0, `hsla(${s.hue},70%,70%,${a})`);
      rg.addColorStop(1, `hsla(${s.hue},70%,70%,0)`);
      ctx.fillStyle = rg;
      ctx.fillRect(x - s.r, y - s.r, s.r * 2, s.r * 2);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* Floor glow strip */
  const fg = ctx.createLinearGradient(0, h - 60, 0, h);
  fg.addColorStop(0, 'rgba(120,110,200,0)');
  fg.addColorStop(1, 'rgba(120,110,200,0.10)');
  ctx.fillStyle = fg;
  ctx.fillRect(0, h - 60, w, 60);

  /* Blobs */
  for (const b of blobs) {
    const r = b.r * b.s;

    /* Ground shadow */
    const shAlpha = Math.max(0, 1 - (h - FLOOR_PAD - b.cy - r) / 160) * 0.35;
    if (shAlpha > 0.01) {
      ctx.fillStyle = `rgba(0,0,0,${shAlpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.ellipse(b.cx, h - FLOOR_PAD + 1, r * 0.85, r * 0.16, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    /* Body — glossy radial gradient */
    drawBlobBody(b);
    const g = ctx.createRadialGradient(b.cx - r * 0.30, b.cy - r * 0.35, r * 0.1, b.cx, b.cy, r * 1.25);
    g.addColorStop(0, b.light);
    g.addColorStop(0.55, b.base);
    g.addColorStop(1, b.dark);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.18)';
    ctx.lineWidth = 2;
    ctx.stroke();

    /* Specular highlight — screen-aligned (light source) */
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.ellipse(b.cx - r * 0.32, b.cy - r * 0.42, r * 0.26, r * 0.13, -0.6, 0, Math.PI * 2);
    ctx.fill();

    /* Inner sheen */
    ctx.fillStyle = b.light;
    ctx.globalAlpha = 0.18;
    ctx.fill();
    ctx.globalAlpha = 1;

    /* Glow outline */
    ctx.shadowColor = b.base;
    ctx.shadowBlur = 18;
    ctx.strokeStyle = b.base;
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.shadowBlur = 0;

    /* Googly eyes */
    const cx = b.pts.reduce((s, p) => s + p.x, 0) / b.pts.length;
    const cy = b.pts.reduce((s, p) => s + p.y, 0) / b.pts.length;
    const blink = b.blinkT < 0.12 ? 0.08 : 1;
    const ex1 = cx - Math.cos(b.eyeOff) * b.r * 0.25, ey1 = cy - Math.sin(b.eyeOff) * b.r * 0.4;
    const ex2 = cx + Math.cos(b.eyeOff) * b.r * 0.25, ey2 = cy - Math.sin(b.eyeOff) * b.r * 0.4;

    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(ex1, ey1, b.r * 0.2 * blink, b.r * 0.22 * blink, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(ex2, ey2, b.r * 0.2 * blink, b.r * 0.22 * blink, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#0a0a16';
    ctx.beginPath(); ctx.arc(ex1 + Math.cos(time * 2.2) * 2, ey1, b.r * 0.08 * blink, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex2 + Math.cos(time * 2.2 + 1) * 2, ey2, b.r * 0.08 * blink, 0, Math.PI * 2); ctx.fill();
  }

  ctx.restore();

  /* Particles — additive glow sprites */
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < POOL; i++) {
    const p = parts[i];
    if (p.life <= 0) continue;
    const t = p.life / p.max;
    ctx.globalAlpha = t;
    const s = p.size * (0.4 + 0.6 * t);
    ctx.drawImage(glowSprite, p.x - s / 2, p.y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ═══════════ INIT ═══════════ */
document.getElementById('resetBtn').addEventListener('click', resetBlobs);
document.getElementById('muteBtn').addEventListener('click', toggleMute);

resetBlobs();
