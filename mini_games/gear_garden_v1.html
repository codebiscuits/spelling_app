<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gear Garden · Inventor's Notebook</title>
<style>
:root{color-scheme:light;--ink:#27344a;--muted:#64748b;--paper:#f5eddc;--paper2:#fffaf0;--line:#d9c8a8;--copper:#c4683d;--teal:#3d8f87;--gold:#e3a94e;--rust:#b8513a;--shadow:rgba(53,40,23,.18)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8dcc5;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:radial-gradient(#9c805d 0.65px,transparent .8px);background-size:8px 8px;mix-blend-mode:multiply}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
#panel{position:fixed;z-index:3;left:16px;top:16px;width:min(315px,calc(100vw - 32px));padding:16px 17px 14px;border:1px solid rgba(117,86,48,.25);border-radius:18px;background:rgba(255,250,239,.78);box-shadow:0 12px 38px var(--shadow),inset 0 1px rgba(255,255,255,.9);backdrop-filter:blur(14px);pointer-events:none}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--copper);font-weight:800}.title{font-family:Georgia,serif;font-size:23px;line-height:1.05;margin:4px 0 9px}.rule{height:1px;background:var(--line);margin:9px 0 10px}.controls{font-size:12px;line-height:1.65;color:#526176}.controls b{color:var(--ink);font-weight:800}.live{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;margin-top:9px;font-size:11px;color:var(--muted)}.live span{display:block;color:var(--ink);font-weight:800;font-size:13px}.hint{margin-top:10px;color:#8c6e43;font-size:11px;font-style:italic;min-height:16px}
#reset{position:fixed;z-index:4;bottom:24px;left:50%;transform:translateX(-50%);border:1px solid #b47a4c;border-radius:999px;padding:10px 20px;background:#fff8e8;color:#7b432d;box-shadow:0 5px 0 #b47a4c,0 10px 20px var(--shadow);font:800 12px ui-rounded,"Trebuchet MS",sans-serif;letter-spacing:.04em;cursor:pointer}#reset:active{transform:translate(-50%,4px);box-shadow:0 1px 0 #b47a4c,0 5px 12px var(--shadow)}
#tools{position:fixed;z-index:4;right:17px;top:17px;display:flex;gap:8px;align-items:center}.tool{border:1px solid rgba(117,86,48,.28);border-radius:999px;background:rgba(255,250,239,.82);color:var(--ink);padding:8px 11px;box-shadow:0 5px 15px var(--shadow);font:700 11px ui-rounded,"Trebuchet MS",sans-serif;cursor:pointer}.tool:hover{background:#fffdf7}.tool:focus-visible,#reset:focus-visible{outline:3px solid #56a8a1;outline-offset:2px}
#legend{position:fixed;z-index:2;right:20px;bottom:25px;color:#816a4b;font:11px Georgia,serif;opacity:.78;pointer-events:none;text-align:right}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px 0 10px;vertical-align:-1px}.dot.good{background:#4c9c8a}.dot.bad{background:#c26048}.dot.manual{background:#e1a448}
@media(max-width:650px){#panel{padding:12px 13px;width:250px}.title{font-size:18px}.controls{font-size:10px}.live{font-size:9px}.live span{font-size:11px}#legend{display:none}.tool{font-size:10px;padding:7px 9px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}#reset{transition:none}}
</style>
</head>
<body>
<canvas id="stage" aria-label="Gear Garden interactive canvas"></canvas>
<section id="panel">
  <div class="eyebrow">Workshop sheet 01</div><div class="title">Gear Garden</div>
  <div class="rule"></div>
  <div class="controls"><b>Move</b> — wake the pencil dust<br><b>Left-drag</b> — place, move, or turn a rim<br><b>Right-click</b> — pluck a gear away<br><b>Wheel</b> — choose the next gear's size</div>
  <div class="live"><div>GEARS<span id="gearCount">0</span></div><div>SIZE<span id="sizeReadout">34 px</span></div><div>CHAIN<span id="chainReadout">waiting</span></div><div>WORKSHOP<span id="themeReadout">notebook</span></div></div>
  <div class="hint" id="hint">Click the paper to plant a gear.</div>
</section>
<div id="tools"><button class="tool" id="sound" type="button" aria-label="Toggle sound">Sound off</button><button class="tool" id="theme" type="button" aria-label="Change theme">Notebook</button></div>
<div id="legend"><span class="dot good"></span>driven <span class="dot bad"></span>jammed <span class="dot manual"></span>hand-turned</div>
<button id="reset" type="button">Reset the workshop</button>
<script>
(() => {
'use strict';
const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d',{alpha:true});
const pane={count:document.getElementById('gearCount'),size:document.getElementById('sizeReadout'),chain:document.getElementById('chainReadout'),theme:document.getElementById('themeReadout'),hint:document.getElementById('hint')};
let W=innerWidth,H=innerHeight,dpr=1, last=performance.now(),acc=0, now=0;
const DT=1/60, TAU=Math.PI*2, reducedQuery=matchMedia('(prefers-reduced-motion: reduce)');
let reduced=reducedQuery.matches;
const themes={notebook:{label:'Notebook',bg:'#e8dcc5',paper:'#f5eddc',ink:'#27344a',copper:'#c4683d',teal:'#3d8f87',gold:'#e3a94e',rust:'#b8513a'},blueprint:{label:'Blueprint',bg:'#17344a',paper:'#d9edf0',ink:'#183546',copper:'#edac65',teal:'#65c8c1',gold:'#f5d685',rust:'#d8785e'}};
let themeName=localStorage.getItem('gear-garden-theme')||'notebook', theme=themes[themeName]||themes.notebook;
let soundOn=localStorage.getItem('gear-garden-sound')==='on', audio=null, nextSize=34, gears=[], sparks=[], ripples=[], pointer={x:W/2,y:H/2,px:W/2,py:H/2,inside:false,down:false,button:0}, drag=null, trauma=0, lastTick=0, serial=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t, dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y), ease=t=>1-Math.pow(1-t,3);
function applyTheme(){document.documentElement.style.setProperty('--ink',theme.ink);document.documentElement.style.setProperty('--paper',theme.paper);document.documentElement.style.setProperty('--copper',theme.copper);document.documentElement.style.setProperty('--teal',theme.teal);document.documentElement.style.setProperty('--gold',theme.gold);document.body.style.background=theme.bg;document.getElementById('theme').textContent=theme.label;pane.theme.textContent=theme.label.toLowerCase()}
function fit(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
function initial(){gears=[];sparks=[];ripples=[];serial=0;const bx=clamp(W*.5-250,110,W-560),by=clamp(H*.47,150,H-220);addGear(bx,by,54,true);addGear(bx+90,by,36,false);addGear(bx+153,by,27,false);addGear(bx+224,by,44,false);addGear(bx+90,by+66,30,false);addGear(bx+142,by+66,22,false);pointer.x=W/2;pointer.y=H/2;hint('The copper motor is awake. Add a gear where two rims almost kiss.');}
function addGear(x,y,r,motor=false){const g={id:++serial,x:clamp(x,70,W-35),y:clamp(y,80,H-50),r:clamp(r,18,76),angle:Math.random()*TAU,prev:0,omega:motor?1.15:0,motor,manual:0,manualAngle:0,drag:false,pulse:0,twitch:0,age:0,teeth:Math.round(clamp(r*.31,8,24)),phase:Math.random()*TAU};gears.push(g);if(!reduced)burst(g.x,g.y,theme.copper,10);tone(motor?220:330,.045);return g}
function removeGear(g){const i=gears.indexOf(g);if(i>=0){gears.splice(i,1);if(!reduced)burst(g.x,g.y,theme.rust,18);tone(130,.07)}}
function contact(a,b){const d=Math.hypot(b.x-a.x,b.y-a.y), gap=Math.abs(d-(a.r+b.r));return {d,gap,near:gap<Math.max(13,Math.min(a.r,b.r)*.4),touch:gap<5}}
function graph(){const links=[];for(let i=0;i<gears.length;i++)for(let j=i+1;j<gears.length;j++){const c=contact(gears[i],gears[j]);if(c.near)links.push({a:gears[i],b:gears[j],c})}return links}
function solve(advance=true){const links=graph(), seen=new Set(), states=new Map(), motor=gears.find(g=>g.motor);
  gears.forEach(g=>{g.jammed=false;g.drive=0});
  function walk(g,omega,root){if(seen.has(g.id))return;seen.add(g.id);states.set(g.id,omega);g.drive=Math.abs(omega);g.pulse=Math.max(g.pulse,.35);for(const l of links){const n=l.a===g?l.b:l.a;if(n===root)continue;walk(n,-omega*g.r/n.r,g)}}
  if(motor)walk(motor,motor.omega,motor);
  for(const l of links){const a=l.a,b=l.b;const sa=states.get(a.id),sb=states.get(b.id);if(sa!==undefined&&sb!==undefined){const expected=-sa*a.r/b.r;if(Math.abs(expected-sb)>.26){a.jammed=b.jammed=true;a.jam=clamp((Math.abs(expected-sb)-.26)*1.8,0,1);b.jam=a.jam}}}
  gears.forEach(g=>{g.twitch=states.has(g.id)||!links.some(l=>l.a===g||l.b===g)?g.twitch*.86:Math.max(g.twitch,.75);if(advance){if(g.manual){g.angle=g.manualAngle;g.omega*=.88}else if(states.has(g.id)){let target=states.get(g.id);if(g.jammed)target*=.08;g.omega=lerp(g.omega,target,.18);g.angle+=g.omega*DT}else{g.omega*=.86;g.angle+=g.omega*DT}g.age+=DT;g.prev=g.angle;g.pulse*=.93}});return {links,states};}
function spawnSpark(x,y,color,n=1){for(let i=0;i<n;i++){if(sparks.length>150)sparks.shift();const a=Math.random()*TAU,s=20+Math.random()*70;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.45+Math.random()*.55,max:.9,color,r:1+Math.random()*2})}}
function burst(x,y,color,n){for(let i=0;i<n;i++)spawnSpark(x,y,color);}
function hint(s){pane.hint.textContent=s}
function tone(freq,dur){if(!soundOn)return;if(!audio)try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.035,audio.currentTime+.008);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur+.02)}
function local(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function pick(x,y){for(let i=gears.length-1;i>=0;i--){const g=gears[i];if(Math.hypot(x-g.x,y-g.y)<g.r+9)return g}return null}
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerenter',()=>pointer.inside=true);canvas.addEventListener('pointerleave',()=>pointer.inside=false);
canvas.addEventListener('pointermove',e=>{const p=local(e);pointer.px=pointer.x;pointer.py=pointer.y;pointer.x=p.x;pointer.y=p.y;if(Math.hypot(pointer.x-pointer.px,pointer.y-pointer.py)>2){if(!reduced)spawnSpark(pointer.x,pointer.y,theme.gold,1);if(!drag)hint(reduced?'Move the pencil to inspect the garden.':'Dust follows the pencil. Wheel changes the next gear.')}if(drag){if(drag.mode==='move'){drag.g.x=clamp(pointer.x-drag.dx,45,W-45);drag.g.y=clamp(pointer.y-drag.dy,75,H-42)}else if(drag.mode==='rim'){const a=Math.atan2(pointer.y-drag.g.y,pointer.x-drag.g.x);const delta=Math.atan2(Math.sin(a-drag.last),Math.cos(a-drag.last));drag.g.manualAngle+=delta;drag.last=a;drag.g.manual=1;drag.g.resist=clamp(Math.abs(drag.g.omega-delta/DT)/3,0,1);if(drag.g.resist>.35){if(!reduced)spawnSpark(drag.g.x+Math.cos(a)*drag.g.r,drag.g.y+Math.sin(a)*drag.g.r,theme.rust,1);tone(90+drag.g.resist*90,.025)}hint(drag.g.resist>.55?'The loop pushes back — try a free rim.':'Hand-turning: the chain is listening.')}}},{passive:true});
canvas.addEventListener('pointerdown',e=>{const p=local(e);pointer.down=true;pointer.button=e.button;canvas.setPointerCapture(e.pointerId);const g=pick(p.x,p.y);if(e.button===2){if(g&&!g.motor)removeGear(g);else{if(!reduced)ripples.push({x:p.x,y:p.y,r:2,life:1,color:theme.rust});tone(100,.06);hint('A right-click plucks a gear out of the garden.')}return}if(e.button!==0)return;if(g){const radial=Math.abs(Math.hypot(p.x-g.x,p.y-g.y)-g.r);if(radial<12&&g.drive>.05){drag={mode:'rim',g,last:Math.atan2(p.y-g.y,p.x-g.x)};g.manualAngle=g.angle;hint('Rim override: resistance grows when the chain disagrees.')}else{drag={mode:'move',g,dx:p.x-g.x,dy:p.y-g.y};g.drag=true;hint('Move it until two teeth almost meet.')}}else{addGear(p.x,p.y,nextSize,false);hint('Nice. A small gap is okay — the teeth find each other.')}});
window.addEventListener('pointerup',e=>{if(drag&&drag.mode==='rim'){drag.g.manual=0;drag.g.resist=0;hint('Released. The motor is catching the chain again.')}if(drag&&drag.g)drag.g.drag=false;drag=null;pointer.down=false});
canvas.addEventListener('wheel',e=>{e.preventDefault();nextSize=clamp(nextSize-(Math.sign(e.deltaY)||1)*3,18,72);pane.size.textContent=nextSize+' px';tone(260+nextSize*2,.025);hint('Next gear: '+nextSize+' px. Plant it on the paper.')},{passive:false});
document.getElementById('reset').addEventListener('click',()=>{initial();tone(180,.08);});
document.getElementById('sound').addEventListener('click',e=>{soundOn=!soundOn;localStorage.setItem('gear-garden-sound',soundOn?'on':'off');e.currentTarget.textContent=soundOn?'Sound on':'Sound off';if(soundOn)tone(440,.1)});document.getElementById('theme').addEventListener('click',()=>{themeName=themeName==='notebook'?'blueprint':'notebook';theme=themes[themeName];localStorage.setItem('gear-garden-theme',themeName);applyTheme();hint('Theme changed without disturbing your mechanism.');});
function drawBackground(){ctx.clearRect(0,0,W,H);const grad=ctx.createLinearGradient(0,0,W,H);grad.addColorStop(0,themeName==='notebook'?'#f7efdf':'#1d4861');grad.addColorStop(1,themeName==='notebook'?'#dcc9a8':'#102b3d');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.save();ctx.globalAlpha=themeName==='notebook'?.2:.12;ctx.strokeStyle=themeName==='notebook'?'#a9875d':'#8bd0d0';ctx.lineWidth=1;const step=42;for(let x=0;x<W;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.restore();}
function drawLink(l){const a=l.a,b=l.b,c=l.c;ctx.save();ctx.setLineDash([3,7]);ctx.lineWidth=c.touch?3:1.5;ctx.strokeStyle=(a.jammed||b.jammed)?'rgba(184,81,58,.62)':'rgba(61,143,135,.48)';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore();if(a.jammed||b.jammed){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;ctx.save();ctx.fillStyle='rgba(184,81,58,.13)';ctx.beginPath();ctx.arc(mx,my,18+(reduced?0:Math.sin(now*9)*2),0,TAU);ctx.fill();ctx.fillStyle=theme.rust;ctx.font='700 10px ui-rounded, sans-serif';ctx.textAlign='center';ctx.fillText('strain',mx,my-22);ctx.restore()}}
function gearPath(g,r){const n=g.teeth;ctx.beginPath();for(let i=0;i<n;i++){const base=g.angle+i*TAU/n;for(let q=0;q<4;q++){const rr=q===0||q===3?r:r+5;const a=base+(q===0?-.33:q===1?-.17:q===2?.17:.33)*TAU/n;const x=g.x+Math.cos(a)*rr,y=g.y+Math.sin(a)*rr;if(i===0&&q===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}}ctx.closePath()}
function drawGear(g){const driven=g.drive>.04&&!g.jammed, jam=g.jammed, active=g.manual, twitch=g.twitch>.08, motion=reduced?0:1;ctx.save();if(g.pulse>.05){ctx.shadowColor=active?theme.gold:jam?theme.rust:theme.teal;ctx.shadowBlur=11*g.pulse}gearPath(g,g.r);const fill=active?'#e1a448':jam?'#d47a62':g.motor?'#c4683d':driven?'#66a99b':'#b8a486';ctx.fillStyle=fill;ctx.fill();ctx.shadowBlur=0;ctx.lineWidth=2;ctx.strokeStyle=theme.ink;ctx.globalAlpha=.78;ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle=theme.paper;ctx.beginPath();ctx.arc(g.x,g.y,Math.max(5,g.r*.22),0,TAU);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=theme.ink;ctx.stroke();ctx.strokeStyle='rgba(39,52,74,.42)';ctx.lineWidth=1.5;for(let i=0;i<4;i++){const a=g.angle+i*TAU/4+.3;ctx.beginPath();ctx.moveTo(g.x+Math.cos(a)*g.r*.22,g.y+Math.sin(a)*g.r*.22);ctx.lineTo(g.x+Math.cos(a)*g.r*.7,g.y+Math.sin(a)*g.r*.7);ctx.stroke()}if(g.motor){ctx.fillStyle=theme.paper;ctx.font='800 10px ui-rounded,sans-serif';ctx.textAlign='center';ctx.fillText('MOTOR',g.x,g.y-g.r-13)}if(jam){ctx.strokeStyle=theme.rust;ctx.lineWidth=3;ctx.beginPath();ctx.arc(g.x,g.y,g.r+10+motion*Math.sin(now*10)*2,0,TAU);ctx.stroke();ctx.fillStyle=theme.rust;ctx.font='700 10px ui-rounded,sans-serif';ctx.textAlign='center';ctx.fillText('strain',g.x,g.y-g.r-12)}if(twitch&&!jam&&!active){ctx.strokeStyle=theme.gold;ctx.lineWidth=2;ctx.setLineDash([2,5]);ctx.beginPath();ctx.arc(g.x,g.y,g.r+9+motion*Math.sin(now*12)*2,0,TAU);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=theme.gold;ctx.font='700 10px ui-rounded,sans-serif';ctx.textAlign='center';ctx.fillText('twitching',g.x,g.y-g.r-12)}if(active){ctx.strokeStyle=theme.gold;ctx.lineWidth=3;ctx.beginPath();ctx.arc(g.x,g.y,g.r+10,0,TAU);ctx.stroke()}ctx.restore()}
function draw(){drawBackground();const state=solve(false);state.links.forEach(drawLink);gears.forEach(drawGear);ctx.save();ctx.globalCompositeOperation='lighter';for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.life-=DT;s.x+=s.vx*DT;s.y+=s.vy*DT;s.vx*=.96;s.vy*=.96;if(s.life<=0){sparks.splice(i,1);continue}ctx.globalAlpha=clamp(s.life/s.max,0,1);ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill()}ctx.restore();for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.life-=DT;r.r+=110*DT;if(r.life<=0){ripples.splice(i,1);continue}ctx.globalAlpha=r.life;ctx.strokeStyle=r.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);ctx.stroke()}ctx.globalAlpha=1;const active=gears.filter(g=>g.drive>.04&&!g.jammed).length,jammed=gears.filter(g=>g.jammed).length;pane.count.textContent=gears.length;pane.chain.textContent=jammed?'tangled':active>1?active+' driven':'waiting';}
function update(dt){now+=dt;const state=solve(!reduced);if(reduced){sparks.length=0;ripples.length=0;return}if(pointer.inside&&!drag&&Math.hypot(pointer.x-pointer.px,pointer.y-pointer.py)>3&&Math.random()<.55)spawnSpark(pointer.x,pointer.y,theme.gold,1);for(const g of gears){if(g.drive>.06&&Math.random()<.04)spawnSpark(g.x+Math.cos(g.angle)*g.r,g.y+Math.sin(g.angle)*g.r,theme.teal,1);if(g.jammed&&Math.random()<.1){spawnSpark(g.x,g.y,theme.rust,2);tone(90,.02)}}trauma*=Math.pow(.02,dt);}
function frame(t){acc+=Math.min((t-last)/1000,.1);last=t;while(acc>=DT){update(DT);acc-=DT}draw();requestAnimationFrame(frame)}
applyTheme();fit();initial();reducedQuery.addEventListener('change',e=>{reduced=e.matches;if(reduced){sparks.length=0;ripples.length=0;hint('Reduced motion is on — the garden is resting.')}});addEventListener('resize',fit);requestAnimationFrame(frame);
})();
</script>
</body>
</html>
