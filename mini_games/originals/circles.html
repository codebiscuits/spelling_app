<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Circles</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #1a1a2e; }
    canvas { display: block; cursor: pointer; }
    #ui {
      position: fixed; top: 16px; left: 16px; color: #ccc; font-size: 13px;
      pointer-events: none; z-index: 10; background: rgba(10,10,20,0.75);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
      padding: 14px 18px; backdrop-filter: blur(10px); line-height: 1.7;
      min-width: 220px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #ui h3 { color: #fff; margin-bottom: 6px; font-size: 14px; letter-spacing: 0.5px; }
    #ui .param { display: flex; justify-content: space-between; gap: 12px; }
    #ui .key { color: #888; }
    #ui .val { color: #6cf; font-weight: 600; font-variant-numeric: tabular-nums; }
    #resetBtn {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 10; padding: 10px 28px; font-size: 14px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ccc; background: rgba(10,10,20,0.80); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px; cursor: pointer; backdrop-filter: blur(10px);
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    #resetBtn:hover { background: rgba(40,40,80,0.90); color: #fff; border-color: rgba(255,255,255,0.30); }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <h3>⭕ Random Circles</h3>
    <div class="param"><span class="key">Left Click</span><span class="val">Spawn circle</span></div>
    <br>
    <div class="param"><span class="key">Circles:</span><span class="val" id="circleCount">0</span></div>
  </div>
  <button id="resetBtn">&#x21BA; Clear circles</button>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    
    const circles = [];
    
    class Circle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.targetRadius = Math.random() * 80 + 20;
        this.radius = 0;
        this.hue = Math.random() * 360;
        this.saturation = Math.random() * 30 + 70;
        this.lightness = Math.random() * 30 + 40;
        this.alpha = 0.8;
        this.growing = true;
        this.pulsePhase = Math.random() * Math.PI * 2;
        this.pulseSpeed = Math.random() * 0.05 + 0.02;
      }
      
      update() {
        if (this.growing && this.radius < this.targetRadius) {
          this.radius += (this.targetRadius - this.radius) * 0.1;
          if (this.targetRadius - this.radius < 0.5) {
            this.growing = false;
          }
        }
        
        this.pulsePhase += this.pulseSpeed;
      }
      
      draw() {
        const pulse = Math.sin(this.pulsePhase) * 5;
        const r = Math.max(0.1, this.radius + pulse);
        
        // Outer glow
        const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r * 1.5);
        gradient.addColorStop(0, `hsla(${this.hue}, ${this.saturation}%, ${this.lightness}%, ${this.alpha})`);
        gradient.addColorStop(0.6, `hsla(${this.hue}, ${this.saturation}%, ${this.lightness}%, ${this.alpha * 0.4})`);
        gradient.addColorStop(1, `hsla(${this.hue}, ${this.saturation}%, ${this.lightness}%, 0)`);
        
        ctx.beginPath();
        ctx.arc(this.x, this.y, r * 1.5, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
        
        // Core circle
        ctx.beginPath();
        ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, ${this.saturation}%, ${this.lightness + 20}%, ${this.alpha})`;
        ctx.fill();
        
        // Highlight
        ctx.beginPath();
        ctx.arc(this.x - r * 0.3, this.y - r * 0.3, r * 0.3, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, ${this.saturation - 20}%, ${this.lightness + 30}%, 0.5)`;
        ctx.fill();
      }
    }
    
    function updateUI() {
      document.getElementById('circleCount').textContent = circles.length;
    }

    function animate() {
      ctx.fillStyle = 'rgba(26, 26, 46, 0.05)';
      ctx.fillRect(0, 0, width, height);

      for (const circle of circles) {
        circle.update();
        circle.draw();
      }

      updateUI();
      requestAnimationFrame(animate);
    }
    
    canvas.addEventListener('click', (e) => {
      circles.push(new Circle(e.clientX, e.clientY));
      
      // Limit circles
      while (circles.length > 50) {
        circles.shift();
      }
    });
    
    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      circles.length = 0;
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, width, height);
    });
    
    animate();
  </script>
</body>
</html>
