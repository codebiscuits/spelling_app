<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circles 2</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
        #ui {
            position: fixed; top: 16px; left: 16px; color: #ccc; font-size: 13px;
            pointer-events: none; z-index: 10; background: rgba(10,10,20,0.75);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
            padding: 14px 18px; backdrop-filter: blur(10px); line-height: 1.7;
            min-width: 220px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #ui h3 { color: #fff; margin-bottom: 6px; font-size: 14px; letter-spacing: 0.5px; }
        #ui .param { display: flex; justify-content: space-between; gap: 12px; }
        #ui .key { color: #888; }
        #ui .val { color: #6cf; font-weight: 600; font-variant-numeric: tabular-nums; }
        #resetBtn {
          position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
          z-index: 10; padding: 10px 28px; font-size: 14px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          color: #ccc; background: rgba(10,10,20,0.80); border: 1px solid rgba(255,255,255,0.15);
          border-radius: 10px; cursor: pointer; backdrop-filter: blur(10px);
          transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        #resetBtn:hover { background: rgba(40,40,80,0.90); color: #fff; border-color: rgba(255,255,255,0.30); }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
      <h3>⭕ Circles 2</h3>
      <div class="param"><span class="key">Move</span><span class="val">Mutate nearby</span></div>
      <div class="param"><span class="key">Left Click</span><span class="val">Spawn circle</span></div>
      <div class="param"><span class="key">Right Click</span><span class="val">Recolor all</span></div>
      <div class="param"><span class="key">Scroll</span><span class="val">Resize all</span></div>
      <br>
      <div class="param"><span class="key">Circles:</span><span class="val" id="circleCount">10</span></div>
    </div>
    <button id="resetBtn">&#x21BA; Reset circles</button>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        class Circle {
            constructor(x, y, radius, color, speed) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.speed = speed;
                this.angle = Math.random() * Math.PI * 2;
            }

            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                if (this.x + this.radius > canvas.width || this.x - this.radius < 0) {
                    this.angle = Math.PI - this.angle;
                }
                if (this.y + this.radius > canvas.height || this.y - this.radius < 0) {
                    this.angle = -this.angle;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.closePath();
            }
        }

        let circles = [];
        for (let i = 0; i < 10; i++) {
            circles.push(new Circle(
                Math.random() * canvas.width,
                Math.random() * canvas.height,
                Math.random() * 20 + 10,
                `hsl(${Math.random() * 360}, 100%, 50%)`,
                Math.random() * 2 + 1
            ));
        }

        function updateUI() {
            document.getElementById('circleCount').textContent = circles.length;
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            circles.forEach(circle => {
                circle.update();
                circle.draw();
            });
            updateUI();
            requestAnimationFrame(animate);
        }

        animate();

        canvas.addEventListener('mousemove', (e) => {
            circles.forEach(circle => {
                const dx = e.clientX - circle.x;
                const dy = e.clientY - circle.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < 50) {
                    circle.radius = Math.random() * 20 + 10;
                    circle.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
                    circle.speed = Math.random() * 2 + 1;
                }
            });
        });

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) { // Left mouse button
                circles.push(new Circle(
                    e.clientX,
                    e.clientY,
                    Math.random() * 20 + 10,
                    `hsl(${Math.random() * 360}, 100%, 50%)`,
                    Math.random() * 2 + 1
                ));
            } else if (e.button === 2) { // Right mouse button
                circles.forEach(circle => {
                    circle.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
                });
            }
        });

        canvas.addEventListener('wheel', (e) => {
            circles.forEach(circle => {
                circle.radius += e.deltaY > 0 ? -1 : 1;
                if (circle.radius < 5) circle.radius = 5;
            });
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            circles.length = 0;
            for (let i = 0; i < 10; i++) {
                circles.push(new Circle(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height,
                    Math.random() * 20 + 10,
                    `hsl(${Math.random() * 360}, 100%, 50%)`,
                    Math.random() * 2 + 1
                ));
            }
        });
    </script>
</body>
</html>
