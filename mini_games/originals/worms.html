<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Generative Worms</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #0a0a15;
  }
  canvas {
    display: block;
  }
  #ui {
    position: fixed; top: 16px; left: 16px; color: #ccc; font-size: 13px;
    pointer-events: none; z-index: 10; background: rgba(10,10,20,0.75);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
    padding: 14px 18px; backdrop-filter: blur(10px); line-height: 1.7;
    min-width: 220px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  #ui h3 { color: #fff; margin-bottom: 6px; font-size: 14px; letter-spacing: 0.5px; }
  #ui .param { display: flex; justify-content: space-between; gap: 12px; }
  #ui .key { color: #888; }
  #ui .val { color: #6cf; font-weight: 600; font-variant-numeric: tabular-nums; }
  #resetBtn {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 10; padding: 10px 28px; font-size: 14px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #ccc; background: rgba(10,10,20,0.80); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px; cursor: pointer; backdrop-filter: blur(10px);
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  #resetBtn:hover { background: rgba(40,40,80,0.90); color: #fff; border-color: rgba(255,255,255,0.30); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h3>🐛 Generative Worms</h3>
  <div class="param"><span class="key">Move</span><span class="val">Spawn worms</span></div>
  <div class="param"><span class="key">Left Click</span><span class="val">Worm burst</span></div>
  <br>
  <div class="param"><span class="key">Worms:</span><span class="val" id="wormCount">0</span></div>
</div>
<button id="resetBtn">&#x21BA; Reset worms</button>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let w, h;
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

class Worm {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.angle = Math.random() * Math.PI * 2;
    this.speed = 1 + Math.random() * 2;
    this.turn = (Math.random() - 0.5) * 0.2;
    this.size = 2 + Math.random() * 4;
    this.life = 200 + Math.random() * 300;
    this.hue = Math.random() * 360;
    this.history = [];
  }

  update() {
    this.angle += this.turn + (Math.random() - 0.5) * 0.1;
    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;

    this.history.push({ x: this.x, y: this.y });
    if (this.history.length > 20) this.history.shift();

    this.life--;
  }

  draw() {
    ctx.beginPath();
    for (let i = 0; i < this.history.length - 1; i++) {
      const p1 = this.history[i];
      const p2 = this.history[i + 1];
      ctx.strokeStyle = `hsla(${this.hue + i * 2}, 100%, 60%, ${i / this.history.length})`;
      ctx.lineWidth = this.size;
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
    }
    ctx.stroke();
  }
}

let worms = [];

function spawn(x, y, count = 5) {
  for (let i = 0; i < count; i++) {
    worms.push(new Worm(x, y));
  }
}

canvas.addEventListener("mousemove", e => {
  spawn(e.clientX, e.clientY, 2);
});

canvas.addEventListener("click", e => {
  spawn(e.clientX, e.clientY, 15);
});

function animate() {
  requestAnimationFrame(animate);

  ctx.fillStyle = "rgba(10,10,21,0.15)";
  ctx.fillRect(0, 0, w, h);

  for (let i = worms.length - 1; i >= 0; i--) {
    let worm = worms[i];
    worm.update();
    worm.draw();

    if (
      worm.life <= 0 ||
      worm.x < -50 || worm.x > w + 50 ||
      worm.y < -50 || worm.y > h + 50
    ) {
      worms.splice(i, 1);
    }
  }

  // cap population
  if (worms.length > 500) {
    worms.splice(0, worms.length - 500);
  }

  document.getElementById('wormCount').textContent = worms.length;
}

// initial ambient motion
for (let i = 0; i < 50; i++) {
  spawn(Math.random() * w, Math.random() * h, 1);
}

document.getElementById('resetBtn').addEventListener('click', () => {
  worms.length = 0;
  for (let i = 0; i < 50; i++) {
    spawn(Math.random() * w, Math.random() * h, 1);
  }
  ctx.fillStyle = "rgb(10,10,21)";
  ctx.fillRect(0, 0, w, h);
});

animate();
</script>
</body>
</html>
