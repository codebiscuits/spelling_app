<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body { margin:0; overflow:hidden; background:#0a0a15; }
canvas { display:block; }
#ui {
  position: fixed; top: 16px; left: 16px; color: #ccc; font-size: 13px;
  pointer-events: none; z-index: 10; background: rgba(10,10,20,0.75);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
  padding: 14px 18px; backdrop-filter: blur(10px); line-height: 1.7;
  min-width: 220px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
#ui h3 { color: #fff; margin-bottom: 6px; font-size: 14px; letter-spacing: 0.5px; }
#ui .param { display: flex; justify-content: space-between; gap: 12px; }
#ui .key { color: #888; }
#ui .val { color: #6cf; font-weight: 600; font-variant-numeric: tabular-nums; }
#resetBtn {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  z-index: 10; padding: 10px 28px; font-size: 14px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: #ccc; background: rgba(10,10,20,0.80); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px; cursor: pointer; backdrop-filter: blur(10px);
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
#resetBtn:hover { background: rgba(40,40,80,0.90); color: #fff; border-color: rgba(255,255,255,0.30); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h3>🐛 Worm Trails</h3>
  <div class="param"><span class="key">Move</span><span class="val">Spawn worm</span></div>
  <div class="param"><span class="key">Left Click</span><span class="val">Worm burst</span></div>
  <br>
  <div class="param"><span class="key">Worms:</span><span class="val" id="wormCount">0</span></div>
</div>
<button id="resetBtn">&#x21BA; Reset</button>
<script>
const canvas=c;
const ctx=canvas.getContext("2d");

let w,h;
function resize(){ w=canvas.width=innerWidth; h=canvas.height=innerHeight; }
addEventListener("resize",resize);
resize();

let worms=[];
const maxWorms=50;

class Worm{
  constructor(x,y){
    this.points=[];
    this.x=x; this.y=y;
    this.angle=Math.random()*Math.PI*2;
    this.speed=Math.random()*2+1;
    this.length=20+Math.random()*40;
    this.hue=Math.random()*360;
  }
  update(){
    this.angle+= (Math.random()-0.5)*0.3;
    this.x+=Math.cos(this.angle)*this.speed;
    this.y+=Math.sin(this.angle)*this.speed;

    this.points.push({x:this.x,y:this.y});
    if(this.points.length>this.length) this.points.shift();
  }
  draw(){
    ctx.beginPath();
    for(let i=0;i<this.points.length;i++){
      let p=this.points[i];
      ctx.lineTo(p.x,p.y);
    }
    ctx.strokeStyle=`hsla(${this.hue},100%,60%,0.7)`;
    ctx.lineWidth=2;
    ctx.stroke();
  }
}

function spawn(x,y,n){
  for(let i=0;i<n;i++){
    if(worms.length>maxWorms) worms.shift();
    worms.push(new Worm(x,y));
  }
}

addEventListener("mousemove",e=>spawn(e.clientX,e.clientY,1));
addEventListener("click",e=>spawn(e.clientX,e.clientY,10));

resetBtn.addEventListener("click",e=>{
  e.stopPropagation();
  worms.length=0;
  ctx.fillStyle="rgb(10,10,21)";
  ctx.fillRect(0,0,w,h);
});

function loop(){
  requestAnimationFrame(loop);
  ctx.fillStyle="rgba(10,10,21,0.12)";
  ctx.fillRect(0,0,w,h);

  worms.forEach(w=>{ w.update(); w.draw(); });
  document.getElementById('wormCount').textContent = worms.length;
}
loop();
</script>
</body>
</html>
