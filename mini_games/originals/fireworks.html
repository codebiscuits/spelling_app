<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fireworks</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0a15; }
    canvas { display: block; cursor: crosshair; }
    #ui {
      position: fixed; top: 16px; left: 16px; color: #ccc; font-size: 13px;
      pointer-events: none; z-index: 10; background: rgba(10,10,20,0.75);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
      padding: 14px 18px; backdrop-filter: blur(10px); line-height: 1.7;
      min-width: 220px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #ui h3 { color: #fff; margin-bottom: 6px; font-size: 14px; letter-spacing: 0.5px; }
    #ui .param { display: flex; justify-content: space-between; gap: 12px; }
    #ui .key { color: #888; }
    #ui .val { color: #6cf; font-weight: 600; font-variant-numeric: tabular-nums; }
    #resetBtn {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 10; padding: 10px 28px; font-size: 14px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ccc; background: rgba(10,10,20,0.80); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px; cursor: pointer; backdrop-filter: blur(10px);
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    #resetBtn:hover { background: rgba(40,40,80,0.90); color: #fff; border-color: rgba(255,255,255,0.30); }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <h3>🎆 Fireworks</h3>
    <div class="param"><span class="key">Left Click</span><span class="val">Launch rocket</span></div>
    <br>
    <div class="param"><span class="key">Rockets:</span><span class="val" id="rocketCount">0</span></div>
    <div class="param"><span class="key">Particles:</span><span class="val" id="particleCount">0</span></div>
  </div>
  <button id="resetBtn">&#x21BA; Clear sky</button>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    
    const rockets = [];
    const particles = [];
    const gravity = 0.05;
    
    class Rocket {
      constructor(x, targetY) {
        this.x = x;
        this.y = height;
        this.targetY = targetY;
        this.vy = -12 - Math.random() * 4;
        this.hue = Math.random() * 360;
        this.trail = [];
      }
      
      update() {
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > 10) this.trail.shift();
        
        this.vy += gravity;
        this.y += this.vy;
        this.x += (Math.random() - 0.5) * 2;
        
        return this.vy >= 0 || this.y <= this.targetY;
      }
      
      draw() {
        // Trail
        for (let i = 0; i < this.trail.length; i++) {
          const alpha = i / this.trail.length;
          ctx.beginPath();
          ctx.arc(this.trail[i].x, this.trail[i].y, 2, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, ${alpha})`;
          ctx.fill();
        }
        
        // Head
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = `hsl(${this.hue}, 100%, 90%)`;
        ctx.fill();
      }
      
      explode() {
        const count = 80 + Math.random() * 50;
        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2;
          const speed = 2 + Math.random() * 4;
          particles.push(new Particle(
            this.x, this.y,
            Math.cos(angle) * speed,
            Math.sin(angle) * speed,
            this.hue
          ));
        }
      }
    }
    
    class Particle {
      constructor(x, y, vx, vy, hue) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.hue = hue + (Math.random() - 0.5) * 30;
        this.life = 1;
        this.decay = 0.01 + Math.random() * 0.01;
        this.radius = 2 + Math.random() * 2;
      }
      
      update() {
        this.vy += gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.98;
        this.vy *= 0.98;
        this.life -= this.decay;
      }
      
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(0.1, this.radius * this.life), 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, ${this.life})`;
        ctx.fill();
      }
    }
    
    function animate() {
      ctx.fillStyle = 'rgba(10, 10, 21, 0.15)';
      ctx.fillRect(0, 0, width, height);
      
      // Update rockets
      for (let i = rockets.length - 1; i >= 0; i--) {
        if (rockets[i].update()) {
          rockets[i].explode();
          rockets.splice(i, 1);
        } else {
          rockets[i].draw();
        }
      }
      
      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].life <= 0) particles.splice(i, 1);
      }
      
      document.getElementById('rocketCount').textContent = rockets.length;
      document.getElementById('particleCount').textContent = particles.length;
      requestAnimationFrame(animate);
    }

    canvas.addEventListener('click', (e) => {
      rockets.push(new Rocket(e.clientX, e.clientY));
    });
    
    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      rockets.length = 0;
      particles.length = 0;
      ctx.fillStyle = '#0a0a15';
      ctx.fillRect(0, 0, width, height);
    });
    
    animate();
  </script>
</body>
</html>
