<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swirly Particles</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0a0f; }
    canvas { display: block; cursor: crosshair; }
    #ui {
      position: fixed; top: 16px; left: 16px; color: #ccc; font-size: 13px;
      pointer-events: none; z-index: 10; background: rgba(10,10,20,0.75);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
      padding: 14px 18px; backdrop-filter: blur(10px); line-height: 1.7;
      min-width: 220px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #ui h3 { color: #fff; margin-bottom: 6px; font-size: 14px; letter-spacing: 0.5px; }
    #ui .param { display: flex; justify-content: space-between; gap: 12px; }
    #ui .key { color: #888; }
    #ui .val { color: #6cf; font-weight: 600; font-variant-numeric: tabular-nums; }
    #resetBtn {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 10; padding: 10px 28px; font-size: 14px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ccc; background: rgba(10,10,20,0.80); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px; cursor: pointer; backdrop-filter: blur(10px);
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    #resetBtn:hover { background: rgba(40,40,80,0.90); color: #fff; border-color: rgba(255,255,255,0.30); }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <h3>✨ Swirly Particles</h3>
    <div class="param"><span class="key">Move</span><span class="val">Spawn particles</span></div>
    <div class="param"><span class="key">Hold Left Click</span><span class="val">Attract + burst</span></div>
    <br>
    <div class="param"><span class="key">Particles:</span><span class="val" id="particleCount">0</span></div>
  </div>
  <button id="resetBtn">&#x21BA; Reset particles</button>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    
    const particles = [];
    const mouse = { x: width / 2, y: height / 2, down: false };
    
    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.angle = Math.random() * Math.PI * 2;
        this.speed = Math.random() * 2 + 0.5;
        this.radius = Math.random() * 3 + 1;
        this.life = 1;
        this.decay = Math.random() * 0.015 + 0.005;
        this.hue = Math.random() * 60 + 200; // Blue-purple range
        this.orbitRadius = Math.random() * 50 + 20;
        this.orbitSpeed = (Math.random() - 0.5) * 0.1;
      }
      
      update() {
        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (mouse.down && dist < 300) {
          // Attract to mouse when clicking
          this.x += dx * 0.03;
          this.y += dy * 0.03;
          this.orbitSpeed *= 1.02;
        } else {
          // Spiral outward
          this.angle += this.orbitSpeed;
          this.x += Math.cos(this.angle) * this.speed + dx * 0.005;
          this.y += Math.sin(this.angle) * this.speed + dy * 0.005;
        }
        
        this.life -= this.decay;
        this.hue += 0.5;
      }
      
      draw() {
        const r = Math.max(0.1, this.radius * this.life);
        ctx.beginPath();
        ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, ${this.life})`;
        ctx.fill();
        
        // Trail effect
        ctx.beginPath();
        ctx.arc(this.x, this.y, r * 2, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, ${this.life * 0.3})`;
        ctx.fill();
      }
    }
    
    function spawnParticles(x, y, count) {
      for (let i = 0; i < count; i++) {
        const offsetX = (Math.random() - 0.5) * 40;
        const offsetY = (Math.random() - 0.5) * 40;
        particles.push(new Particle(x + offsetX, y + offsetY));
      }
    }
    
    function animate() {
      // Fade effect instead of clear
      ctx.fillStyle = 'rgba(10, 10, 15, 0.1)';
      ctx.fillRect(0, 0, width, height);
      
      // Spawn particles on mouse move or click
      if (mouse.down) {
        spawnParticles(mouse.x, mouse.y, 5);
      }
      
      // Update and draw particles
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        
        if (particles[i].life <= 0) {
          particles.splice(i, 1);
        }
      }
      
      // Limit particle count
      while (particles.length > 1000) {
        particles.shift();
      }

      document.getElementById('particleCount').textContent = particles.length;
      requestAnimationFrame(animate);
    }
    
    // Event listeners
    canvas.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      spawnParticles(mouse.x, mouse.y, 2);
    });
    
    canvas.addEventListener('mousedown', () => mouse.down = true);
    canvas.addEventListener('mouseup', () => mouse.down = false);
    canvas.addEventListener('mouseleave', () => mouse.down = false);
    
    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      particles.length = 0;
      mouse.down = false;
      ctx.fillStyle = '#0a0a0f';
      ctx.fillRect(0, 0, width, height);
    });
    
    // Start
    animate();
  </script>
</body>
</html>
