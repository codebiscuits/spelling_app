<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body { margin:0; overflow:hidden; background:#0a0a15; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=c;
const ctx=canvas.getContext("2d");

let w,h;
function resize(){ w=canvas.width=innerWidth; h=canvas.height=innerHeight; }
addEventListener("resize",resize);
resize();

let worms=[];
const maxWorms=50;

class Worm{
  constructor(x,y){
    this.points=[];
    this.x=x; this.y=y;
    this.angle=Math.random()*Math.PI*2;
    this.speed=Math.random()*2+1;
    this.length=20+Math.random()*40;
    this.hue=Math.random()*360;
  }
  update(){
    this.angle+= (Math.random()-0.5)*0.3;
    this.x+=Math.cos(this.angle)*this.speed;
    this.y+=Math.sin(this.angle)*this.speed;

    this.points.push({x:this.x,y:this.y});
    if(this.points.length>this.length) this.points.shift();
  }
  draw(){
    ctx.beginPath();
    for(let i=0;i<this.points.length;i++){
      let p=this.points[i];
      ctx.lineTo(p.x,p.y);
    }
    ctx.strokeStyle=`hsla(${this.hue},100%,60%,0.7)`;
    ctx.lineWidth=2;
    ctx.stroke();
  }
}

function spawn(x,y,n){
  for(let i=0;i<n;i++){
    if(worms.length>maxWorms) worms.shift();
    worms.push(new Worm(x,y));
  }
}

addEventListener("mousemove",e=>spawn(e.clientX,e.clientY,1));
addEventListener("click",e=>spawn(e.clientX,e.clientY,10));

function loop(){
  requestAnimationFrame(loop);
  ctx.fillStyle="rgba(10,10,21,0.12)";
  ctx.fillRect(0,0,w,h);

  worms.forEach(w=>{ w.update(); w.draw(); });
}
loop();
</script>
</body>
</html>
