<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fireworks</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0a15; }
    canvas { display: block; cursor: crosshair; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    
    const rockets = [];
    const particles = [];
    const gravity = 0.05;
    
    class Rocket {
      constructor(x, targetY) {
        this.x = x;
        this.y = height;
        this.targetY = targetY;
        this.vy = -12 - Math.random() * 4;
        this.hue = Math.random() * 360;
        this.trail = [];
      }
      
      update() {
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > 10) this.trail.shift();
        
        this.vy += gravity;
        this.y += this.vy;
        this.x += (Math.random() - 0.5) * 2;
        
        return this.vy >= 0 || this.y <= this.targetY;
      }
      
      draw() {
        // Trail
        for (let i = 0; i < this.trail.length; i++) {
          const alpha = i / this.trail.length;
          ctx.beginPath();
          ctx.arc(this.trail[i].x, this.trail[i].y, 2, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, ${alpha})`;
          ctx.fill();
        }
        
        // Head
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = `hsl(${this.hue}, 100%, 90%)`;
        ctx.fill();
      }
      
      explode() {
        const count = 80 + Math.random() * 50;
        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2;
          const speed = 2 + Math.random() * 4;
          particles.push(new Particle(
            this.x, this.y,
            Math.cos(angle) * speed,
            Math.sin(angle) * speed,
            this.hue
          ));
        }
      }
    }
    
    class Particle {
      constructor(x, y, vx, vy, hue) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.hue = hue + (Math.random() - 0.5) * 30;
        this.life = 1;
        this.decay = 0.01 + Math.random() * 0.01;
        this.radius = 2 + Math.random() * 2;
      }
      
      update() {
        this.vy += gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.98;
        this.vy *= 0.98;
        this.life -= this.decay;
      }
      
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(0.1, this.radius * this.life), 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, ${this.life})`;
        ctx.fill();
      }
    }
    
    function animate() {
      ctx.fillStyle = 'rgba(10, 10, 21, 0.15)';
      ctx.fillRect(0, 0, width, height);
      
      // Update rockets
      for (let i = rockets.length - 1; i >= 0; i--) {
        if (rockets[i].update()) {
          rockets[i].explode();
          rockets.splice(i, 1);
        } else {
          rockets[i].draw();
        }
      }
      
      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].life <= 0) particles.splice(i, 1);
      }
      
      requestAnimationFrame(animate);
    }
    
    canvas.addEventListener('click', (e) => {
      rockets.push(new Rocket(e.clientX, e.clientY));
    });
    
    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });
    
    animate();
  </script>
</body>
</html>
