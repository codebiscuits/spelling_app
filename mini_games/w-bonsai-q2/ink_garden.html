<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ink Garden</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    overflow: hidden;
    background: #111;
    font-family: system-ui, -apple-system, sans-serif;
  }
  canvas {
    display: block;
    cursor: crosshair;
  }
  /* Controls pane — house standard: top-left, frosted glass */
  #controls {
    position: fixed;
    top: 16px;
    left: 16px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    border-radius: 10px;
    padding: 14px 18px;
    color: rgba(255, 255, 255, 0.85);
    font-size: 13px;
    line-height: 1.6;
    pointer-events: none;
    user-select: none;
    min-width: 200px;
  }
  #controls h3 {
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  #controls .row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  #controls .label { font-weight: 500; }
  #controls .value { text-align: right; color: rgba(255, 255, 255, 0.6); }
  /* Sound toggle — house standard */
  #sound-toggle {
    position: fixed;
    top: 16px;
    left: 210px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 6px;
    padding: 6px 12px;
    color: rgba(255, 255, 255, 0.85);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    pointer-events: all;
    user-select: none;
    transition: background 0.2s;
    opacity: 0.7;
  }
  #sound-toggle:hover {
    background: rgba(255, 255, 255, 0.18);
    opacity: 1;
  }
  /* Reset button — house standard: bottom-centre, pill button */
  #reset-btn {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 999px;
    padding: 8px 24px;
    color: rgba(255, 255, 255, 0.9);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    pointer-events: all;
    transition: background 0.2s;
    user-select: none;
  }
  #reset-btn:hover {
    background: rgba(255, 255, 255, 0.22);
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="controls">
  <h3>Ink Garden</h3>
  <div class="row"><span class="label">Move</span><span class="value">Cursor</span></div>
  <div class="row"><span class="label">Left click</span><span class="value">Pour ink</span></div>
  <div class="row"><span class="label">Right click</span><span class="value">Vortex</span></div>
  <div class="row"><span class="label">Scroll</span><span class="value">Brush size</span></div>
  <div class="row"><span class="label">Brush</span><span class="value" id="brush-size">4</span></div>
  <div class="row"><span class="label">Sound</span><span class="value" id="sound-state">🔇 Muted</span></div>
  <div class="row"><span class="label">FPS</span><span class="value" id="fps-counter">--</span></div>
</div>

<button id="sound-toggle">🔇 Muted</button>

<button id="reset-btn">Reset</button>

<script>

/* ============================================================
 *  §2.1 — Fixed timestep game loop (60 Hz, tab-switch guard)
 * ============================================================ */
const DT = 1 / 60;
let acc = 0;
let last = performance.now();
let fpsCounter = 0, lastFpsTime = performance.now();

function frame(now) {
  acc += Math.min((now - last) / 1000, 0.1);
  last = now;
  while (acc >= DT) {
    update(DT);
    acc -= DT;
  }
  draw(acc / DT);

  // FPS counter — update every 100ms
  fpsCounter++;
  if (now - lastFpsTime >= 100) {
    document.getElementById('fps-counter').textContent = fpsCounter + ' fps';
    fpsCounter = 0;
    lastFpsTime = now;
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ============================================================
 *  §2.2 — DPR-aware canvas initialisation
 * ============================================================ */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let w, h, dpr;

function fitCanvas() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  w = window.innerWidth;
  h = window.innerHeight;
  canvas.width  = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  initBloomBuffer();
}
fitCanvas();
window.addEventListener('resize', fitCanvas);

/* ============================================================
 *  §2.3 — Mouse input wiring
 * ============================================================ */
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('mousedown', e => {
  if (e.button === 0)  onMouseDown(0, e);
  if (e.button === 2)  onMouseDown(2, e);
});

canvas.addEventListener('mousemove', e => {
  onMouseMove(e);
});

window.addEventListener('mouseup', e => {
  if (e.button === 0)  onMouseUp(0);
  if (e.button === 2)  onMouseUp(2);
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  targetBrushSize = Math.max(2, Math.min(16, targetBrushSize - Math.sign(e.deltaY) * 2));
  document.getElementById('brush-size').textContent = targetBrushSize;
}, { passive: false });

let mouseX = w / 2;
let mouseY = h / 2;
canvas.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

let mouseLeftDown  = false;
let mouseRightDown = false;

/* ============================================================
 *  §0 — Reset button
 * ============================================================ */
document.getElementById('reset-btn').addEventListener('click', reset);

/* ============================================================
 *  §3.5a — Stable fluids (Jos Stam, 1999) — ink simulation
 * ============================================================ */
const GRID = 128;                       // grid resolution (128×128)
const GRID_INV = 1 / (GRID - 1);          // map cell index → [0,1]
const PROJECT_ITER = 20;                // Jacobi iterations for projection
const DIFFUSE_STEPS = 2;                // diffusion smoothing passes
const FRICTION = 0.995;                  // velocity damping per step
const INK_DECAY = 0.999;                // dye fade per frame
const DYE_MAX = 1.0;                    // cap dye intensity

// Grid state
let vx = new Float32Array(GRID * GRID);  // x-velocity
let vy = new Float32Array(GRID * GRID);  // y-velocity
let dyeR = new Float32Array(GRID * GRID); // red dye
let dyeG = new Float32Array(GRID * GRID); // green dye
let dyeB = new Float32Array(GRID * GRID); // blue dye

// Scratch arrays — pre-allocated once, reused every frame (§6.2 zero-allocation)
let auxVx = new Float32Array(GRID * GRID);
let auxVy = new Float32Array(GRID * GRID);
let auxR  = new Float32Array(GRID * GRID);
let auxG  = new Float32Array(GRID * GRID);
let auxB  = new Float32Array(GRID * GRID);
let p     = new Float32Array(GRID * GRID);
let ps    = new Float32Array(GRID * GRID);
let gridCanvas, gctx, gridImageData, gridData;

function initGridCanvas() {
  gridCanvas = document.createElement('canvas');
  gridCanvas.width = GRID;
  gridCanvas.height = GRID;
  gctx = gridCanvas.getContext('2d');
  gridImageData = gctx.createImageData(GRID, GRID);
  gridData = gridImageData.data;
}

const idx = (x, y) => x + y * GRID;
const cell = (cx, cy) => {
  const ix = Math.max(0, Math.min(GRID - 1, cx | 0));
  const iy = Math.max(0, Math.min(GRID - 1, cy | 0));
  return idx(ix, iy);
};

// Mouse interaction state
let inkBrushSize = 4;         // brush radius in grid cells
let inkDragColor = [1, 0.8, 0.6];  // hue of current ink brush

/* ============================================================
 *  §10 — Subagent: Juice effects (easing, particles, shake, sound)
 * ============================================================ */

// --- §5.1 Easing ---
// Cubic easing functions — nothing moves linearly (§5)
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOutCubic(t) {
  const t2 = t * 2;
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}
function easeOutElastic(t) {
  const c1 = 1.70158, c2 = c1 + 1;
  return t === 1 ? 1 : 1 - Math.pow(2, -c2 * t) * Math.sin((t * c2 - 0.75) * Math.PI / c1) * c1;
}

// Smooth target transition (used for brush size, color blending)
let targetBrushSize = 4;
let targetColor = [1, 0.8, 0.6];

// --- §5.3 Particles — pool-based, zero-allocation — ---
const MAX_PARTICLES = 500;
const PARTICLE_STRIDE = 9; // x,y,vx,vy,life,maxLife,r,g,b
const particles = new Float32Array(MAX_PARTICLES * PARTICLE_STRIDE); // x,y,vx,vy,life,maxLife,r,g,b
let particleCount = 0;

function spawnParticles(x, y, count, color, speed, life) {
  for (let i = 0; i < count && particleCount < MAX_PARTICLES; i++) {
    const p = i * PARTICLE_STRIDE;
    const angle = Math.random() * Math.PI * 2;
    const spd = speed * (0.3 + Math.random() * 0.7);
    particles[p]   = x;
    particles[p+1] = y;
    particles[p+2] = Math.cos(angle) * spd;
    particles[p+3] = Math.sin(angle) * spd;
    particles[p+4] = life * (0.5 + Math.random() * 0.5);
    particles[p+5] = life;
    particles[p+6] = color[0];
    particles[p+7] = color[1];
    particles[p+8] = color[2];
    particleCount++;
  }
}

function updateParticles(dt) {
  for (let i = 0; i < particleCount; i++) {
    const p = i * PARTICLE_STRIDE;
    particles[p+2] *= 0.96;   // drag
    particles[p+3] *= 0.96;
    particles[p]   += particles[p+2] * dt * 60;
    particles[p+1] += particles[p+3] * dt * 60;
    particles[p+4] -= dt;
    if (particles[p+4] <= 0) {
      // Recycle to end
      const empty = MAX_PARTICLES - 1;
      for (let j = 0; j < PARTICLE_STRIDE; j++) particles[p + j] = particles[empty * PARTICLE_STRIDE + j];
      empty--;
    }
  }
}

function drawParticles() {
  ctx.globalCompositeOperation = 'lighter';
  // Batch particles by colour bucket to reduce fillStyle changes (§6.2: batch by state)
  const BUCKET_SIZE = 8; // 8 colour buckets
  const buckets = new Array(BUCKET_SIZE);
  for (let b = 0; b < BUCKET_SIZE; b++) buckets[b] = [];

  // Classify particles into buckets by colour index
  for (let i = 0; i < particleCount; i++) {
    const p = i * PARTICLE_STRIDE;
    const cIdx = (particles[p+6] * BUCKET_SIZE) | 0;
    buckets[Math.min(cIdx, BUCKET_SIZE - 1)].push(i);
  }

  // Draw each bucket with a single fillStyle
  for (let b = 0; b < BUCKET_SIZE; b++) {
    if (buckets[b].length === 0) continue;
    const idx = buckets[b][0];
    const p = idx * PARTICLE_STRIDE;
    ctx.fillStyle = `rgba(${particles[p+6]*255|0},${particles[p+7]*255|0},${particles[p+8]*255|0},1)`;
    ctx.beginPath();
    for (let bi = 0; bi < buckets[b].length; bi++) {
      const qi = buckets[b][bi];
      const q = qi * PARTICLE_STRIDE;
      const alpha = particles[q+4] / particles[q+5];
      const size  = 2 + alpha * 3;
      // Apply squash/stretch based on velocity (§5.2)
      const { sx, sy } = applySquashStretch(particles[q], particles[q+1], particles[q+2], particles[q+3]);
      ctx.globalAlpha = alpha * 0.8;
      ctx.ellipse(particles[q], particles[q+1], size * sx, size * sy, 0, 0, Math.PI * 2);
    }
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

// --- §5.4 Screenshake — trauma value, noise offset + rotation — ---
let trauma = 0;
const SHAKE_MAX = 8;
const SHAKE_DECAY = 0.93;
let shakeNoiseSeed = 12345;

function addTrauma(amount) {
  trauma = Math.min(1, trauma + amount);
}

function updateShake() {
  if (trauma > 0.001) {
    trauma *= SHAKE_DECAY;
    // Smooth noise for offset — simple LCG noise
    shakeNoiseSeed = (shakeNoiseSeed * 1664525 + 1013904223) & 0x7fffffff;
    const noiseX = (shakeNoiseSeed / 0x7fffffff - 0.5) * 2;
    shakeNoiseSeed = (shakeNoiseSeed * 1664525 + 1013904223) & 0x7fffffff;
    const noiseY = (shakeNoiseSeed / 0x7fffffff - 0.5) * 2;
    // Noise for rotation
    shakeNoiseSeed = (shakeNoiseSeed * 1664525 + 1013904223) & 0x7fffffff;
    const noiseR = (shakeNoiseSeed / 0x7fffffff - 0.5) * 2;
    return {
      x: noiseX * trauma * SHAKE_MAX,
      y: noiseY * trauma * SHAKE_MAX,
      r: noiseR * trauma * 0.03
    };
  }
  return { x: 0, y: 0, r: 0 };
}

// --- §5.5 Sound — pentatonic synth, OFF by default (§0) ---
let audioCtx = null;
let soundEnabled = false;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

// Pentatonic scale: C major (220, 261.63, 293.66, 329.63, 392)
const PENTATONIC = [220, 261.63, 293.66, 329.63, 392];

function playSound(freq, duration, type = 'sine', volume = 0.15) {
  if (!soundEnabled || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

// Pick a random pentatonic note
function randomNote() {
  return PENTATONIC[Math.floor(Math.random() * PENTATONIC.length)];
}

// Sound triggers
function soundPour() {
  playSound(randomNote() * (0.8 + Math.random() * 0.4), 0.15, 'sine', 0.1);
}
function soundVortex() {
  playSound(randomNote() * 1.5, 0.2, 'triangle', 0.12);
}
function soundReset() {
  playSound(randomNote() * 2, 0.3, 'sine', 0.15);
}

// Sound toggle button
document.getElementById('sound-toggle').addEventListener('click', function() {
  initAudio();
  soundEnabled = !soundEnabled;
  this.textContent = soundEnabled ? '🔊 On' : '🔇 Muted';
  this.style.opacity = soundEnabled ? 1 : 0.7;
  document.getElementById('sound-state').textContent = soundEnabled ? '🔊 On' : '🔇 Muted';
});

// --- §5.2 Squash/Stretch — volume-preserving scale by velocity — ---
// Applied to ink brush rendering: droplets stretch in flow direction
function applySquashStretch(x, y, vx, vy) {
  const speed = Math.sqrt(vx * vx + vy * vy);
  if (speed < 0.01) return { sx: 1, sy: 1 };
  const stretch = 1 + speed * 0.015;
  return { sx: stretch, sy: 1 / stretch };
}

// --- §5 Hooks into existing event handlers ---
function onMouseDown(button, e) {
  if (button === 0)  mouseLeftDown  = true;
  if (button === 2)  mouseRightDown = true;
  // Trigger juice effects on events
  if (button === 0) {
    spawnParticles(mouseX, mouseY, 12, [1, 0.8, 0.6], 1.5, 1.0);
    addTrauma(0.08);
    soundPour();
  } else if (button === 2) {
    spawnParticles(mouseX, mouseY, 8, [0.6, 0.4, 1], 1.0, 0.8);
    addTrauma(0.06);
    soundVortex();
  }
}

function onMouseUp(button) {
  if (button === 0)  mouseLeftDown  = false;
  if (button === 2)  mouseRightDown = false;
}

/* ============================================================
 *  §3.5a Step 1: Add forces (mouse injection)
 * ============================================================ */
function addForces() {
  // Map mouse to grid coordinates
  const gx = (mouseX / w) * (GRID - 1);
  const gy = (mouseY / h) * (GRID - 1);

  // Left click: inject ink + outward radial force (push ink away from cursor)
  if (mouseLeftDown) {
    for (let cy = -inkBrushSize; cy <= inkBrushSize; cy++) {
      for (let cx = -inkBrushSize; cx <= inkBrushSize; cx++) {
        const dist = Math.sqrt(cx * cx + cy * cy);
        if (dist > inkBrushSize) continue;
        const g = 1 - dist / inkBrushSize;
        const ix = gx + cx, iy = gy + cy;
        const i = cell(ix, iy);
        // Outward radial force (pushes ink outward from cursor)
        vx[i] += (cx / inkBrushSize) * g * 0.5;
        vy[i] += (cy / inkBrushSize) * g * 0.5;
        // Inject dye
        const hue = inkDragColor;
        dyeR[i] += g * 0.02;
        dyeG[i] += hue[1] * g * 0.02;
        dyeB[i] += hue[2] * g * 0.02;
      }
    }
  }

  // Right click: vortex force (tangent to circle around cursor)
  if (mouseRightDown) {
    for (let cy = -inkBrushSize; cy <= inkBrushSize; cy++) {
      for (let cx = -inkBrushSize; cx <= inkBrushSize; cx++) {
        const dist = Math.sqrt(cx * cx + cy * cy);
        if (dist > inkBrushSize) continue;
        const g = 1 - dist / inkBrushSize;
        const ix = gx + cx, iy = gy + cy;
        const i = cell(ix, iy);
        // Tangential force (clockwise vortex)
        vx[i] -= (cy / inkBrushSize) * g * 0.3;
        vy[i] += (cx / inkBrushSize) * g * 0.3;
      }
    }
  }

  // Idle cursor motion: gentle stirring in direction of movement
  if (!mouseLeftDown && !mouseRightDown) {
    const dx = (mouseX / w - 0.5) * (GRID - 1) - gx;
    const dy = (mouseY / h - 0.5) * (GRID - 1) - gy;
    const speed = Math.sqrt(dx * dx + dy * dy);
    if (speed > 0.5) {
      const sx = dx / speed, sy = dy / speed;
      const i = cell(gx, gy);
      vx[i] += sx * 0.005;
      vy[i] += sy * 0.005;
    }
  }
}

/* ============================================================
 *  §3.5a Step 2: Advect velocity (semi-Lagrangian)
 * ============================================================ */
function advectVelocity() {
  // Reuse pre-allocated scratch arrays (§6.2)
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      const i = idx(x, y);
      const tx = x - vx[i] * 0.5;
      const ty = y - vy[i] * 0.5;
      auxVx[i] = sample(vx, tx, ty);
      auxVy[i] = sample(vy, tx, ty);
    }
  }

  for (let i = 0; i < GRID * GRID; i++) {
    vx[i] = auxVx[i];
    vy[i] = auxVy[i];
  }
}

/* ============================================================
 *  §3.5a Step 3: Diffuse velocity
 * ============================================================ */
function diffuseVelocity() {
  for (let step = 0; step < DIFFUSE_STEPS; step++) {
    for (let y = 1; y < GRID - 1; y++) {
      for (let x = 1; x < GRID - 1; x++) {
        const i = idx(x, y);
        vx[i] = 0.75 * vx[i] + 0.125 * (vx[i - GRID] + vx[i + GRID] + vx[i - 1] + vx[i + 1]);
        vy[i] = 0.75 * vy[i] + 0.125 * (vy[i - GRID] + vy[i + GRID] + vy[i - 1] + vy[i + 1]);
      }
    }
  }
}

/* ============================================================
 *  §3.5a Step 4: Project (divergence-free)
 * ============================================================ */
function projectVelocity() {
  // Reuse pre-allocated scratch arrays (§6.2)
  // Compute divergence
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      const i = idx(x, y);
      p[i] = 0.5 * (
        (x > 0 ? vx[i - 1] : 0) - (x < GRID - 1 ? vx[i + 1] : 0) +
        (y > 0 ? vy[i - GRID] : 0) - (y < GRID - 1 ? vy[i + GRID] : 0)
      );
    }
  }

  // Jacobi iterations
  for (let iter = 0; iter < PROJECT_ITER; iter++) {
    for (let y = 0; y < GRID; y++) {
      for (let x = 0; x < GRID; x++) {
        const i = idx(x, y);
        const sum = 1.0;
        if (x > 0) sum += 1;
        if (x < GRID - 1) sum += 1;
        if (y > 0) sum += 1;
        if (y < GRID - 1) sum += 1;
        ps[i] = 0.25 * (
          (x > 0 ? p[i - 1] : 0) + (x < GRID - 1 ? p[i + 1] : 0) +
          (y > 0 ? p[i - GRID] : 0) + (y < GRID - 1 ? p[i + GRID] : 0) - p[i]
        ) / sum;
      }
    }
  }

  // Subtract gradient
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      const i = idx(x, y);
      vx[i] -= 0.5 * (
        (x > 0 ? ps[i - 1] : 0) - (x < GRID - 1 ? ps[i + 1] : 0)
      );
      vy[i] -= 0.5 * (
        (y > 0 ? ps[i - GRID] : 0) - (y < GRID - 1 ? ps[i + GRID] : 0)
      );
    }
  }
}

/* ============================================================
 *  §3.5a Step 5: Advect dye (same semi-Lagrangian)
 * ============================================================ */
function advectDye() {
  // Reuse pre-allocated scratch arrays (§6.2)
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      const i = idx(x, y);
      const tx = x - vx[i] * 0.5;
      const ty = y - vy[i] * 0.5;
      auxR[i] = sample(dyeR, tx, ty);
      auxG[i] = sample(dyeG, tx, ty);
      auxB[i] = sample(dyeB, tx, ty);
    }
  }

  for (let i = 0; i < GRID * GRID; i++) {
    dyeR[i] = auxR[i];
    dyeG[i] = auxG[i];
    dyeB[i] = auxB[i];
  }
}

/* ============================================================
 *  §4 — Art style cookbook
 * ============================================================ */

// --- §4.5: Pre-computed colour palette lookup (§6.2: zero-allocation) ---
// 128 entries, indexed by (t * 128) | 0 — avoids per-cell array allocation
const PALETTE_SIZE = 128;
const paletteR = new Float32Array(PALETTE_SIZE);
const paletteG = new Float32Array(PALETTE_SIZE);
const paletteB = new Float32Array(PALETTE_SIZE);

  for (let i = 0; i < PALETTE_SIZE; i++) {
    const t = i / PALETTE_SIZE;
    paletteR[i] = inkPalette.a[0] + inkPalette.b[0] * Math.cos(6.28318 * (inkPalette.c[0] * t + inkPalette.d[0]));
    paletteG[i] = inkPalette.a[1] + inkPalette.b[1] * Math.cos(6.28318 * (inkPalette.c[1] * t + inkPalette.d[1]));
    paletteB[i] = inkPalette.a[2] + inkPalette.b[2] * Math.cos(6.28318 * (inkPalette.c[2] * t + inkPalette.d[2]));
  }
}

function _noiseHash(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return s - Math.floor(s);
}

function _noise2d(x, y) {
  const xi = Math.floor(x) & 0xff;
  const yi = Math.floor(y) & 0xff;
  const xf = x - Math.floor(x);
  const yf = y - Math.floor(y);
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  return _noiseHash(xi, yi) * (1 - u) * (1 - v)
       + _noiseHash(xi + 1, yi) * u * (1 - v)
       + _noiseHash(xi, yi + 1) * (1 - u) * v
       + _noiseHash(xi + 1, yi + 1) * u * v;
}

// Domain-warp a coordinate: p + k * noise(p)
function domainWarp(x, y, k) {
  return [
    x + k * _noise2d(x * 0.3, y * 0.3),
    y + k * _noise2d(x * 0.3 + 100, y * 0.3 + 100)
  ];
}

// --- §4.1: Cosine palette (tasteful, non-garish) ---
const inkPalette = {
  a: [0.45, 0.35, 0.20],
  b: [0.35, 0.25, 0.10],
  c: [1.0,  0.7,  0.4],
  d: [0.0,  0.35, 0.7]
};

// --- §4.5: Pre-computed colour palette lookup (§6.2: zero-allocation) ---
// 128 entries, indexed by (t * 128) | 0 — avoids per-cell array allocation
const PALETTE_SIZE = 128;
const paletteR = new Float32Array(PALETTE_SIZE);
const paletteG = new Float32Array(PALETTE_SIZE);
const paletteB = new Float32Array(PALETTE_SIZE);
{
  for (let i = 0; i < PALETTE_SIZE; i++) {
    const t = i / PALETTE_SIZE;
    paletteR[i] = inkPalette.a[0] + inkPalette.b[0] * Math.cos(6.28318 * (inkPalette.c[0] * t + inkPalette.d[0]));
    paletteG[i] = inkPalette.a[1] + inkPalette.b[1] * Math.cos(6.28318 * (inkPalette.c[1] * t + inkPalette.d[1]));
    paletteB[i] = inkPalette.a[2] + inkPalette.b[2] * Math.cos(6.28318 * (inkPalette.c[2] * t + inkPalette.d[2]));
  }
}

// --- §4.2: Pre-rendered glow sprite ---
let glowSprite = null;
function initGlowSprite() {
  glowSprite = document.createElement('canvas');
  glowSprite.width = glowSprite.height = 64;
  const g = glowSprite.getContext('2d').createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255, 200, 140, 1)');
  g.addColorStop(0.5, 'rgba(255, 140, 60, 0.35)');
  g.addColorStop(1, 'rgba(255, 100, 30, 0)');
  glowSprite.getContext('2d').fillStyle = g;
  glowSprite.getContext('2d').fillRect(0, 0, 64, 64);
}

// --- §4.4: Offscreen buffer for bloom pass ---
let bloomCanvas = null;
let bloomCtx = null;

function initBloomBuffer() {
  bloomCanvas = document.createElement('canvas');
  bloomCanvas.width = w;
  bloomCanvas.height = h;
  bloomCtx = bloomCanvas.getContext('2d');
}

function renderDye(alpha) {
  // Clear with dark background (§4.1: no pure black)
  ctx.fillStyle = '#0c0c1e';
  ctx.fillRect(0, 0, w, h);

  // --- Render dye field with domain-warped palette ---
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      const i = idx(x, y);
      const intensity = dyeR[i] + dyeG[i] + dyeB[i];
      if (intensity < 0.001) continue;

      // Domain-warp the colour index for organic texture
      const [wx, wy] = domainWarp(x / GRID, y / GRID, 0.15);
      const cw = Math.max(0, Math.min(1, (wx + 0.5) / 2));
      const ci = (cw * PALETTE_SIZE) | 0;
      const cr = paletteR[ci];
      const cg = paletteG[ci];
      const cb = paletteB[ci];

      // Blend palette colour with raw dye intensity
      const r = Math.min(255, (dyeR[i] * cr + dyeG[i] * 0.8) * 255);
      const g = Math.min(255, (dyeG[i] * cg + dyeB[i] * 0.6) * 255);
      const b = Math.min(255, (dyeB[i] * cb + dyeR[i] * 0.4) * 255);
      const a = Math.min(255, intensity * 80);

      gridData[i * 4] = r;
      gridData[i * 4 + 1] = g;
      gridData[i * 4 + 2] = b;
      gridData[i * 4 + 3] = a;
    }
  }
  gctx.putImageData(gridImageData, 0, 0);

  // Draw scaled up with smooth interpolation (§4.6: soft ink look)
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(gridCanvas, 0, 0, w, h);

  // --- §4.2: Additive glow pass ---
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.25;
  ctx.drawImage(gridCanvas, 0, 0, w, h);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  // --- §4.4: Bloom — blur + lighter for instant bloom ---
  bloomCtx.imageSmoothingEnabled = true;
  bloomCtx.filter = 'blur(8px)';
  bloomCtx.drawImage(canvas, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.12;
  ctx.drawImage(bloomCanvas, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

/* ============================================================
 *  §3.5a — Main simulation loop
 * ============================================================ */
function init() {
  // Reset all fields to zero
  for (let i = 0; i < GRID * GRID; i++) {
    vx[i] = 0; vy[i] = 0;
    dyeR[i] = 0; dyeG[i] = 0; dyeB[i] = 0;
  }
  inkBrushSize = 4;
  inkDragColor = [1, 0.8, 0.6];  // warm ink
  initGridCanvas();
  initGlowSprite();
  initBloomBuffer();
}

function reset() {
  init();
  inkBrushSize = 4;
  inkDragColor = [1, 0.8, 0.6];
  initGlowSprite();
  initBloomBuffer();
  soundReset();
}

// Start the simulation
init();

function update(dt) {
  addForces();
  advectVelocity();
  diffuseVelocity();
  projectVelocity();
  advectDye();

  // --- Juice: smooth brush size transition via easing (§5.1) ---
  const t = Math.min(1, dt * 60);
  inkBrushSize += (targetBrushSize - inkBrushSize) * easeOutCubic(t);
  document.getElementById('brush-size').textContent = Math.round(inkBrushSize);

  // --- Juice: update particles, shake ---
  juiceUpdate(dt);

  // --- Merge dye decay + clamping into a single pass (§6.2: one loop over grid) ---
  for (let i = 0; i < GRID * GRID; i++) {
    // Friction on velocity
    vx[i] *= FRICTION;
    vy[i] *= FRICTION;

    // Decay dye
    const dR = dyeR[i], dG = dyeG[i], dB = dyeB[i];
    dyeR[i] = dR * INK_DECAY;
    dyeG[i] = dG * INK_DECAY;
    dyeB[i] = dB * INK_DECAY;

    // Clamp dye intensity in one shot
    const total = dyeR[i] + dyeG[i] + dyeB[i];
    if (total > DYE_MAX) {
      const scale = DYE_MAX / total;
      dyeR[i] *= scale;
      dyeG[i] *= scale;
      dyeB[i] *= scale;
    }
  }
}

function draw(alpha) {
  renderDye(alpha);
  // --- Juice: draw particles on top ---
  juiceDraw(alpha);
}

/* ============================================================
 *  §5 Hooks: call juice update/draw from existing loops —
 * ============================================================ */
function juiceUpdate(dt) {
  updateParticles(dt);
  updateShake();
}

function juiceDraw(alpha) {
  // Apply screen shake transform
  const shake = updateShake();
  ctx.save();
  ctx.translate(shake.x, shake.y);
  ctx.rotate(shake.r);
  drawParticles();
  ctx.restore();
}

/* ============================================================
 *  Keyboard shortcut: R to reset (supplements the button, never replaces it)
 * ============================================================ */
document.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') {
    reset();
  }
});

/* ============================================================
 *  §3.5a — Bilinear sample helper (called by advect functions)
 * ============================================================ */
function sample(arr, x, y) {
  const i0 = Math.max(0, Math.floor(x) | 0);
  const i1 = Math.min(GRID - 1, Math.ceil(x) | 0);
  const j0 = Math.max(0, Math.floor(y) | 0);
  const j1 = Math.min(GRID - 1, Math.ceil(y) | 0);

  const xf = x - i0;
  const yf = y - j0;

  const v00 = arr[idx(i0, j0)];
  const v10 = arr[idx(i1, j0)];
  const v01 = arr[idx(i0, j1)];
  const v11 = arr[idx(i1, j1)];

  return v00 * (1 - xf) * (1 - yf) + v10 * xf * (1 - yf) +
            v01 * (1 - xf) * yf + v11 * xf * yf;
  }
