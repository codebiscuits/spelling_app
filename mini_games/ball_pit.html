<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics Sandbox</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: #0a0a0f;
overflow: hidden;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
cursor: crosshair;
user-select: none;
}
canvas {
display: block;
}
#ui {
position: fixed;
top: 16px;
left: 16px;
color: #ccc;
font-size: 13px;
pointer-events: none;
z-index: 10;
background: rgba(10, 10, 20, 0.75);
border: 1px solid rgba(255,255,255,0.08);
border-radius: 12px;
padding: 14px 18px;
backdrop-filter: blur(10px);
line-height: 1.7;
min-width: 220px;
}
#ui h3 {
color: #fff;
margin-bottom: 6px;
font-size: 14px;
letter-spacing: 0.5px;
}
#ui .param {
display: flex;
justify-content: space-between;
}
#ui .key {
color: #888;
}
#ui .val {
color: #6cf;
font-weight: 600;
font-variant-numeric: tabular-nums;
}
#ui .color-preview {
display: inline-block;
width: 12px; height: 12px;
border-radius: 50%;
vertical-align: middle;
margin-right: 6px;
border: 1px solid rgba(255,255,255,0.2);
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
<h3>⚛ Physics Sandbox</h3>
<div class="param"><span class="key">Left Click</span><span class="val">Spawn ball</span></div>
<div class="param"><span class="key">Right Click</span><span class="val">Explosion force</span></div>
<div class="param"><span class="key">Drag</span><span class="val">Throw ball</span></div>
<div class="param"><span class="key">Scroll</span><span class="val">Size: <span id="sizeVal">20</span></span></div>
<div class="param"><span class="key">Shift+Click</span><span class="val">New color</span></div>
<div class="param"><span class="key">C</span><span class="val">Clear all</span></div>
<div class="param"><span class="key">G</span><span class="val">Gravity: <span id="gravVal">ON</span></span></div>
<div class="param"><span class="key">Space</span><span class="val">Pause</span></div>
<br>
<div class="param"><span class="key">Current:</span><span><span class="color-preview" id="colorPreview"></span><span id="colorVal">#66ccff</span></span></div>
<div class="param"><span class="key">Balls:</span><span class="val" id="ballCount">0</span></div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- State ---
let balls = [];
let gravity = 0.4;
let paused = false;
let spawnSize = 20;
let spawnColor = '#66ccff';
let colorHue = 190;
let mouseDown = false;
let rightMouseDown = false;
let mouseX = 0, mouseY = 0;
let prevMouseX = 0, prevMouseY = 0;
let dragBall = null;
let explosionRadius = 180;
let explosionForce = 15;
let trailLength = 8;
let restitution = 0.75;
let friction = 0.999;
let maxBalls = 500;

// --- Color Utilities ---
function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    const a = s * Math.min(l, 1 - l);
    const f = n => {
        const k = (n + h / 30) % 12;
        const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
        return Math.round(255 * color).toString(16).padStart(2, '0');
    };
    return `#${f(0)}${f(8)}${f(4)}`;
}

function cycleColor() {
    colorHue = (colorHue + 25 + Math.random() * 15) % 360;
    spawnColor = hslToHex(colorHue, 80, 60);
    updateUI();
}

function updateUI() {
    document.getElementById('sizeVal').textContent = Math.round(spawnSize);
    document.getElementById('gravVal').textContent = gravity > 0 ? 'ON' : 'OFF';
    document.getElementById('colorVal').textContent = spawnColor;
    document.getElementById('colorPreview').style.background = spawnColor;
    document.getElementById('ballCount').textContent = balls.length;
}

// --- Ball Class ---
class Ball {
    constructor(x, y, vx, vy, radius, color) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.radius = radius;
        this.color = color;
        this.mass = radius * radius;
        this.trail = [];
        this.glowIntensity = 0;
    }

    update() {
        if (dragBall === this) return;

        // Store trail
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > trailLength) this.trail.shift();

        // Gravity
        this.vy += gravity;

        // Friction
        this.vx *= friction;
        this.vy *= friction;

        // Move
        this.x += this.vx;
        this.y += this.vy;

        // Wall collisions
        if (this.x - this.radius < 0) {
            this.x = this.radius;
            this.vx = Math.abs(this.vx) * restitution;
            this.glowIntensity = 1;
        }
        if (this.x + this.radius > W) {
            this.x = W - this.radius;
            this.vx = -Math.abs(this.vx) * restitution;
            this.glowIntensity = 1;
        }
        if (this.y - this.radius < 0) {
            this.y = this.radius;
            this.vy = Math.abs(this.vy) * restitution;
            this.glowIntensity = 1;
        }
        if (this.y + this.radius > H) {
            this.y = H - this.radius;
            this.vy = -Math.abs(this.vy) * restitution;
            this.glowIntensity = 1;
        }

        // Decay glow
        this.glowIntensity *= 0.92;
    }

    draw() {
        // Trail
        if (this.trail.length > 1) {
            for (let i = 1; i < this.trail.length; i++) {
                const alpha = (i / this.trail.length) * 0.3;
                const r = this.radius * (i / this.trail.length) * 0.7;
                ctx.beginPath();
                ctx.arc(this.trail[i].x, this.trail[i].y, r, 0, Math.PI * 2);
                ctx.fillStyle = this.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
                ctx.fill();
            }
        }

        // Glow
        if (this.glowIntensity > 0.05) {
            const glowGrad = ctx.createRadialGradient(this.x, this.y, this.radius * 0.5, this.x, this.y, this.radius * 2.5);
            glowGrad.addColorStop(0, this.color + Math.floor(this.glowIntensity * 80).toString(16).padStart(2, '0'));
            glowGrad.addColorStop(1, this.color + '00');
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius * 2.5, 0, Math.PI * 2);
            ctx.fillStyle = glowGrad;
            ctx.fill();
        }

        // Main ball
        const grad = ctx.createRadialGradient(
            this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.1,
            this.x, this.y, this.radius
        );
        grad.addColorStop(0, lightenColor(this.color, 40));
        grad.addColorStop(0.7, this.color);
        grad.addColorStop(1, darkenColor(this.color, 30));

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();

        // Highlight
        ctx.beginPath();
        ctx.arc(this.x - this.radius * 0.25, this.y - this.radius * 0.25, this.radius * 0.35, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fill();
    }
}

function lightenColor(hex, amount) {
    let r = parseInt(hex.slice(1, 3), 16);
    let g = parseInt(hex.slice(3, 5), 16);
    let b = parseInt(hex.slice(5, 7), 16);
    r = Math.min(255, r + amount);
    g = Math.min(255, g + amount);
    b = Math.min(255, b + amount);
    return `rgb(${r},${g},${b})`;
}

function darkenColor(hex, amount) {
    let r = parseInt(hex.slice(1, 3), 16);
    let g = parseInt(hex.slice(3, 5), 16);
    let b = parseInt(hex.slice(5, 7), 16);
    r = Math.max(0, r - amount);
    g = Math.max(0, g - amount);
    b = Math.max(0, b - amount);
    return `rgb(${r},${g},${b})`;
}

// --- Collision Detection ---
function resolveCollisions() {
    for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
            const a = balls[i];
            const b = balls[j];

            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const minDist = a.radius + b.radius;

            if (dist < minDist && dist > 0) {
                // Normal vector
                const nx = dx / dist;
                const ny = dy / dist;

                // Separate overlapping balls
                const overlap = (minDist - dist) / 2;
                a.x -= nx * overlap;
                a.y -= ny * overlap;
                b.x += nx * overlap;
                b.y += ny * overlap;

                // Relative velocity
                const dvx = a.vx - b.vx;
                const dvy = a.vy - b.vy;
                const dvDotN = dvx * nx + dvy * ny;

                // Don't resolve if moving apart
                if (dvDotN > 0) {
                    const totalMass = a.mass + b.mass;
                    const impulse = (2 * dvDotN) / totalMass;

                    a.vx -= impulse * b.mass * nx * restitution;
                    a.vy -= impulse * b.mass * ny * restitution;
                    b.vx += impulse * a.mass * nx * restitution;
                    b.vy += impulse * a.mass * ny * restitution;

                    a.glowIntensity = Math.min(1, a.glowIntensity + 0.5);
                    b.glowIntensity = Math.min(1, b.glowIntensity + 0.5);
                }
            }
        }
    }
}

// --- Explosion Force ---
function applyExplosion(cx, cy) {
    for (const ball of balls) {
        const dx = ball.x - cx;
        const dy = ball.y - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < explosionRadius && dist > 0) {
            const force = (1 - dist / explosionRadius) * explosionForce;
            ball.vx += (dx / dist) * force;
            ball.vy += (dy / dist) * force;
            ball.glowIntensity = 1;
        }
    }
}

// --- Explosion Visual ---
let explosions = [];
class Explosion {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 0;
        this.maxRadius = explosionRadius;
        this.alpha = 0.5;
    }
    update() {
        this.radius += (this.maxRadius - this.radius) * 0.2;
        this.alpha *= 0.9;
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 200, 100, ${this.alpha})`;
        ctx.lineWidth = 3;
        ctx.stroke();

        const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
        grad.addColorStop(0, `rgba(255, 220, 150, ${this.alpha * 0.3})`);
        grad.addColorStop(1, `rgba(255, 150, 50, 0)`);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
    }
    isDead() { return this.alpha < 0.01; }
}

// --- Grid for spatial optimization ---
const GRID_SIZE = 60;
let grid = {};

function buildGrid() {
    grid = {};
    for (let i = 0; i < balls.length; i++) {
        const b = balls[i];
        const gx = Math.floor(b.x / GRID_SIZE);
        const gy = Math.floor(b.y / GRID_SIZE);
        const key = `${gx},${gy}`;
        if (!grid[key]) grid[key] = [];
        grid[key].push(i);
    }
}

// --- Input Handling ---
canvas.addEventListener('mousedown', (e) => {
    e.preventDefault();
    mouseX = e.clientX;
    mouseY = e.clientY;
    prevMouseX = mouseX;
    prevMouseY = mouseY;

    if (e.button === 0) {
        mouseDown = true;
        if (e.shiftKey) {
            cycleColor();
        } else {
            const vx = (mouseX - prevMouseX) * 0.5;
            const vy = (mouseY - prevMouseY) * 0.5;
            if (balls.length < maxBalls) {
                const ball = new Ball(mouseX, mouseY, vx, vy, spawnSize, spawnColor);
                balls.push(ball);
                dragBall = ball;
            }
        }
    } else if (e.button === 2) {
        rightMouseDown = true;
        applyExplosion(mouseX, mouseY);
        explosions.push(new Explosion(mouseX, mouseY));
    }
});

canvas.addEventListener('mousemove', (e) => {
    prevMouseX = mouseX;
    prevMouseY = mouseY;
    mouseX = e.clientX;
    mouseY = e.clientY;

    if (dragBall) {
        dragBall.vx = (mouseX - prevMouseX) * 0.8;
        dragBall.vy = (mouseY - prevMouseY) * 0.8;
        dragBall.x = mouseX;
        dragBall.y = mouseY;
    }
});

canvas.addEventListener('mouseup', (e) => {
    if (e.button === 0) {
        mouseDown = false;
        if (dragBall) {
            dragBall = null;
        }
    } else if (e.button === 2) {
        rightMouseDown = false;
    }
});

canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    spawnSize = Math.max(3, Math.min(80, spawnSize - e.deltaY * 0.05));
    updateUI();
}, { passive: false });

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

window.addEventListener('keydown', (e) => {
    if (e.key === 'c' || e.key === 'C') {
        balls = [];
        explosions = [];
        updateUI();
    } else if (e.key === 'g' || e.key === 'G') {
        gravity = gravity > 0 ? 0 : 0.4;
        updateUI();
    } else if (e.key === ' ') {
        e.preventDefault();
        paused = !paused;
    }
});

// --- Continuous right-mouse explosion ---
let explosionTimer = 0;

// --- Render Background ---
function drawBackground() {
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, W, H);

    // Subtle grid
    ctx.strokeStyle = 'rgba(255,255,255,0.02)';
    ctx.lineWidth = 1;
    const gridSize = 50;
    for (let x = 0; x < W; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
    }
    for (let y = 0; y < H; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
    }
}

// --- Draw drag indicator ---
function drawDragIndicator() {
    if (dragBall) {
        ctx.beginPath();
        ctx.arc(dragBall.x, dragBall.y, dragBall.radius + 4, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]);
    }
}

// --- Draw explosion preview ---
function drawExplosionPreview() {
    if (rightMouseDown) {
        ctx.beginPath();
        ctx.arc(mouseX, mouseY, explosionRadius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 150, 50, 0.2)';
        ctx.lineWidth = 1;
        ctx.setLineDash([6, 6]);
        ctx.stroke();
        ctx.setLineDash([]);

        const grad = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, explosionRadius);
        grad.addColorStop(0, 'rgba(255, 200, 100, 0.08)');
        grad.addColorStop(1, 'rgba(255, 100, 50, 0)');
        ctx.beginPath();
        ctx.arc(mouseX, mouseY, explosionRadius, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
    }
}

// --- Main Loop ---
function loop() {
    requestAnimationFrame(loop);

    if (paused) {
        drawBackground();
        for (const b of balls) b.draw();
        for (const e of explosions) e.draw();
        drawDragIndicator();
        drawExplosionPreview();

        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('⏸ PAUSED', W / 2, H / 2);
        return;
    }

    // Continuous explosion
    if (rightMouseDown) {
        explosionTimer++;
        if (explosionTimer % 3 === 0) {
            applyExplosion(mouseX + (Math.random() - 0.5) * 20, mouseY + (Math.random() - 0.5) * 20);
        }
    } else {
        explosionTimer = 0;
    }

    // Physics substeps for stability
    const substeps = 2;
    for (let s = 0; s < substeps; s++) {
        for (const b of balls) b.update();
        resolveCollisions();
    }

    // Update explosions
    for (const e of explosions) e.update();
    explosions = explosions.filter(e => !e.isDead());

    // Draw
    drawBackground();

    // Draw explosions
    for (const e of explosions) e.draw();

    // Draw balls
    for (const b of balls) b.draw();

    drawDragIndicator();
    drawExplosionPreview();

    // Update UI
    updateUI();
}

// --- Initial demo balls ---
function spawnDemoBalls() {
    const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6bcb', '#c084fc', '#67e8f9', '#fbbf24'];
    for (let i = 0; i < 12; i++) {
        const x = W * 0.2 + Math.random() * W * 0.6;
        const y = H * 0.2 + Math.random() * H * 0.3;
        const r = 10 + Math.random() * 25;
        const vx = (Math.random() - 0.5) * 8;
        const vy = (Math.random() - 0.5) * 8;
        const color = colors[Math.floor(Math.random() * colors.length)];
        balls.push(new Ball(x, y, vx, vy, r, color));
    }
}

spawnDemoBalls();
updateUI();
loop();
</script>
</body>
</html>
