<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100">
  <!-- Ribbon bar -->
  <rect x="18" y="0" width="44" height="18" fill="#3A5BC7" rx="4"/>
  <!-- Ribbon to circle connector -->
  <polygon points="28,18 52,18 48,36 32,36" fill="#2E4AA0"/>
  <!-- Medal shadow -->
  <circle cx="42" cy="70" r="33" fill="#7A4A10" opacity="0.3"/>
  <!-- Medal outer ring -->
  <circle cx="40" cy="68" r="33" fill="#B87820" stroke="#8B5E10" stroke-width="3"/>
  <!-- Medal face -->
  <circle cx="40" cy="68" r="25" fill="#E8A030"/>
  <!-- Inner highlight ring -->
  <circle cx="40" cy="68" r="25" fill="none" stroke="#F0C060" stroke-width="3" opacity="0.6"/>
  <!-- Star on medal -->
  <polygon points="40,53 43,62 53,62 46,68 48,77 40,72 32,77 34,68 27,62 37,62"
           fill="#B87820" stroke="#8B5E10" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Shine -->
  <ellipse cx="32" cy="56" rx="5" ry="3" fill="white" opacity="0.25" transform="rotate(-30,32,56)"/>
</svg>
